<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPAZA — Roles & Permissions</title><link rel="stylesheet" href="css/style.css"><style>.wrap{max-width:1200px;margin:auto;padding:32px 18px 70px}.panel{background:#fff;border:1px solid #e2e6e7;border-radius:16px;padding:20px;margin-top:20px}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.toolbar input{padding:11px;border:1px solid #ddd;border-radius:8px;width:min(420px,100%)}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px 9px;border-bottom:1px solid #edf0f1;white-space:nowrap}.badge{padding:4px 8px;border-radius:999px;background:#eef2f1;font-size:.76rem;font-weight:700}.form{display:grid;grid-template-columns:1fr 1fr auto;gap:10px}.form select{padding:11px;border:1px solid #ddd;border-radius:8px}@media(max-width:700px){.form{grid-template-columns:1fr}.table th,.table td{white-space:normal}}</style></head><body><header class="site-header"><a class="logo-wrap" href="index.html"><img class="site-logo" src="images/spaza-logo.png" alt="Spaza"></a><div class="header-actions"><a href="admin-users.html">Users</a><a href="admin-audit.html">Audit</a></div></header><main class="wrap"><p class="eyebrow">ADMIN CENTRE</p><h1>Roles &amp; Permissions</h1><p class="page-intro">Manage staff role assignments. Role capabilities are enforced by secure database functions and RLS policies.</p><div id="gate" class="panel">Checking administrator access…</div><section id="content" hidden><div class="panel"><h2>Assign role</h2><form id="form" class="form"><select id="profile" required><option value="">Select profile</option></select><select id="role" required><option value="">Select role</option></select><button class="button" type="submit">Assign</button></form></div><div class="panel"><h2>Role assignments</h2><div class="toolbar"><input id="q" placeholder="Search name, profile or role"></div><div id="table" style="margin-top:15px">Loading…</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const db=SpazaDB,esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let rows=[],profiles=[],roles=[];async function init(){const{data:{user}}=await db.auth.getUser();if(!user){location.href='login.html';return}const{data:r,error}=await db.from('profile_roles').select('roles(code)').eq('profile_id',user.id);if(error)throw error;if(!(r||[]).some(x=>['ADMIN','OWNER'].includes(String(x.roles?.code||'').toUpperCase()))){gate.innerHTML='<strong>Administrator or owner access required.</strong>';return}gate.remove();content.hidden=false;await Promise.all([loadProfiles(),loadRoles(),loadAssignments()])}async function loadProfiles(){const{data,error}=await db.from('profiles').select('id,full_name,status').order('full_name');if(error)throw error;profiles=data||[];profile.innerHTML='<option value="">Select profile</option>'+profiles.map(x=>`<option value="${x.id}">${esc(x.full_name||x.id)} — ${esc(x.status)}</option>`).join('')}async function loadRoles(){const{data,error}=await db.from('roles').select('id,code,name,description').order('name');if(error)throw error;roles=data||[];role.innerHTML='<option value="">Select role</option>'+roles.map(x=>`<option value="${x.id}">${esc(x.name||x.code)}</option>`).join('')}async function loadAssignments(){const{data,error}=await db.from('profile_roles').select('profile_id,role_id,created_at,profiles(full_name,status),roles(code,name,description)').order('created_at',{ascending:false});if(error)throw error;rows=data||[];render()}function render(){const q=document.getElementById('q').value.toLowerCase(),a=rows.filter(x=>!q||JSON.stringify(x).toLowerCase().includes(q));table.innerHTML=!a.length?'<div style="text-align:center;padding:45px"><strong>No role assignments found.</strong><p>There are currently no visible role assignments.</p></div>':'<div class="table-wrap"><table class="table"><thead><tr><th>Profile</th><th>Status</th><th>Role</th><th>Description</th><th>Assigned</th><th></th></tr></thead><tbody>'+a.map(x=>`<tr><td>${esc(x.profiles?.full_name||x.profile_id)}</td><td>${esc(x.profiles?.status)}</td><td><span class="badge">${esc(x.roles?.name||x.roles?.code)}</span></td><td>${esc(x.roles?.description)}</td><td>${new Date(x.created_at).toLocaleString('en-ZA')}</td><td>${String(x.roles?.code||'').toUpperCase()==='OWNER'?'Protected':'<button class="button" onclick="removeRole(\''+x.profile_id+'\',\''+x.role_id+'\')">Remove</button>'}</td></tr>`).join('')}</tbody></table></div>'}async function removeRole(p,r){if(!confirm('Remove this role from the profile?'))return;const{error}=await db.rpc('admin_remove_profile_role',{p_profile_id:p,p_role_id:r});if(error){alert(error.message);return}await loadAssignments()}form.addEventListener('submit',async e=>{e.preventDefault();const{error}=await db.rpc('admin_assign_profile_role',{p_profile_id:profile.value,p_role_id:role.value});if(error){alert(error.message);return}form.reset();await loadAssignments()});q.addEventListener('input',render);window.removeRole=removeRole;init().catch(e=>gate.innerHTML='<strong>Roles centre could not load.</strong><p>'+esc(e.message)+'</p>');</script></body></html>

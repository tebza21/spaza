<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Spaza checkout review."><title>Checkout | Spaza</title><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header compact"><a class="brand" href="index.html"><img src="images/spaza-logo.png" alt="Spaza"></a><div class="site-search"><input id="searchInput" type="search" placeholder="Search products, brands and categories..." aria-label="Search products"><button id="searchBtn" aria-label="Search">⌕</button></div><div class="header-actions"><a href="login.html">Account</a><a href="cart.html">Cart <span id="cartCount">0</span></a></div></header><nav class="main-nav"><div class="nav-inner"><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="categories.html">Categories</a><a href="shop.html?deals=true">Deals</a><a href="partner.html">Become a Partner</a><a href="help.html">Help &amp; Support</a></div></nav><main class="simple-page checkout-page"><div class="breadcrumbs"><a href="cart.html">Cart</a> / Checkout</div><p class="eyebrow">CHECKOUT</p><h1>Review your order</h1><p class="page-intro">Confirm your details and fulfilment choices before payment.</p><div id="checkoutContent"><div class="empty"><h3>Loading checkout...</h3></div></div></main><footer><strong>SPAZA</strong><p>Secure checkout. Payment processing is not connected yet.</p></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const cart=JSON.parse(localStorage.getItem('spazaCart')||'[]'),el=document.getElementById('checkoutContent');if(!cart.length){el.innerHTML='<div class="empty"><h2>Your cart is empty</h2><a class="button primary" href="shop.html">Back to shop</a></div>';return}const groups={};cart.forEach(x=>(groups[x.seller]??=[]).push(x));const total=cart.reduce((s,x)=>s+Number(x.price)*Number(x.qty),0);el.innerHTML=`<div class="checkout-layout"><section><div class="card"><div class="checkout-step"><span>1</span><div><h2>Contact details</h2><p>Use the details needed for order communication.</p></div></div><div class="form-grid"><label>Full name<input id="checkoutName" autocomplete="name" required></label><label>Email<input id="checkoutEmail" type="email" autocomplete="email" required></label><label>Phone<input id="checkoutPhone" type="tel" autocomplete="tel" required></label></div><div class="checkout-step"><span>2</span><div><h2>Delivery address</h2><p>Seller-supported delivery or pickup options will be confirmed before payment.</p></div></div><label>Address<input id="checkoutAddress" autocomplete="street-address" placeholder="Street, suburb, city and postal code" required></label><div class="checkout-step"><span>3</span><div><h2>Seller fulfilments</h2><p>Your cart may contain separate fulfilments because sellers manage their own offers.</p></div></div><div class="fulfilment-list">${Object.entries(groups).map(([seller,items])=>`<div class="fulfilment-card"><strong>${escapeHtml(seller)}</strong>${items.map(x=>`<div class="fulfilment-line"><span>${escapeHtml(x.name)} × ${x.qty}</span><strong>R${(Number(x.price)*Number(x.qty)).toFixed(2)}</strong></div>`).join('')}<label>Preferred method<select><option>Choose at final order stage</option><option>Seller delivery</option><option>Courier</option><option>Customer pickup</option></select></label></div>`).join('')}</div><div class="notice"><strong>Payment not connected.</strong><br>This checkout is a review interface only. No payment will be charged and no real order will be created yet.</div><button id="payButton" class="button primary full" type="button">Continue to payment</button></div></section><aside class="summary"><p class="eyebrow">ORDER SUMMARY</p><h2>Order total</h2>${cart.map(x=>`<div><span>${escapeHtml(x.name)} × ${x.qty}</span><strong>R${(Number(x.price)*Number(x.qty)).toFixed(2)}</strong></div>`).join('')}<hr><div><span>Subtotal</span><strong>R${total.toFixed(2)}</strong></div><div><span>Delivery</span><span>Confirmed by seller</span></div><hr><div><strong>Total</strong><strong>R${total.toFixed(2)}</strong></div><a class="continue-shopping" href="cart.html">← Back to cart</a></aside></div>`;document.getElementById('payButton').onclick=()=>alert('Payment processing is not connected yet. No charge was made.');function escapeHtml(v){return String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}});</script><script src="js/app.js"></script></body></html>

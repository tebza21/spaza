<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | Spaza</title><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header"><a class="logo" href="index.html">SPAZA</a><button class="menu-button" id="menuButton">☰</button><nav class="desktop-nav"><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="partner.html">Become a Partner</a><a href="help.html">Help</a></nav><div class="header-actions"><a href="cart.html">Cart <span id="cartCount">0</span></a></div></header><aside class="drawer" id="drawer" aria-hidden="true"><button id="closeDrawer">×</button><a href="index.html">Home</a><a href="shop.html">Shop All</a><a href="orders.html">My Orders</a><a href="cart.html">Cart</a><a href="help.html">Help</a></aside><div class="overlay" id="overlay"></div><main class="simple-page"><p class="eyebrow">CHECKOUT</p><h1>Review your order</h1><div id="checkoutContent"></div></main><footer><strong>SPAZA</strong><p>Secure checkout. Payment processing will be connected to the selected provider before production launch.</p></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const cart=JSON.parse(localStorage.getItem('spazaCart')||'[]'),el=document.getElementById('checkoutContent');if(!cart.length){el.innerHTML='<div class="empty"><h2>Your cart is empty</h2><a class="button primary" href="shop.html">Back to shop</a></div>';return}const total=cart.reduce((s,x)=>s+Number(x.price)*Number(x.qty),0);el.innerHTML=`<div class="cart-layout"><section><div class="card"><h2>Delivery</h2><p>Choose from the delivery or pickup methods supported by each seller at the final order stage.</p><label>Delivery address<input id="address" placeholder="Enter your delivery address"></label><h2>Payment</h2><div class="notice">Payment provider integration is not live yet. This screen is a checkout UI placeholder; no payment will be charged.</div><button class="button primary" onclick="alert('Payment processing is not connected yet.')">Continue to payment</button></div></section><aside class="summary"><h3>Order summary</h3>${cart.map(x=>`<div><span>${x.name} × ${x.qty}</span><strong>R${(Number(x.price)*Number(x.qty)).toFixed(2)}</strong></div>`).join('')}<hr><div><strong>Total</strong><strong>R${total.toFixed(2)}</strong></div></aside></div>`});</script><script src="js/app.js"></script></body></html>

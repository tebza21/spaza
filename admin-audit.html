<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPAZA — Audit & Security</title><link rel="stylesheet" href="css/style.css"><style>.wrap{max-width:1250px;margin:auto;padding:32px 18px 70px}.panel{background:#fff;border:1px solid #e2e6e7;border-radius:16px;padding:20px;margin-top:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.metric{font-size:1.5rem;font-weight:800;margin-top:7px}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.toolbar input{padding:11px;border:1px solid #ddd;border-radius:8px;width:min(420px,100%)}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px 9px;border-bottom:1px solid #edf0f1;white-space:nowrap}.badge{padding:4px 8px;border-radius:999px;background:#eef2f1;font-size:.76rem;font-weight:700}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><header class="site-header"><a class="logo-wrap" href="index.html"><img class="site-logo" src="images/spaza-logo.png" alt="Spaza"></a><div class="header-actions"><a href="admin-users.html">Users</a><a href="admin-finance.html">Finance</a></div></header><main class="wrap"><p class="eyebrow">ADMIN CENTRE</p><h1>Audit &amp; Security</h1><p class="page-intro">Review administrative activity and trace important changes across the marketplace.</p><div id="gate" class="panel">Checking audit access…</div><section id="content" hidden><div class="grid"><div class="panel"><span>Total audit events</span><div class="metric" id="total">—</div></div><div class="panel"><span>Today</span><div class="metric" id="today">—</div></div><div class="panel"><span>Last 7 days</span><div class="metric" id="week">—</div></div></div><div class="panel"><div class="toolbar"><input id="q" placeholder="Search action, entity, reference, reason or actor"></div><div id="table" style="margin-top:15px">Loading…</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const db=SpazaDB,esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let rows=[];async function init(){const{data:{user}}=await db.auth.getUser();if(!user){location.href='login.html';return}const{data:r,error}=await db.from('profile_roles').select('roles(code)').eq('profile_id',user.id);if(error)throw error;const ok=(r||[]).some(x=>['ADMIN','OWNER','FINANCE','SUPPORT'].includes(String(x.roles?.code||'').toUpperCase()));if(!ok){gate.innerHTML='<strong>Audit access required.</strong>';return}gate.remove();content.hidden=false;const s=await db.rpc('admin_get_audit_summary');if(s.error)throw s.error;total.textContent=s.data?.total??0;today.textContent=s.data?.today??0;week.textContent=s.data?.last_7_days??0;await load()}async function load(){const{data,error}=await db.from('audit_logs').select('*').order('created_at',{ascending:false}).limit(500);if(error)throw error;rows=data||[];render()}function render(){const q=document.getElementById('q').value.toLowerCase(),a=rows.filter(x=>!q||JSON.stringify(x).toLowerCase().includes(q));table.innerHTML=!a.length?'<div style="text-align:center;padding:45px"><strong>No audit events found.</strong><p>Administrative events will appear here when recorded.</p></div>':'<div class="table-wrap"><table class="table"><thead><tr><th>Time</th><th>Audit</th><th>Action</th><th>Entity</th><th>Reference</th><th>Actor</th><th>Reason</th></tr></thead><tbody>'+a.map(x=>`<tr><td>${new Date(x.created_at).toLocaleString('en-ZA')}</td><td>${esc(x.audit_number)}</td><td><span class="badge">${esc(x.action)}</span></td><td>${esc(x.entity_type)}<br><small>${esc(x.entity_id)}</small></td><td>${esc(x.reference_type)}<br><small>${esc(x.reference_id)}</small></td><td>${esc(x.actor_profile_id)}</td><td>${esc(x.reason)}</td></tr>`).join('')+'</tbody></table></div>'}q.addEventListener('input',render);init().catch(e=>gate.innerHTML='<strong>Audit centre could not load.</strong><p>'+esc(e.message)+'</p>');</script></body></html>

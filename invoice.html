<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Invoice | Spaza</title><link rel="stylesheet" href="css/style.css"><style>.invoice-page{max-width:1000px;margin:auto;padding:40px 20px 70px}.invoice{background:#fff;border:1px solid #e1e5e6;border-radius:18px;padding:30px}.invoice-head{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;border-bottom:1px solid #e5e8e9;padding-bottom:24px}.invoice-number{font-size:1.25rem;font-weight:800}.muted{color:#68727a}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin:24px 0}.box{border:1px solid #e5e8e9;border-radius:12px;padding:16px}.table{width:100%;border-collapse:collapse;margin-top:20px}.table th,.table td{text-align:left;padding:12px 8px;border-bottom:1px solid #edf0f1}.table th:last-child,.table td:last-child{text-align:right}.totals{max-width:360px;margin:20px 0 0 auto}.row{display:flex;justify-content:space-between;padding:8px 0}.row.total{border-top:2px solid #111;margin-top:8px;font-weight:800;font-size:1.1rem}.tax-note{padding:12px;border-radius:10px;background:#f5f7f7;margin-top:20px;font-size:.9rem}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}@media(max-width:650px){.invoice-page{padding:25px 12px}.invoice{padding:20px}.grid{grid-template-columns:1fr}.table{font-size:.88rem}.table th,.table td{padding:9px 5px}}</style></head>
<body><header class="site-header"><a class="logo-wrap" href="index.html"><img class="site-logo" src="images/spaza-logo.png" alt="Spaza"></a><div class="header-actions"><a href="orders.html">Orders</a><a href="account.html">Account</a></div></header><main class="invoice-page"><div id="content"><div class="invoice"><p>Loading invoice…</p></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));const money=(v,c='ZAR')=>new Intl.NumberFormat('en-ZA',{style:'currency',currency:c}).format(Number(v||0));async function init(){const {data:{user}}=await SpazaDB.auth.getUser();if(!user){location.href='login.html?role=customer';return}const p=new URLSearchParams(location.search),id=p.get('invoice_id'),orderId=p.get('order_id');if(!id&&!orderId){document.getElementById('content').innerHTML='<div class="invoice"><h1>Invoice reference missing</h1><a class="button primary" href="orders.html">View orders</a></div>';return}let q=SpazaDB.from('invoices').select('id,invoice_number,order_id,status,currency,subtotal,delivery_total,discount_total,tax_total,total,amount_paid,amount_due,billing_details,delivery_details,issued_at,created_at,invoice_type,tax_rate_percent,tax_status,issuer_details,notes,invoice_items(id,product_id,seller_id,product_name,seller_name,quantity,unit_price,line_total)').eq('profile_id',user.id);q=id?q.eq('id',id):q.eq('order_id',orderId);const {data:i,error}=await q.maybeSingle();if(error||!i){document.getElementById('content').innerHTML='<div class="invoice"><h1>Invoice not found</h1><p class="muted">This invoice is not available for your account yet.</p><a class="button primary" href="orders.html">Back to orders</a></div>';return}const b=i.billing_details||{},d=i.delivery_details||{},issuer=i.issuer_details||{};document.getElementById('content').innerHTML=`<div class="actions"><a class="button" href="orders.html">← Back to orders</a><button class="button primary" onclick="window.print()">Print invoice</button></div><article class="invoice"><div class="invoice-head"><div><p class="eyebrow">SPAZA INVOICE</p><div class="invoice-number">${esc(i.invoice_number)}</div><p class="muted">Status: ${esc(i.status)}</p><p class="muted">Issued: ${i.issued_at?new Date(i.issued_at).toLocaleString('en-ZA'):'Not issued yet'}</p></div><div><strong>${esc(issuer.legal_name||issuer.business_name||'SPAZA')}</strong><p class="muted">Order: ${esc(i.order_id)}</p>${issuer.registration_number?`<p class="muted">Registration: ${esc(issuer.registration_number)}</p>`:''}</div></div><div class="grid"><div class="box"><strong>Bill to</strong><p>${esc(b.name||b.full_name||'Customer')}</p><p class="muted">${esc(b.email||'')}</p><p class="muted">${esc(b.phone||'')}</p><p class="muted">${esc(b.address||b.street||'')}</p></div><div class="box"><strong>Delivery</strong><p>${esc(d.name||b.name||'Customer')}</p><p class="muted">${esc(d.address||d.street||'')}</p><p class="muted">${esc(d.method||d.delivery_method||'')}</p></div></div><table class="table"><thead><tr><th>Product</th><th>Seller</th><th>Qty</th><th>Unit</th><th>Total</th></tr></thead><tbody>${(i.invoice_items||[]).map(x=>`<tr><td>${esc(x.product_name)}</td><td>${esc(x.seller_name)}</td><td>${Number(x.quantity||0)}</td><td>${money(x.unit_price,i.currency)}</td><td>${money(x.line_total,i.currency)}</td></tr>`).join('')||'<tr><td colspan="5">No invoice items.</td></tr>'}</tbody></table><div class="totals"><div class="row"><span>Subtotal</span><strong>${money(i.subtotal,i.currency)}</strong></div><div class="row"><span>Delivery</span><strong>${money(i.delivery_total,i.currency)}</strong></div><div class="row"><span>Discount</span><strong>−${money(i.discount_total,i.currency)}</strong></div><div class="row"><span>Tax</span><strong>${money(i.tax_total,i.currency)}</strong></div><div class="row total"><span>Total</span><strong>${money(i.total,i.currency)}</strong></div><div class="row"><span>Amount paid</span><strong>${money(i.amount_paid,i.currency)}</strong></div><div class="row"><span>Amount due</span><strong>${money(i.amount_due,i.currency)}</strong></div></div><div class="tax-note">Tax status: <strong>${esc(i.tax_status||'NOT_VAT_REGISTERED')}</strong> · Tax rate: <strong>${Number(i.tax_rate_percent||0).toFixed(2)}%</strong>. SPAZA is currently not VAT registered, so no VAT is charged.</div>${i.notes?`<p class="muted">${esc(i.notes)}</p>`:''}</article>`}init();</script></body></html>

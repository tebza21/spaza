<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPAZA — Seller Payouts</title><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header"><div class="container"><nav class="nav"><a class="brand" href="seller-centre.html">SPAZA</a><a href="seller-finance.html">Finance</a><a href="seller-payouts.html" aria-current="page">Payouts</a><a href="seller-centre.html">Seller Centre</a></nav></div></header><main class="container" style="padding:32px 16px"><section><h1>Payouts</h1><p>Request payouts from your available seller balance and track processing status.</p></section><section id="access" class="card" style="padding:20px;margin-top:20px"><p>Loading secure seller finance access…</p></section><section id="balance" class="card" style="padding:20px;margin-top:20px;display:none"><h2>Available balance</h2><div id="balanceAmount" style="font-size:32px;font-weight:700">R0.00</div><form id="payoutForm" style="margin-top:20px"><label for="amount">Payout amount (ZAR)</label><input id="amount" type="number" min="0.01" step="0.01" required><label for="method" style="display:block;margin-top:12px">Payout method</label><input id="method" type="text" maxlength="80" placeholder="e.g. Bank transfer"><button type="submit" style="margin-top:16px">Request payout</button><p id="formMessage" role="status"></p></form></section><section class="card" style="padding:20px;margin-top:20px"><h2>Payout history</h2><div id="payouts"><p>Sign in to view your payout history.</p></div></section></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const SUPABASE_URL='https://gbyujowoqalxtbhpdbod.supabase.co',SUPABASE_ANON_KEY=window.SUPABASE_ANON_KEY||'';const access=document.getElementById('access'),balance=document.getElementById('balance'),amount=document.getElementById('amount'),form=document.getElementById('payoutForm'),msg=document.getElementById('formMessage'),list=document.getElementById('payouts');if(!SUPABASE_ANON_KEY){access.innerHTML='<p>Supabase client configuration is required. Do not enter banking credentials on this page until the site configuration is supplied.</p>'}else{const sb=createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const money=n=>`R${Number(n||0).toFixed(2)}`;async function load(){const{data:{user}}=await sb.auth.getUser();if(!user){access.innerHTML='<p>Please sign in to access seller payouts.</p>';return}const{data:seller}=await sb.from('sellers').select('id').eq('profile_id',user.id).eq('status','ACTIVE').maybeSingle();if(!seller){access.innerHTML='<p>No active seller account is available.</p>';return}access.innerHTML='<strong>Secure seller finance area</strong>';balance.style.display='block';const{data:b}=await sb.from('seller_balances').select('available_amount,pending_amount,paid_amount').eq('seller_id',seller.id).maybeSingle();document.getElementById('balanceAmount').textContent=money(b?.available_amount);amount.max=Number(b?.available_amount||0);const{data:rows,error}=await sb.from('seller_payouts').select('payout_number,amount,currency,status,requested_at,processed_at,provider_reference,failure_reason').eq('seller_id',seller.id).order('created_at',{ascending:false});if(error){list.innerHTML='<p>Unable to load payout history.</p>';return}list.innerHTML=rows?.length?'<div>'+rows.map(r=>`<article style="border-top:1px solid #ddd;padding:14px 0"><strong>${r.payout_number}</strong><div>${money(r.amount)} ${r.currency||'ZAR'} · ${r.status}</div><small>Requested ${new Date(r.requested_at).toLocaleString()}</small>${r.failure_reason?`<div>${r.failure_reason}</div>`:''}</article>`).join('')+'</div>':'<p>No payouts yet.</p>'}form.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='Submitting…';const{data,error}=await sb.rpc('request_seller_payout',{p_amount:Number(amount.value),p_payout_method:document.getElementById('method').value||null});if(error){msg.textContent=error.message;return}msg.textContent=`Payout ${data.payout_number} requested successfully.`;form.reset();load()});load()}</script></body></html>

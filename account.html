<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Account | Spaza</title><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header"><a class="logo-wrap" href="index.html"><img class="site-logo" src="images/spaza-logo.png" alt="Spaza"></a><div class="header-actions"><a href="shop.html">Shop</a><a href="cart.html">Cart <span id="cartCount">0</span></a></div></header><main class="simple-page auth-page"><p class="eyebrow">SPAZA ACCOUNT</p><h1>My Account</h1><div id="accountContent" class="account-grid"><div class="empty">Loading account…</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>function esc(v){return String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}document.addEventListener('DOMContentLoaded',async()=>{const e=document.getElementById('accountContent');const {data:{user},error}=await SpazaDB.auth.getUser();if(error||!user){location.href='login.html?role=customer';return}const {data:roleRows}=await SpazaDB.from('profile_roles').select('roles(code,name)').eq('profile_id',user.id);const codes=(roleRows||[]).map(x=>String(x.roles?.code||x.roles?.name||'').toUpperCase());const isAdmin=codes.includes('ADMIN')||codes.includes('OWNER');const isSeller=codes.includes('SELLER')||codes.includes('PARTNER');const name=user.user_metadata?.full_name||'Customer';let portals='';if(isAdmin)portals+=`<div class="account-card"><span>🛡️</span><h2>Admin Centre</h2><p>Manage marketplace operations, sellers, customers, finance, security and configuration.</p><a class="button primary" href="admin-centre.html">Open Admin Centre</a></div>`;if(isSeller)portals+=`<div class="account-card"><span>🏪</span><h2>Seller Centre</h2><p>Manage your products, inventory, orders, fulfilment, finance and growth.</p><a class="button primary" href="seller-centre.html">Open Seller Centre</a></div>`;e.innerHTML=`<div class="account-card"><span>👤</span><h2>${esc(name)}</h2><p>${esc(user.email)}</p><a class="button primary" href="customer-dashboard.html">Customer Dashboard</a></div>${portals}<div class="account-card"><span>📦</span><h2>My Orders</h2><p>Track orders, deliveries and after-sales requests.</p><a class="button secondary" href="orders.html">View Orders</a></div><div class="account-card"><span>📍</span><h2>Addresses</h2><p>Manage your saved delivery addresses.</p><a class="button secondary" href="customer-addresses.html">Manage Addresses</a></div><div class="account-card"><span>❤️</span><h2>Wishlist</h2><p>Save products and manage your favourites.</p><a class="button secondary" href="customer-wishlist.html">Open Wishlist</a></div><div class="account-card"><span>★</span><h2>Reviews & Ratings</h2><p>Manage your product and seller reviews.</p><a class="button secondary" href="customer-reviews.html">My Reviews</a></div><div class="account-card"><span>🔔</span><h2>Notifications</h2><p>View important order, payment, delivery and support updates.</p><a class="button secondary" href="customer-notifications.html">View Notifications</a></div><div class="account-card"><span>💬</span><h2>Help & Support</h2><p>Contact Spaza support and follow your support tickets.</p><a class="button secondary" href="customer-support.html">Contact Support</a></div><div class="account-card"><span>⚙️</span><h2>Account</h2><p>Manage your Spaza sign-in session.</p><button class="button secondary" id="signOut">Sign out</button></div>`;document.getElementById('signOut').onclick=async()=>{await SpazaDB.auth.signOut();location.href='index.html'}});</script></body></html>

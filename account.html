<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Account | Spaza</title><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header"><a class="logo-wrap" href="index.html"><img class="site-logo" src="images/spaza-logo.png" alt="Spaza"></a><div class="header-actions"><a href="shop.html">Shop</a><a href="cart.html">Cart <span id="cartCount">0</span></a></div></header><main class="simple-page auth-page"><p class="eyebrow">CUSTOMER CENTRE</p><h1>My Account</h1><div id="accountContent" class="account-grid"><div class="empty">Loading account…</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>function esc(v){return String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}document.addEventListener('DOMContentLoaded',async()=>{const e=document.getElementById('accountContent');const {data:{user},error}=await SpazaDB.auth.getUser();if(error||!user){location.href='login.html?role=customer';return}const name=user.user_metadata?.full_name||'Customer';e.innerHTML=`<div class="account-card"><span>👤</span><h2>${esc(name)}</h2><p>${esc(user.email)}</p><a class="button primary" href="orders.html">My Orders</a></div><div class="account-card"><span>📍</span><h2>Addresses</h2><p>Your saved delivery addresses will be managed here.</p><span class="account-status">Coming next</span></div><div class="account-card"><span>❤️</span><h2>Wishlist</h2><p>Save products and manage your favourites.</p><span class="account-status">Coming next</span></div><div class="account-card"><span>⚙️</span><h2>Account</h2><p>Manage your Spaza sign-in session.</p><button class="button secondary" id="signOut">Sign out</button></div>`;document.getElementById('signOut').onclick=async()=>{await SpazaDB.auth.signOut();location.href='index.html'}});</script></body></html>

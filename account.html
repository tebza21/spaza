<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Account | Spaza</title><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header"><a class="logo-wrap" href="index.html"><img class="site-logo" src="images/spaza-logo.png" alt="Spaza"></a><div class="header-actions"><a href="shop.html">Shop</a><a href="cart.html">Cart <span id="cartCount">0</span></a></div></header><main class="simple-page auth-page"><p class="eyebrow">CUSTOMER CENTRE</p><h1>My Account</h1><div id="accountContent" class="account-grid"><div class="empty">Loading account…</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="js/supabase-auth.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{const e=document.getElementById('accountContent');const {data:{user}}=await SpazaDB.auth.getUser();if(!user){location.href='login.html?role=customer';return}const name=user.user_metadata?.full_name||'Customer';e.innerHTML=`<div class="account-card"><span>👤</span><h2>${Spaza.escapeHtml?Spaza.escapeHtml(name):name}</h2><p>${user.email}</p><a class="button primary" href="orders.html">My Orders</a></div><div class="account-card"><span>📍</span><h2>Addresses</h2><p>Manage your delivery addresses.</p><a class="button secondary" href="addresses.html">Manage addresses</a></div><div class="account-card"><span>❤️</span><h2>Wishlist</h2><p>Save products for later.</p><a class="button secondary" href="wishlist.html">View wishlist</a></div><div class="account-card"><span>⚙️</span><h2>Account settings</h2><p>Manage your account preferences.</p><button class="button secondary" onclick="SpazaDB.auth.signOut().then(()=>location.href='index.html')">Sign out</button></div>`});</script></body></html>

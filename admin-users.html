<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPAZA — User Management</title><link rel="stylesheet" href="css/style.css"><style>.wrap{max-width:1200px;margin:auto;padding:32px 18px 70px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.toolbar input,.toolbar select{padding:11px;border:1px solid #ddd;border-radius:8px}.panel{background:#fff;border:1px solid #e2e6e7;border-radius:16px;padding:20px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px 10px;border-bottom:1px solid #edf0f1;white-space:nowrap}.badge{padding:4px 8px;border-radius:999px;background:#eef2f1;font-size:.78rem;font-weight:700}.actions{display:flex;gap:7px;flex-wrap:wrap}</style></head><body><header class="site-header"><a class="logo-wrap" href="index.html"><img class="site-logo" src="images/spaza-logo.png" alt="Spaza"></a><div class="header-actions"><a href="admin-operations.html">Operations</a><a href="admin-seller-applications.html">Sellers</a></div></header><main class="wrap"><p class="eyebrow">ADMIN CENTRE</p><h1>Customer &amp; User Management</h1><p class="page-intro">Review platform profiles and their assigned roles. Authentication credentials remain managed by Supabase Auth.</p><div id="gate" class="panel">Checking administrator access…</div><section id="content" hidden><div class="toolbar"><input id="q" type="search" placeholder="Search name, phone or profile ID"><select id="status"><option value="">All statuses</option><option>ACTIVE</option><option>SUSPENDED</option><option>INACTIVE</option></select></div><div id="table" class="panel">Loading users…</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const db=SpazaDB,esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let users=[];async function init(){const{data:{user}}=await db.auth.getUser();if(!user){location.href='login.html';return}const{data:r,error}=await db.from('profile_roles').select('roles(name,code)').eq('profile_id',user.id);if(error)throw error;if(!(r||[]).some(x=>['ADMIN','OWNER'].includes(String(x.roles?.code||x.roles?.name||'').toUpperCase()))){document.getElementById('gate').innerHTML='<strong>Administrator access required.</strong>';return}document.getElementById('gate').remove();document.getElementById('content').hidden=false;await load()}async function load(){const{data,error}=await db.from('profiles').select('id,full_name,phone,status,created_at,updated_at,profile_roles(role_id,roles(name,code))').order('created_at',{ascending:false});if(error)throw error;users=data||[];render()}function render(){const q=document.getElementById('q').value.toLowerCase(),s=document.getElementById('status').value;const a=users.filter(x=>(!s||String(x.status).toUpperCase()===s)&&(!q||JSON.stringify(x).toLowerCase().includes(q)));if(!a.length){document.getElementById('table').innerHTML='<div style="text-align:center;padding:45px"><strong>No user profiles found.</strong><p>New customer and platform profiles will appear here when created.</p></div>';return}document.getElementById('table').innerHTML='<div class="table-wrap"><table class="table"><thead><tr><th>Name</th><th>Phone</th><th>Profile ID</th><th>Roles</th><th>Status</th><th>Created</th><th>Action</th></tr></thead><tbody>'+a.map(x=>{const rs=(x.profile_roles||[]).map(r=>r.roles?.name||r.roles?.code).filter(Boolean).join(', ')||'Customer';return `<tr><td>${esc(x.full_name)}</td><td>${esc(x.phone)}</td><td>${esc(x.id)}</td><td>${esc(rs)}</td><td><span class="badge">${esc(x.status)}</span></td><td>${new Date(x.created_at).toLocaleDateString('en-ZA')}</td><td><button class="button" onclick="toggle('${x.id}','${String(x.status).toUpperCase()==='SUSPENDED'?'ACTIVE':'SUSPENDED'}')">${String(x.status).toUpperCase()==='SUSPENDED'?'Reactivate':'Suspend'}</button></td></tr>`}).join('')+'</tbody></table></div>'}async function toggle(id,status){if(!confirm(status==='SUSPENDED'?'Suspend this profile?':'Reactivate this profile?'))return;const{error}=await db.rpc('admin_update_profile_status',{p_profile_id:id,p_status:status});if(error){alert(error.message);return}await load()}window.toggle=toggle;document.getElementById('q').addEventListener('input',render);document.getElementById('status').addEventListener('change',render);init().catch(e=>document.getElementById('gate').innerHTML='<strong>User management could not load.</strong><p>'+esc(e.message)+'</p>');</script></body></html>

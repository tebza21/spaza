<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPAZA — Catalogue Management</title><link rel="stylesheet" href="css/style.css"><style>.wrap{max-width:1200px;margin:auto;padding:32px 18px 70px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.toolbar input,.toolbar select{padding:11px;border:1px solid #ddd;border-radius:8px}.panel{background:#fff;border:1px solid #e2e6e7;border-radius:16px;padding:20px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px 10px;border-bottom:1px solid #edf0f1;white-space:nowrap}.badge{padding:4px 8px;border-radius:999px;background:#eef2f1;font-size:.78rem;font-weight:700}.actions{display:flex;gap:7px;flex-wrap:wrap}</style></head><body><header class="site-header"><a class="logo-wrap" href="index.html"><img class="site-logo" src="images/spaza-logo.png" alt="Spaza"></a><div class="header-actions"><a href="admin-operations.html">Operations</a><a href="admin-seller-applications.html">Sellers</a></div></header><main class="wrap"><p class="eyebrow">ADMIN CENTRE</p><h1>Catalogue Management</h1><p class="page-intro">Manage the master product catalogue and seller offers. Sellers remain responsible for their own offers, prices and stock.</p><div id="gate" class="panel">Checking administrator access…</div><section id="content" hidden><div class="toolbar"><input id="q" type="search" placeholder="Search product, SKU or seller offer"><select id="active"><option value="">All products</option><option value="true">Active</option><option value="false">Inactive</option></select></div><div id="table" class="panel">Loading catalogue…</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const db=SpazaDB,esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let products=[];async function init(){const{data:{user}}=await db.auth.getUser();if(!user){location.href='login.html';return}const{data:roles,error}=await db.from('profile_roles').select('roles(name,code)').eq('profile_id',user.id);if(error)throw error;const ok=(roles||[]).some(x=>['ADMIN','OWNER'].includes(String(x.roles?.code||x.roles?.name||'').toUpperCase()));if(!ok){document.getElementById('gate').innerHTML='<strong>Administrator access required.</strong>';return}document.getElementById('gate').remove();document.getElementById('content').hidden=false;await load()}async function load(){const{data,error}=await db.from('products').select('id,product_number,name,slug,brand_id,category_id,is_active,created_by,created_at').order('created_at',{ascending:false});if(error)throw error;products=data||[];render()}function render(){const q=document.getElementById('q').value.toLowerCase(),a=document.getElementById('active').value;const rows=products.filter(x=>(!a||String(x.is_active)===a)&&(!q||JSON.stringify(x).toLowerCase().includes(q)));if(!rows.length){document.getElementById('table').innerHTML='<div style="text-align:center;padding:45px"><strong>No products found.</strong><p>The master catalogue contains no matching records.</p></div>';return}document.getElementById('table').innerHTML='<div class="table-wrap"><table class="table"><thead><tr><th>Product</th><th>Name</th><th>Brand</th><th>Category</th><th>Status</th><th>Created</th><th>Action</th></tr></thead><tbody>'+rows.map(x=>`<tr><td>${esc(x.product_number||x.id)}</td><td>${esc(x.name)}</td><td>${esc(x.brand_id)}</td><td>${esc(x.category_id)}</td><td><span class="badge">${x.is_active?'ACTIVE':'INACTIVE'}</span></td><td>${new Date(x.created_at).toLocaleDateString('en-ZA')}</td><td><div class="actions"><button class="button" onclick="toggleProduct('${x.id}',${!x.is_active})">${x.is_active?'Deactivate':'Activate'}</button><button class="button" onclick="offers('${x.id}')">Seller offers</button></div></td></tr>`).join('')+'</tbody></table></div>'}async function toggleProduct(id,value){const{error}=await db.rpc('admin_update_product_status',{p_product_id:id,p_is_active:value});if(error){alert(error.message);return}await load()}async function offers(productId){const{data,error}=await db.from('seller_offers').select('id,offer_number,seller_id,price,cost_price,status,condition,created_at').eq('product_id',productId).order('created_at',{ascending:false});if(error){alert(error.message);return}if(!data?.length){alert('No seller offers are recorded for this product.');return}const text=data.map(x=>`${x.offer_number||x.id} | seller ${x.seller_id} | R${Number(x.price||0).toFixed(2)} | ${x.status}`).join('\n');const choice=prompt('Seller offers:\n\n'+text+'\n\nEnter an offer number to activate/deactivate, or Cancel:');if(!choice)return;const x=data.find(o=>(o.offer_number||o.id)===choice);if(!x){alert('Offer not found.');return}const status=x.status==='ACTIVE'?'INACTIVE':'ACTIVE';const{error:e}=await db.rpc('admin_update_seller_offer_status',{p_offer_id:x.id,p_status:status});if(e)alert(e.message);else alert('Offer set to '+status+'.')}window.toggleProduct=toggleProduct;window.offers=offers;document.getElementById('q').addEventListener('input',render);document.getElementById('active').addEventListener('change',render);init().catch(e=>document.getElementById('gate').innerHTML='<strong>Catalogue could not load.</strong><p>'+esc(e.message)+'</p>');</script></body></html>

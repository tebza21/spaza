<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Addresses | Spaza</title><link rel="stylesheet" href="css/style.css"><style>.wrap{max-width:900px;margin:auto;padding:40px 20px}.grid{display:grid;gap:16px}.address{border:1px solid #e3e6e8;border-radius:14px;padding:18px}.address-head{display:flex;justify-content:space-between;gap:12px}.badge{font-size:12px;padding:5px 9px;border-radius:99px;background:#eef5ee}.form{display:grid;gap:12px;margin:20px 0;padding:20px;border:1px solid #e3e6e8;border-radius:14px}.form input,.form textarea{padding:12px;border:1px solid #d8dde0;border-radius:8px;width:100%;box-sizing:border-box}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){.row{grid-template-columns:1fr}}</style></head><body><header class="site-header"><a class="logo-wrap" href="index.html"><img class="site-logo" src="images/spaza-logo.png" alt="Spaza"></a><div class="header-actions"><a href="account.html">Account</a><a href="cart.html">Cart</a></div></header><main class="wrap"><p class="eyebrow">CUSTOMER CENTRE</p><h1>Saved Addresses</h1><p>Manage the delivery addresses you use at checkout.</p><form id="form" class="form"><h2>Add address</h2><div class="row"><input name="label" placeholder="Label (e.g. Home)" required><input name="recipient_name" placeholder="Recipient name" required></div><input name="address_line1" placeholder="Address line 1" required><input name="address_line2" placeholder="Address line 2 (optional)"><div class="row"><input name="city" placeholder="City" required><input name="province" placeholder="Province" required></div><div class="row"><input name="postal_code" placeholder="Postal code" required><input name="phone" placeholder="Contact phone"></div><button class="button primary" type="submit">Save address</button><div id="message"></div></form><div id="list" class="grid"><div class="empty">Loading addresses…</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>let user;const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));async function load(){const {data:{user:u}}=await SpazaDB.auth.getUser();user=u;if(!user){location.href='login.html?role=customer';return}const {data,error}=await SpazaDB.from('customer_addresses').select('*').eq('profile_id',user.id).order('is_default',{ascending:false}).order('created_at',{ascending:false});if(error){list.innerHTML='<div class="empty">Unable to load addresses.</div>';return}list.innerHTML=data?.length?data.map(a=>`<article class="address"><div class="address-head"><strong>${esc(a.label||'Address')}</strong>${a.is_default?'<span class="badge">Default</span>':''}</div><p>${esc(a.recipient_name||'')}<br>${esc(a.address_line1||'')}<br>${a.address_line2?esc(a.address_line2)+'<br>':''}${esc(a.city||'')}, ${esc(a.province||'')} ${esc(a.postal_code||'')}</p>${a.phone?`<p>${esc(a.phone)}</p>`:''}<button class="button secondary" onclick="removeAddress('${a.id}')">Delete</button></article>`).join(''):'<div class="empty"><strong>No saved addresses</strong><p>Add one above and it will be available during checkout.</p></div>'}window.removeAddress=async id=>{if(!confirm('Delete this address?'))return;const {error}=await SpazaDB.from('customer_addresses').delete().eq('id',id).eq('profile_id',user.id);if(error)alert(error.message);else load()};form.onsubmit=async e=>{e.preventDefault();message.textContent='Saving…';const o=Object.fromEntries(new FormData(form));o.profile_id=user.id;o.is_default=false;const {error}=await SpazaDB.from('customer_addresses').insert(o);message.textContent=error?error.message:'Address saved.';if(!error){form.reset();load()}};load();</script></body></html>

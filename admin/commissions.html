<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Commission Rules | Admin Centre | Spaza</title><link rel="stylesheet" href="../css/style.css"><style>body{background:#f5f7f7}.wrap{max-width:1280px;margin:auto;padding:28px 20px 60px}.head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.panel{background:#fff;border:1px solid #e1e5e6;border-radius:16px;padding:20px;margin-top:20px}.form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input,.field select{width:100%;padding:11px;border:1px solid #ccd3cd;border-radius:8px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select{padding:11px;border:1px solid #ccd3cd;border-radius:8px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid #eee;white-space:nowrap}.pill{font-size:12px;padding:5px 8px;border-radius:999px;background:#eef1ef}.notice{padding:13px;border-radius:10px;background:#eef6ea;margin-top:14px}.danger{background:#fff0f0}@media(max-width:850px){.form-grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.form-grid{grid-template-columns:1fr}.head{flex-direction:column}}</style></head><body><header class="site-header compact"><a class="brand" href="../index.html"><img src="../images/spaza-logo.png" alt="Spaza"></a><div class="header-actions"><a href="index.html">Admin Centre</a><button id="logout" class="button">Sign out</button></div></header><main class="wrap"><div class="head"><div><p class="eyebrow">SPAZA ADMIN CENTRE</p><h1>Commission Rules</h1><p class="page-intro">Configure marketplace commission rules without hard-coding a rate. More specific rules are evaluated before general rules.</p></div></div><div id="gate" class="panel">Checking owner access…</div><section id="app" hidden><div class="panel"><h2>Create rule</h2><form id="form"><div class="form-grid"><div class="field"><label>Rule type</label><select id="type"><option>GLOBAL</option><option>CATEGORY</option><option>SELLER</option><option>PRODUCT</option></select></div><div class="field"><label>Category ID (for CATEGORY)</label><input id="category" placeholder="UUID"></div><div class="field"><label>Seller ID (for SELLER)</label><input id="seller" placeholder="UUID"></div><div class="field"><label>Product ID (for PRODUCT)</label><input id="product" placeholder="UUID"></div><div class="field"><label>Rate %</label><input id="rate" type="number" min="0" max="100" step="0.01" value="0"></div><div class="field"><label>Fixed amount (ZAR)</label><input id="fixed" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>Priority</label><input id="priority" type="number" min="0" step="1" value="100"></div><div class="field"><label>Valid from</label><input id="from" type="datetime-local"></div></div><div style="margin-top:14px"><button class="button primary">Create commission rule</button></div></form><div id="msg" class="notice" hidden></div></div><div class="panel"><div class="toolbar"><input id="search" placeholder="Search rule number or target"><select id="filter"><option value="">All rules</option><option value="true">Active</option><option value="false">Inactive</option></select></div><div id="table" class="table-wrap">Loading…</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script>const $=id=>document.getElementById(id),db=SpazaDB;let rules=[];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function show(t,b=false){$('msg').hidden=false;$('msg').className='notice'+(b?' danger':'');$('msg').textContent=t}async function init(){const {data:{user}}=await db.auth.getUser();if(!user){location.href='login.html';return}const {data:ok,error}=await db.rpc('is_owner');if(error||ok!==true){$('gate').innerHTML='<strong>Access denied.</strong><p>Owner access is required.</p>';return}$('gate').hidden=true;$('app').hidden=false;$('from').value=new Date().toISOString().slice(0,16);await load();$('logout').onclick=async()=>{await db.auth.signOut();location.href='login.html'}}async function load(){const {data,error}=await db.from('commission_rules').select('id,rule_number,rule_type,category_id,seller_id,product_id,rate_percent,fixed_amount,priority,is_active,valid_from,valid_until').order('priority',{ascending:true}).order('created_at',{ascending:false});if(error)throw error;rules=data||[];render()}function render(){const q=$('search').value.toLowerCase(),f=$('filter').value;const rows=rules.filter(x=>(!f||String(x.is_active)===f)&&(!q||JSON.stringify(x).toLowerCase().includes(q)));if(!rows.length){$('table').innerHTML='<div style="padding:40px;text-align:center;color:#667"><strong>No commission rules found.</strong><p>Create a rule above when the marketplace is ready.</p></div>';return}$('table').innerHTML='<table class="table"><thead><tr><th>Rule</th><th>Type</th><th>Target</th><th>Rate</th><th>Fixed</th><th>Priority</th><th>Validity</th><th>Status</th><th>Action</th></tr></thead><tbody>'+rows.map(x=>'<tr><td>'+esc(x.rule_number)+'</td><td>'+esc(x.rule_type)+'</td><td>'+esc(x.category_id||x.seller_id||x.product_id||'Global')+'</td><td>'+esc(x.rate_percent)+'%</td><td>R '+Number(x.fixed_amount||0).toFixed(2)+'</td><td>'+esc(x.priority)+'</td><td>'+new Date(x.valid_from).toLocaleDateString('en-ZA')+'</td><td><span class="pill">'+(x.is_active?'Active':'Inactive')+'</span></td><td><button class="button" onclick="toggleRule(\''+x.id+'\','+x.is_active+')">'+(x.is_active?'Deactivate':'Activate')+'</button></td></tr>').join('')+'</tbody></table>'}async function toggleRule(id,active){const x=rules.find(r=>r.id===id);if(!x)return;const {error}=await db.rpc('admin_update_commission_rule',{p_rule_id:id,p_rate_percent:Number(x.rate_percent),p_fixed_amount:Number(x.fixed_amount),p_priority:Number(x.priority),p_is_active:!active,p_valid_from:x.valid_from,p_valid_until:x.valid_until});if(error){show(error.message,true);return}await load()}$('form').onsubmit=async e=>{e.preventDefault();const type=$('type').value,category=$('category').value.trim()||null,seller=$('seller').value.trim()||null,product=$('product').value.trim()||null;if(type==='CATEGORY'&&!category)return show('Category ID is required for a CATEGORY rule.',true);if(type==='SELLER'&&!seller)return show('Seller ID is required for a SELLER rule.',true);if(type==='PRODUCT'&&!product)return show('Product ID is required for a PRODUCT rule.',true);if(type==='GLOBAL'&&(category||seller||product))return show('GLOBAL rules cannot contain a target ID.',true);const {error}=await db.rpc('admin_create_commission_rule',{p_rule_type:type,p_category_id:category,p_seller_id:seller,p_product_id:product,p_rate_percent:Number($('rate').value),p_fixed_amount:Number($('fixed').value),p_priority:Number($('priority').value),p_valid_from:new Date($('from').value).toISOString(),p_valid_until:null});if(error){show(error.message,true);return}show('Commission rule created.');e.target.reset();$('from').value=new Date().toISOString().slice(0,16);$('priority').value=100;await load()};['search','filter'].forEach(id=>$(id).addEventListener('input',render));init().catch(e=>show(e.message,true));</script></body></html>

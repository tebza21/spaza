<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>After-Sales | Admin Centre | Spaza</title><link rel="stylesheet" href="../css/style.css"><style>
body{background:#f5f7f7}.wrap{max-width:1280px;margin:auto;padding:28px 20px 60px}.head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:24px 0}.metric,.panel{background:#fff;border:1px solid #e1e5e6;border-radius:14px;padding:18px}.metric strong{display:block;font-size:1.7rem;margin-top:6px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.toolbar input,.toolbar select,.modal textarea,.modal select{padding:11px;border:1px solid #d9dddd;border-radius:8px}.table-wrap{overflow:auto}.data-table{width:100%;border-collapse:collapse}.data-table th,.data-table td{text-align:left;padding:13px;border-bottom:1px solid #eee;white-space:nowrap}.status{font-size:12px;padding:5px 8px;border-radius:999px;background:#eef1f1}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);align-items:center;justify-content:center;padding:18px;z-index:10}.modal.open{display:flex}.modal-card{background:#fff;border-radius:16px;width:min(680px,100%);max-height:90vh;overflow:auto;padding:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{padding:11px;background:#f7f8f8;border-radius:8px}.field small{display:block;color:#666;margin-bottom:4px}.modal textarea{width:100%;min-height:100px;box-sizing:border-box}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.empty{text-align:center;padding:45px;color:#666}@media(max-width:800px){.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}@media(max-width:520px){.cards{grid-template-columns:1fr}.head{flex-direction:column}}
</style></head><body><header class="site-header compact"><a class="brand" href="../index.html"><img src="../images/spaza-logo.png" alt="Spaza"></a><div class="header-actions"><a href="index.html">Admin Centre</a><button id="logout" class="button">Sign out</button></div></header>
<main class="wrap"><div class="head"><div><p class="eyebrow">SPAZA ADMIN CENTRE</p><h1>After-Sales</h1><p class="page-intro">Central review of customer returns and disputes. Only real database cases are shown.</p></div></div><div id="gate" class="panel">Checking owner access…</div><section id="app" hidden><div class="cards"><div class="metric">Open Returns<strong id="rc">—</strong></div><div class="metric">Open Disputes<strong id="dc">—</strong></div><div class="metric">Awaiting Seller<strong id="ac">—</strong></div><div class="metric">Resolved<strong id="xc">—</strong></div></div><div class="toolbar"><input id="search" type="search" placeholder="Search reference or order"><select id="type"><option value="">All cases</option><option value="return">Returns</option><option value="dispute">Disputes</option></select><select id="status"><option value="">All statuses</option><option>REQUESTED</option><option>APPROVED</option><option>RECEIVED</option><option>INSPECTING</option><option>SUBMITTED</option><option>UNDER_REVIEW</option><option>AWAITING_SELLER_RESPONSE</option><option>AWAITING_CUSTOMER_INFO</option><option>DECISION_PENDING</option><option>RESOLVED</option><option>REJECTED</option><option>CANCELLED</option></select></div><div id="table" class="panel"><div class="empty">Loading…</div></div></section></main>
<div id="modal" class="modal"><div class="modal-card"><div id="body"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script>
const db=SpazaDB;let cases=[];const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const upper=v=>String(v||'').toUpperCase();const money=v=>v==null?'—':new Intl.NumberFormat('en-ZA',{style:'currency',currency:'ZAR'}).format(Number(v));
async function init(){const {data:{user}}=await db.auth.getUser();if(!user){location.href='login.html';return}const {data,error}=await db.rpc('is_owner');if(error||data!==true){document.getElementById('gate').innerHTML='<strong>Access denied.</strong><p>Owner access is required for the After-Sales Centre.</p>';return}document.getElementById('gate').remove();document.getElementById('app').hidden=false;await load();document.getElementById('logout').onclick=async()=>{await db.auth.signOut();location.href='login.html'};}
async function load(){const [r,d]=await Promise.all([db.from('returns').select('*').order('created_at',{ascending:false}),db.from('disputes').select('*').order('created_at',{ascending:false})]);if(r.error)throw r.error;if(d.error)throw d.error;cases=[...(r.data||[]).map(x=>({...x,case_type:'return'})),...(d.data||[]).map(x=>({...x,case_type:'dispute'}))].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));render();}
function render(){const closed=['RESOLVED','COMPLETED','CANCELLED','REJECTED'];document.getElementById('rc').textContent=cases.filter(x=>x.case_type==='return'&&!closed.includes(upper(x.status))).length;document.getElementById('dc').textContent=cases.filter(x=>x.case_type==='dispute'&&!closed.includes(upper(x.status))).length;document.getElementById('ac').textContent=cases.filter(x=>upper(x.status)==='AWAITING_SELLER_RESPONSE').length;document.getElementById('xc').textContent=cases.filter(x=>['RESOLVED','COMPLETED'].includes(upper(x.status))).length;const q=document.getElementById('search').value.toLowerCase(),t=document.getElementById('type').value,s=upper(document.getElementById('status').value);const rows=cases.filter(x=>(!t||x.case_type===t)&&(!s||upper(x.status)===s)&&(!q||JSON.stringify(x).toLowerCase().includes(q)));if(!rows.length){document.getElementById('table').innerHTML='<div class="empty"><strong>No cases found.</strong><p>There are currently no matching returns or disputes.</p></div>';return}document.getElementById('table').innerHTML='<div class="table-wrap"><table class="data-table"><thead><tr><th>Type</th><th>Reference</th><th>Order</th><th>Status</th><th>Amount</th><th>Created</th><th></th></tr></thead><tbody>'+rows.map(x=>'<tr><td>'+esc(x.case_type==='return'?'Return':'Dispute')+'</td><td>'+esc(x.return_number||x.dispute_number||x.id)+'</td><td>'+esc(x.order_id||'—')+'</td><td><span class="status">'+esc(x.status)+'</span></td><td>'+money(x.amount_disputed??x.amount)+'</td><td>'+new Date(x.created_at).toLocaleString('en-ZA')+'</td><td><button class="button" onclick="openCase(\''+x.id+'\',\''+x.case_type+'\')">Review</button></td></tr>').join('')+'</tbody></table></div>';}
function openCase(id,type){const x=cases.find(c=>c.id===id&&c.case_type===type);if(!x)return;const ref=x.return_number||x.dispute_number||x.id;document.getElementById('body').innerHTML='<div style="display:flex;justify-content:space-between;gap:12px"><div><p class="eyebrow">'+upper(type)+'</p><h2>'+esc(ref)+'</h2></div><button class="button" onclick="closeCase()">Close</button></div><div class="grid"><div class="field"><small>Status</small>'+esc(x.status)+'</div><div class="field"><small>Order</small>'+esc(x.order_id||'—')+'</div><div class="field"><small>Reason</small>'+esc(x.reason||'—')+'</div><div class="field"><small>Amount</small>'+money(x.amount_disputed??x.amount)+'</div></div><p><strong>Customer description / notes</strong></p><p>'+esc(x.customer_notes||x.description||'No notes provided.')+'</p><label><strong>Decision / resolution</strong><textarea id="resolution" placeholder="Record the decision or resolution…">'+esc(x.resolution||'')+'</textarea></label><label><strong>Decision notes</strong><textarea id="notes" placeholder="Record supporting notes…">'+esc(x.resolution_notes||x.decision_notes||'')+'</textarea></label><div class="actions">'+actions(x)+'</div>';document.getElementById('modal').classList.add('open');}
function actions(x){if(x.case_type==='return'){if(['REQUESTED','APPROVED','INSPECTING'].includes(upper(x.status)))return '<button class="button primary" onclick="decide(\''+x.id+'\',\'return\',\'APPROVE\')">Approve</button><button class="button" onclick="decide(\''+x.id+'\',\'return\',\'REJECT\')">Reject</button>';if(upper(x.status)==='RECEIVED')return '<button class="button primary" onclick="decide(\''+x.id+'\',\'return\',\'COMPLETE\')">Complete Return</button>';}else if(['SUBMITTED','UNDER_REVIEW','AWAITING_SELLER_RESPONSE','AWAITING_CUSTOMER_INFO','DECISION_PENDING'].includes(upper(x.status)))return '<button class="button primary" onclick="decide(\''+x.id+'\',\'dispute\',\'RESOLVE\')">Resolve</button><button class="button" onclick="decide(\''+x.id+'\',\'dispute\',\'REJECT\')">Reject</button>';return '<span class="muted">No decision action available for this status.</span>';}
async function decide(id,type,action){const resolution=document.getElementById('resolution')?.value.trim()||null,notes=document.getElementById('notes')?.value.trim()||null;if(!confirm('Apply '+action+' to this case?'))return;const res=type==='return'?await db.rpc('admin_resolve_return',{p_return_id:id,p_action:action,p_notes:notes}):await db.rpc('admin_resolve_dispute',{p_dispute_id:id,p_action:action,p_resolution:resolution,p_notes:notes});if(res.error){alert(res.error.message);return}closeCase();await load();alert('Case updated successfully.');}
function closeCase(){document.getElementById('modal').classList.remove('open');document.getElementById('body').innerHTML='';}['search','type','status'].forEach(id=>document.getElementById(id).addEventListener('input',render));document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeCase()});init().catch(e=>{document.getElementById('gate').innerHTML='<strong>Could not load After-Sales.</strong><p>'+esc(e.message)+'</p>';});
</script></body></html>

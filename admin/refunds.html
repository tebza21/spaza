<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Refunds | Admin Centre | Spaza</title><link rel="stylesheet" href="../css/style.css"><style>body{background:#f5f7f7}.wrap{max-width:1280px;margin:auto;padding:28px 20px 60px}.panel,.metric{background:#fff;border:1px solid #e1e5e6;border-radius:14px;padding:18px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:24px 0}.metric strong{display:block;font-size:1.7rem;margin-top:6px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.toolbar input,.toolbar select,.modal input,.modal select{padding:11px;border:1px solid #d9dddd;border-radius:8px}.table-wrap{overflow:auto}.data-table{width:100%;border-collapse:collapse}.data-table th,.data-table td{text-align:left;padding:13px;border-bottom:1px solid #eee;white-space:nowrap}.status{font-size:12px;padding:5px 8px;border-radius:999px;background:#eef1f1}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);align-items:center;justify-content:center;padding:18px;z-index:10}.modal.open{display:flex}.modal-card{background:#fff;border-radius:16px;width:min(650px,100%);padding:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}.field{padding:11px;background:#f7f8f8;border-radius:8px}.field small{display:block;color:#666}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.empty{text-align:center;padding:45px;color:#666}@media(max-width:800px){.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}@media(max-width:520px){.cards{grid-template-columns:1fr}}</style></head><body><header class="site-header compact"><a class="brand" href="../index.html"><img src="../images/spaza-logo.png" alt="Spaza"></a><div class="header-actions"><a href="index.html">Admin Centre</a><button id="logout" class="button">Sign out</button></div></header><main class="wrap"><p class="eyebrow">SPAZA ADMIN CENTRE</p><h1>Refund Management</h1><p class="page-intro">Review refund requests and record payment-provider references. Refund execution itself must remain with the configured payment provider.</p><div id="gate" class="panel">Checking owner access…</div><section id="app" hidden><div class="cards"><div class="metric">Requested<strong id="requested">—</strong></div><div class="metric">Processing<strong id="processing">—</strong></div><div class="metric">Refunded<strong id="refunded">—</strong></div><div class="metric">Failed<strong id="failed">—</strong></div></div><div class="toolbar"><input id="search" type="search" placeholder="Search refund, return or order"><select id="status"><option value="">All statuses</option><option>REQUESTED</option><option>PENDING</option><option>PROCESSING</option><option>PARTIALLY_REFUNDED</option><option>REFUNDED</option><option>FAILED</option><option>CANCELLED</option></select></div><div id="table" class="panel"><div class="empty">Loading…</div></div></section></main><div id="modal" class="modal"><div class="modal-card"><div id="body"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script>const db=SpazaDB;let rows=[];const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const upper=v=>String(v||'').toUpperCase();const money=v=>new Intl.NumberFormat('en-ZA',{style:'currency',currency:'ZAR'}).format(Number(v||0));async function init(){const {data:{user}}=await db.auth.getUser();if(!user){location.href='login.html';return}const {data,error}=await db.rpc('is_owner');if(error||data!==true){document.getElementById('gate').innerHTML='<strong>Access denied.</strong><p>Owner access is required.</p>';return}document.getElementById('gate').remove();document.getElementById('app').hidden=false;await load();document.getElementById('logout').onclick=async()=>{await db.auth.signOut();location.href='login.html'};}async function load(){const {data,error}=await db.from('refunds').select('*').order('created_at',{ascending:false});if(error)throw error;rows=data||[];render()}function render(){const count=s=>rows.filter(x=>upper(x.status)===s).length;requested.textContent=count('REQUESTED');processing.textContent=rows.filter(x=>['PENDING','PROCESSING','PARTIALLY_REFUNDED'].includes(upper(x.status))).length;refunded.textContent=count('REFUNDED');failed.textContent=count('FAILED');const q=search.value.toLowerCase(),s=upper(status.value),list=rows.filter(x=>(!s||upper(x.status)===s)&&(!q||JSON.stringify(x).toLowerCase().includes(q)));if(!list.length){table.innerHTML='<div class="empty"><strong>No refunds found.</strong><p>No matching refund records exist.</p></div>';return}table.innerHTML='<div class="table-wrap"><table class="data-table"><thead><tr><th>Refund</th><th>Return</th><th>Order</th><th>Amount</th><th>Status</th><th>Provider ref</th><th>Created</th><th></th></tr></thead><tbody>'+list.map(x=>'<tr><td>'+esc(x.refund_number)+'</td><td>'+esc(x.return_id||'—')+'</td><td>'+esc(x.order_id||'—')+'</td><td>'+money(x.amount)+'</td><td><span class="status">'+esc(x.status)+'</span></td><td>'+esc(x.provider_refund_id||x.provider_reference||'—')+'</td><td>'+new Date(x.created_at).toLocaleString('en-ZA')+'</td><td><button class="button" onclick="review(\''+x.id+'\')">Review</button></td></tr>').join('')+'</tbody></table></div>';}function review(id){const x=rows.find(r=>r.id===id);if(!x)return;document.getElementById('body').innerHTML='<div style="display:flex;justify-content:space-between"><div><p class="eyebrow">REFUND</p><h2>'+esc(x.refund_number)+'</h2></div><button class="button" onclick="closeModal()">Close</button></div><div class="grid"><div class="field"><small>Status</small>'+esc(x.status)+'</div><div class="field"><small>Amount</small>'+money(x.amount)+'</div><div class="field"><small>Order</small>'+esc(x.order_id||'—')+'</div><div class="field"><small>Return</small>'+esc(x.return_id||'—')+'</div></div><label>Status<select id="newStatus"><option>REQUESTED</option><option>PENDING</option><option>PROCESSING</option><option>PARTIALLY_REFUNDED</option><option>REFUNDED</option><option>FAILED</option><option>CANCELLED</option></select></label><br><label>Provider refund ID<input id="providerId" value="'+esc(x.provider_refund_id||'')+'" placeholder="Returned by payment provider"></label><br><label>Provider reference<input id="providerRef" value="'+esc(x.provider_reference||'')+'" placeholder="Provider transaction/reference"></label><br><label>Failure reason<input id="failure" value="'+esc(x.failure_reason||'')+'"></label><div class="actions"><button class="button primary" onclick="saveRefund(\''+id+'\')">Save Refund Status</button></div>';newStatus.value=x.status;document.getElementById('modal').classList.add('open');}async function saveRefund(id){const res=await db.rpc('admin_update_refund',{p_refund_id:id,p_status:newStatus.value,p_provider_refund_id:providerId.value.trim()||null,p_provider_reference:providerRef.value.trim()||null,p_failure_reason:failure.value.trim()||null});if(res.error){alert(res.error.message);return}closeModal();await load();alert('Refund updated.');}function closeModal(){modal.classList.remove('open');body.innerHTML=''}window.review=review;window.saveRefund=saveRefund;window.closeModal=closeModal;['search','status'].forEach(id=>document.getElementById(id).addEventListener('input',render));init().catch(e=>{gate.innerHTML='<strong>Could not load refunds.</strong><p>'+esc(e.message)+'</p>';});</script></body></html>

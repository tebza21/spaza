<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Private Admin Login | Spaza</title><link rel="stylesheet" href="../css/style.css"><style>body{min-height:100vh;background:#0b0d0e;color:#fff;display:grid;place-items:center}.admin-login{width:min(460px,calc(100% - 32px));background:#151819;border:1px solid #2b3032;border-radius:20px;padding:32px;box-sizing:border-box}.admin-login img{width:120px;margin-bottom:22px}.admin-login h1{margin:0 0 8px}.admin-login p{color:#aeb7ba;line-height:1.5}.admin-login label{display:grid;gap:7px;margin:16px 0;font-weight:700}.admin-login input{padding:13px;border-radius:10px;border:1px solid #394043;background:#0f1213;color:#fff;font:inherit}.admin-login button{width:100%;margin-top:8px}.status{margin-top:16px;padding:12px;border-radius:10px;background:#202526;color:#cbd2d4}.back{display:inline-block;margin-top:20px;color:#cbd2d4}</style></head><body><main class="admin-login"><img src="../images/spaza-logo.png" alt="Spaza"><p class="eyebrow">PRIVATE ADMIN CENTRE</p><h1>Owner sign in</h1><p>This area is restricted. Only an account with the SPAZA <strong>OWNER</strong> role can continue.</p><form id="loginForm"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button class="button primary" type="submit">Sign in securely</button></form><div id="status" class="status" hidden></div><a class="back" href="../index.html">← Back to SPAZA</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script>const status=document.getElementById('status');const show=m=>{status.hidden=false;status.textContent=m};async function owner(){const {data:{user}}=await SpazaDB.auth.getUser();if(!user)return false;const {data,error}=await SpazaDB.rpc('is_owner');if(error||data!==true)return false;location.href='index.html';return true}document.addEventListener('DOMContentLoaded',async()=>{await owner();});document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();show('Signing in…');const {error}=await SpazaDB.auth.signInWithPassword({email:email.value,password:password.value});if(error){show('Sign-in failed. Check your credentials.');return}if(!(await owner())){await SpazaDB.auth.signOut();show('Access denied. This account is not the SPAZA owner account.');}});</script></body></html>

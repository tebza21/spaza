<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPAZA — Support Centre</title><link rel="stylesheet" href="css/style.css"><style>.wrap{max-width:1200px;margin:auto;padding:32px 18px 70px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.toolbar input,.toolbar select{padding:11px;border:1px solid #ddd;border-radius:8px}.panel{background:#fff;border:1px solid #e2e6e7;border-radius:16px;padding:20px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px 10px;border-bottom:1px solid #edf0f1;white-space:nowrap}.badge{padding:4px 8px;border-radius:999px;background:#eef2f1;font-size:.78rem;font-weight:700}.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.card{background:#fff;border-radius:16px;padding:24px;max-width:750px;width:100%;max-height:90vh;overflow:auto}.row{display:flex;justify-content:space-between;gap:20px;padding:11px 0;border-bottom:1px solid #eee}.card select{width:100%;padding:10px;margin-top:8px;border:1px solid #ddd;border-radius:8px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}</style></head><body><header class="site-header"><a class="logo-wrap" href="index.html"><img class="site-logo" src="images/spaza-logo.png" alt="Spaza"></a><div class="header-actions"><a href="admin-operations.html">Operations</a><a href="admin-users.html">Users</a></div></header><main class="wrap"><p class="eyebrow">ADMIN CENTRE</p><h1>Support &amp; Customer Service</h1><p class="page-intro">Manage customer support tickets, priorities and resolution status.</p><div id="gate" class="panel">Checking support access…</div><section id="content" hidden><div class="toolbar"><input id="q" placeholder="Search ticket, subject or customer"><select id="status"><option value="">All statuses</option><option>OPEN</option><option>IN_PROGRESS</option><option>WAITING_FOR_CUSTOMER</option><option>RESOLVED</option><option>CLOSED</option></select><select id="priority"><option value="">All priorities</option><option>LOW</option><option>NORMAL</option><option>HIGH</option><option>URGENT</option></select></div><div id="table" class="panel">Loading tickets…</div></section></main><div id="modal" class="modal"><div class="card" id="body"></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const db=SpazaDB,esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let tickets=[];async function init(){const{data:{user}}=await db.auth.getUser();if(!user){location.href='login.html';return}const{data:r,error}=await db.from('profile_roles').select('roles(name,code)').eq('profile_id',user.id);if(error)throw error;const ok=(r||[]).some(x=>['ADMIN','OWNER','SUPPORT'].includes(String(x.roles?.code||x.roles?.name||'').toUpperCase()));if(!ok){document.getElementById('gate').innerHTML='<strong>Support staff access required.</strong>';return}document.getElementById('gate').remove();document.getElementById('content').hidden=false;await load()}async function load(){const{data,error}=await db.from('support_tickets').select('*').order('created_at',{ascending:false});if(error)throw error;tickets=data||[];render()}function render(){const q=document.getElementById('q').value.toLowerCase(),s=document.getElementById('status').value,p=document.getElementById('priority').value;const a=tickets.filter(x=>(!s||x.status===s)&&(!p||String(x.priority).toUpperCase()===p)&&(!q||JSON.stringify(x).toLowerCase().includes(q)));if(!a.length){document.getElementById('table').innerHTML='<div style="text-align:center;padding:45px"><strong>No support tickets found.</strong><p>Customer support requests will appear here when submitted.</p></div>';return}document.getElementById('table').innerHTML='<div class="table-wrap"><table class="table"><thead><tr><th>Ticket</th><th>Subject</th><th>Customer</th><th>Category</th><th>Priority</th><th>Status</th><th>Created</th><th></th></tr></thead><tbody>'+a.map(x=>`<tr><td>${esc(x.ticket_number||x.id)}</td><td>${esc(x.subject)}</td><td>${esc(x.profile_id)}</td><td>${esc(x.category)}</td><td><span class="badge">${esc(x.priority)}</span></td><td><span class="badge">${esc(x.status)}</span></td><td>${new Date(x.created_at).toLocaleString('en-ZA')}</td><td><button class="button" onclick="view('${x.id}')">Manage</button></td></tr>`).join('')+'</tbody></table></div>'}function view(id){const x=tickets.find(t=>t.id===id);if(!x)return;document.getElementById('body').innerHTML=`<h2>${esc(x.ticket_number||x.id)}</h2><div class="row"><span>Subject</span><strong>${esc(x.subject)}</strong></div><div class="row"><span>Customer</span><strong>${esc(x.profile_id)}</strong></div><div class="row"><span>Category</span><strong>${esc(x.category)}</strong></div><p>${esc(x.description)}</p><label>Status<select id="s"><option>OPEN</option><option>IN_PROGRESS</option><option>WAITING_FOR_CUSTOMER</option><option>RESOLVED</option><option>CLOSED</option></select></label><label>Priority<select id="p"><option>LOW</option><option>NORMAL</option><option>HIGH</option><option>URGENT</option></select></label><div class="actions"><button class="button" onclick="save('${x.id}')">Save</button><button class="button" onclick="closeModal()">Close</button></div>`;document.getElementById('s').value=x.status;document.getElementById('p').value=String(x.priority||'NORMAL').toUpperCase();document.getElementById('modal').classList.add('open')}async function save(id){const{error}=await db.rpc('admin_update_support_ticket',{p_ticket_id:id,p_status:document.getElementById('s').value,p_priority:document.getElementById('p').value});if(error){alert(error.message);return}closeModal();await load()}function closeModal(){document.getElementById('modal').classList.remove('open')}window.view=view;window.save=save;window.closeModal=closeModal;document.getElementById('q').addEventListener('input',render);document.getElementById('status').addEventListener('change',render);document.getElementById('priority').addEventListener('change',render);init().catch(e=>document.getElementById('gate').innerHTML='<strong>Support centre could not load.</strong><p>'+esc(e.message)+'</p>');</script></body></html>

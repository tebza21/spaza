<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seller Orders | Spaza</title><link rel="stylesheet" href="css/style.css"><style>.wrap{max-width:1200px;margin:auto;padding:40px 20px}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0}.toolbar input,.toolbar select{padding:11px;border:1px solid #d8dde0;border-radius:9px}.list{display:grid;gap:16px}.card{border:1px solid #e2e6e8;border-radius:16px;padding:20px;background:#fff}.head{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}.status{display:inline-block;padding:7px 11px;border-radius:99px;background:#eef2f3;font-size:.82rem;font-weight:700}.items{margin:15px 0;border-top:1px solid #edf0f1;border-bottom:1px solid #edf0f1}.item{padding:10px 0;display:flex;justify-content:space-between;gap:12px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.muted{color:#68727a}.empty{text-align:center;padding:55px 20px;border:1px dashed #ccd2d5;border-radius:15px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.open{display:flex}.box{background:#fff;border-radius:18px;padding:24px;max-width:700px;width:100%;max-height:85vh;overflow:auto}.box input,.box select,.box textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d8dde0;border-radius:8px;margin:7px 0}.close{float:right;border:0;background:transparent;font-size:24px}@media(max-width:600px){.wrap{padding:28px 14px}.card{padding:16px}}</style></head><body><header class="site-header"><button class="menu-button" id="menuButton">☰</button><a class="logo-wrap" href="index.html"><img class="site-logo" src="images/spaza-logo.png" alt="Spaza"></a><div class="header-actions"><a href="seller-centre.html">Seller Centre</a><a href="seller-inventory.html">Inventory</a></div></header><main class="wrap"><p class="eyebrow">SELLER CENTRE</p><h1>Seller Orders</h1><p>Manage your fulfilments using the real orders assigned to your seller account.</p><div class="toolbar"><input id="search" type="search" placeholder="Search seller order..."><select id="filter"><option value="ALL">All statuses</option><option>NEW</option><option>ACCEPTED</option><option>PROCESSING</option><option>READY</option><option>SHIPPED</option><option>OUT_FOR_DELIVERY</option><option>READY_FOR_PICKUP</option><option>DELIVERED</option><option>COMPLETED</option><option>CANCELLED</option><option>RETURN_REQUESTED</option><option>DISPUTED</option></select></div><div id="list" class="list"><div class="empty">Checking seller access…</div></div></main><div id="modal" class="modal"><div class="box"><button class="close" onclick="closeModal()">×</button><div id="modalBody"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>let user,seller,orders=[];const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));const pretty=v=>String(v||'').replaceAll('_',' ').toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());const money=v=>new Intl.NumberFormat('en-ZA',{style:'currency',currency:'ZAR'}).format(Number(v||0));function render(){const q=search.value.trim().toLowerCase(),f=filter.value;const rows=orders.filter(o=>(f==='ALL'||o.status===f)&&(!q||String(o.seller_order_number).toLowerCase().includes(q)||String(o.order_id).toLowerCase().includes(q)));list.innerHTML=rows.length?rows.map(o=>`<article class="card"><div class="head"><div><strong>${esc(o.seller_order_number)}</strong><div class="muted">Order ID: ${esc(o.order_id)}</div><div class="muted">${new Date(o.created_at).toLocaleString('en-ZA')}</div></div><span class="status">${esc(pretty(o.status))}</span></div><div class="items">${(o.seller_order_items||[]).map(i=>`<div class="item"><span>Item ${esc(i.order_item_id)} · Qty ${Number(i.quantity||0)}</span><strong>${money(i.line_total)}</strong></div>`).join('')||'<div class="item muted">No line items recorded.</div>'}</div><p><strong>Subtotal:</strong> ${money(o.subtotal)} &nbsp; <strong>Delivery:</strong> ${money(o.delivery_fee)} &nbsp; <strong>Total:</strong> ${money(o.total)}</p>${(o.deliveries||[]).map(d=>`<p class="muted">Delivery ${esc(d.delivery_number)} · ${esc(pretty(d.status))}${d.tracking_number?' · Tracking '+esc(d.tracking_number):''}</p>`).join('')}<div class="actions">${['NEW'].includes(o.status)?`<button class="button primary" onclick="setStatus('${o.id}','ACCEPTED')">Accept Order</button>`:''}${['ACCEPTED'].includes(o.status)?`<button class="button primary" onclick="setStatus('${o.id}','PROCESSING')">Start Preparing</button>`:''}${['PROCESSING'].includes(o.status)?`<button class="button primary" onclick="setStatus('${o.id}','READY')">Mark Ready</button>`:''}<button class="button secondary" onclick="details('${o.id}')">View Details</button></div></article>`).join(''):'<div class="empty"><h2>No seller orders</h2><p>Real orders assigned to your seller account will appear here.</p></div>'}async function setStatus(id,status){const o=orders.find(x=>x.id===id);if(!o)return;if(!confirm('Change this seller order to '+pretty(status)+'?'))return;const patch={status};if(status==='ACCEPTED')patch.accepted_at=new Date().toISOString();if(status==='SHIPPED')patch.shipped_at=new Date().toISOString();if(status==='DELIVERED')patch.delivered_at=new Date().toISOString();if(status==='COMPLETED')patch.completed_at=new Date().toISOString();const r=await SpazaDB.from('seller_orders').update(patch).eq('id',id).eq('seller_id',seller.id);if(r.error)alert(r.error.message);else load()}function details(id){const o=orders.find(x=>x.id===id);if(!o)return;modalBody.innerHTML=`<h2>${esc(o.seller_order_number)}</h2><p>Status: <strong>${esc(pretty(o.status))}</strong></p><p>Total: <strong>${money(o.total)}</strong></p><h3>Items</h3>${(o.seller_order_items||[]).map(i=>`<p>${esc(i.order_item_id)} · Qty ${Number(i.quantity)} · ${money(i.line_total)}</p>`).join('')||'<p>No items recorded.</p>'}<h3>Fulfilment</h3>${(o.deliveries||[]).map(d=>`<div><p><strong>${esc(d.delivery_number)}</strong> · ${esc(pretty(d.status))}</p><p>Recipient: ${esc(d.recipient_name||'')} ${esc(d.recipient_phone||'')}</p><p>Tracking: ${esc(d.tracking_number||'Not assigned')}</p><p>Courier: ${esc(d.courier_name||'Not assigned')}</p></div>`).join('')||'<p>No delivery record is attached yet.</p>'}`;modal.classList.add('open')}function closeModal(){modal.classList.remove('open')}async function load(){const a=await SpazaDB.auth.getUser();user=a.data.user;if(!user){location.href='login.html?role=vendor';return}const s=await SpazaDB.from('sellers').select('id,business_name').eq('profile_id',user.id).maybeSingle();if(s.error||!s.data){list.innerHTML='<div class="empty"><h2>Seller access required</h2><p>Your account is not linked to an approved seller profile.</p></div>';return}seller=s.data;const r=await SpazaDB.from('seller_orders').select('id,seller_order_number,order_id,seller_id,status,subtotal,delivery_fee,total,seller_notes,accepted_at,shipped_at,delivered_at,completed_at,created_at,updated_at,seller_order_items(id,order_item_id,quantity,unit_price,line_total),deliveries(id,delivery_number,status,recipient_name,recipient_phone,delivery_address,tracking_number,courier_name,courier_reference,estimated_from,estimated_to,dispatched_at,delivered_at)').eq('seller_id',seller.id).order('created_at',{ascending:false});if(r.error){list.innerHTML='<div class="empty">Unable to load seller orders right now.</div>';return}orders=r.data||[];render()}search.oninput=render;filter.onchange=render;load();</script></body></html>

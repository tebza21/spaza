<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Returns & Disputes | Seller Centre | Spaza</title><link rel="stylesheet" href="css/style.css"><style>
.wrap{max-width:1180px;margin:0 auto;padding:32px 20px 70px}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0}.toolbar input,.toolbar select,.modal textarea,.modal select{padding:12px;border:1px solid #ddd;border-radius:8px}.table-wrap{overflow:auto}.data-table{width:100%;border-collapse:collapse}.data-table th,.data-table td{text-align:left;padding:14px;border-bottom:1px solid #eee;white-space:nowrap}.status{display:inline-block;padding:5px 9px;border-radius:999px;background:#f1f1f1;font-size:12px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:24px 0}.stat{padding:20px;border:1px solid #e5e5e5;border-radius:12px;background:#fff}.stat strong{display:block;font-size:26px;margin-top:8px}.empty{text-align:center;padding:50px 20px;color:#666}.notice{padding:18px;border-radius:10px;background:#f7f7f7;margin:20px 0}.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.modal.open{display:flex}.modal-card{background:#fff;border-radius:16px;max-width:620px;width:100%;padding:24px;max-height:90vh;overflow:auto}.case-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0}.case-field{padding:12px;background:#f7f7f7;border-radius:9px}.case-field small{display:block;color:#666;margin-bottom:4px}.modal textarea{width:100%;min-height:110px;box-sizing:border-box}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.actions .button{cursor:pointer}.danger{border-color:#c62828!important}.muted{color:#666}@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}.wrap{padding:22px 14px 50px}.case-grid{grid-template-columns:1fr}}@media(max-width:500px){.cards{grid-template-columns:1fr}}
</style></head>
<body><header class="site-header"><a class="logo-wrap" href="index.html"><img class="site-logo" src="images/spaza-logo.png" alt="Spaza"></a><button class="menu-button" id="menuButton">☰</button><div class="header-actions"><a href="seller-centre.html">Seller Centre</a><a href="account.html">Account</a></div></header>
<main class="wrap"><p class="eyebrow">SELLER CENTRE</p><h1>Returns & Disputes</h1><p class="page-intro">Review customer after-sales cases and submit your response through the protected seller workflow.</p><div id="gate" class="notice">Checking seller access…</div>
<section id="content" hidden><div class="cards"><div class="stat"><span>Open returns</span><strong id="returnsCount">—</strong></div><div class="stat"><span>Open disputes</span><strong id="disputesCount">—</strong></div><div class="stat"><span>Awaiting response</span><strong id="responseCount">—</strong></div><div class="stat"><span>Resolved</span><strong id="resolvedCount">—</strong></div></div>
<div class="toolbar"><input id="search" type="search" placeholder="Search reference or order"><select id="caseType"><option value="">All cases</option><option value="return">Returns</option><option value="dispute">Disputes</option></select><select id="status"><option value="">All statuses</option><option>REQUESTED</option><option>APPROVED</option><option>REJECTED</option><option>SUBMITTED</option><option>UNDER_REVIEW</option><option>AWAITING_SELLER_RESPONSE</option><option>RESOLVED</option><option>CANCELLED</option></select></div><div id="tableArea" class="card"><div class="empty">Loading cases…</div></div></section></main>
<div id="modal" class="modal"><div class="modal-card"><div id="modalBody"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
const db=SpazaDB;let sellerId=null,cases=[];
const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=(v,c='ZAR')=>v==null?'—':new Intl.NumberFormat('en-ZA',{style:'currency',currency:c}).format(Number(v));
const upper=v=>String(v||'').toUpperCase();
async function load(){const {data:{user}}=await db.auth.getUser();if(!user){location.href='login.html?role=vendor';return;}const {data:roles,error:roleError}=await db.from('profile_roles').select('roles(name,code)').eq('profile_id',user.id);if(roleError)throw roleError;const ok=(roles||[]).some(x=>['SELLER','PARTNER'].includes(upper(x.roles?.code||x.roles?.name)));if(!ok){document.getElementById('gate').innerHTML='<strong>Seller access is not active.</strong><p>Seller approval is required before managing after-sales cases.</p>';return;}const {data:seller,error:sellerError}=await db.from('sellers').select('id').eq('profile_id',user.id).maybeSingle();if(sellerError)throw sellerError;if(!seller){document.getElementById('gate').innerHTML='<strong>Seller profile not found.</strong>';return;}sellerId=seller.id;document.getElementById('gate').remove();document.getElementById('content').hidden=false;await reload();}
async function reload(){const [r,d]=await Promise.all([db.from('returns').select('*').eq('seller_id',sellerId).order('created_at',{ascending:false}),db.from('disputes').select('*').eq('seller_id',sellerId).order('created_at',{ascending:false})]);if(r.error)throw r.error;if(d.error)throw d.error;cases=[...(r.data||[]).map(x=>({...x,case_type:'return'})),...(d.data||[]).map(x=>({...x,case_type:'dispute'}))].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));render();}
function render(){const closed=['RESOLVED','CLOSED','CANCELLED','REJECTED','COMPLETED'];document.getElementById('returnsCount').textContent=cases.filter(x=>x.case_type==='return'&&!closed.includes(upper(x.status))).length;document.getElementById('disputesCount').textContent=cases.filter(x=>x.case_type==='dispute'&&!closed.includes(upper(x.status))).length;document.getElementById('responseCount').textContent=cases.filter(x=>['AWAITING_SELLER_RESPONSE','REQUESTED'].includes(upper(x.status))).length;document.getElementById('resolvedCount').textContent=cases.filter(x=>['RESOLVED','COMPLETED'].includes(upper(x.status))).length;const q=document.getElementById('search').value.toLowerCase(),t=document.getElementById('caseType').value,s=upper(document.getElementById('status').value);const rows=cases.filter(x=>(!t||x.case_type===t)&&(!s||upper(x.status)===s)&&(!q||JSON.stringify(x).toLowerCase().includes(q)));if(!rows.length){document.getElementById('tableArea').innerHTML='<div class="empty"><strong>No return or dispute cases found.</strong><p>When customers submit an after-sales case for one of your orders, it will appear here.</p></div>';return;}document.getElementById('tableArea').innerHTML='<div class="table-wrap"><table class="data-table"><thead><tr><th>Type</th><th>Reference</th><th>Order</th><th>Status</th><th>Amount</th><th>Created</th><th>Action</th></tr></thead><tbody>'+rows.map(x=>'<tr><td>'+esc(x.case_type==='return'?'Return':'Dispute')+'</td><td>'+esc(x.return_number||x.dispute_number||x.id)+'</td><td>'+esc(x.order_id||'—')+'</td><td><span class="status">'+esc(x.status||'—')+'</span></td><td>'+money(x.amount_disputed??x.amount,x.currency||'ZAR')+'</td><td>'+new Date(x.created_at).toLocaleString('en-ZA')+'</td><td><button class="button" onclick="viewCase(\''+x.id+'\',\''+x.case_type+'\')">View</button></td></tr>').join('')+'</tbody></table></div>';}
function viewCase(id,type){const x=cases.find(c=>c.id===id&&c.case_type===type);if(!x)return;const ref=x.return_number||x.dispute_number||x.id;let actions='';if(type==='return'&&upper(x.status)==='REQUESTED')actions='<label>Approved quantity (optional)<input id="approvedQty" type="number" min="1" max="'+Number(x.requested_quantity||1)+'" value="'+Number(x.requested_quantity||1)+'"></label><div class="actions"><button class="button" onclick="submitCase(\''+id+'\',\'return\',\'APPROVE\')">Approve Return</button><button class="button danger" onclick="submitCase(\''+id+'\',\'return\',\'REJECT\')">Reject Return</button></div>';else if(type==='dispute'&&['SUBMITTED','AWAITING_SELLER_RESPONSE'].includes(upper(x.status)))actions='<div class="actions"><button class="button" onclick="submitCase(\''+id+'\',\'dispute\',\'RESPOND\')">Submit Response</button></div>';else actions='<p class="muted">No seller action is available for this status.</p>';document.getElementById('modalBody').innerHTML='<div style="display:flex;justify-content:space-between;gap:12px"><div><p class="eyebrow">'+(type==='return'?'RETURN':'DISPUTE')+'</p><h2>'+esc(ref)+'</h2></div><button class="button" onclick="closeModal()">Close</button></div><div class="case-grid"><div class="case-field"><small>Status</small>'+esc(x.status)+'</div><div class="case-field"><small>Order</small>'+esc(x.order_id||'—')+'</div><div class="case-field"><small>Reason</small>'+esc(x.reason||'—')+'</div><div class="case-field"><small>Amount</small>'+money(x.amount_disputed??x.amount,x.currency||'ZAR')+'</div></div><p><strong>Customer notes</strong></p><p class="muted">'+esc(x.customer_notes||x.description||'No notes provided.')+'</p><label><strong>Seller response / resolution notes</strong><textarea id="caseNotes" placeholder="Explain your decision or response…">'+esc(x.resolution_notes||x.decision_notes||'')+'</textarea></label>'+actions;document.getElementById('modal').classList.add('open');}
async function submitCase(id,type,action){const notes=document.getElementById('caseNotes')?.value.trim()||null;let res;if(type==='return'){const q=document.getElementById('approvedQty')?.value;res=await db.rpc('respond_to_seller_return',{p_return_id:id,p_action:action,p_notes:notes,p_approved_quantity:q?Number(q):null});}else res=await db.rpc('respond_to_seller_dispute',{p_dispute_id:id,p_action:action,p_notes:notes});if(res.error){alert(res.error.message);return;}closeModal();await reload();alert(type==='return'?(action==='APPROVE'?'Return approved.':'Return rejected.'):'Seller response submitted.');}
function closeModal(){document.getElementById('modal').classList.remove('open');document.getElementById('modalBody').innerHTML='';}window.viewCase=viewCase;window.submitCase=submitCase;window.closeModal=closeModal;['search','caseType','status'].forEach(id=>document.getElementById(id).addEventListener('input',render));document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});load().catch(e=>{document.getElementById('gate').innerHTML='<strong>Could not load returns and disputes.</strong><p>'+esc(e.message)+'</p>';});
</script></body></html>

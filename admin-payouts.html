<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPAZA — Finance Payouts</title><link rel="stylesheet" href="css/style.css"></head><body><main class="container" style="padding:32px 16px"><h1>Seller Payouts</h1><p>Finance/Admin review and process seller payout requests.</p><div id="app" class="card" style="padding:20px;margin-top:20px">Loading…</div></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const URL='https://gbyujowoqalxtbhpdbod.supabase.co',KEY=window.SUPABASE_ANON_KEY||'';const app=document.getElementById('app');if(!KEY){app.textContent='Supabase client configuration is required.'}else{const sb=createClient(URL,KEY),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const{data:{user}}=await sb.auth.getUser();if(!user){app.textContent='Please sign in.';return}const{data:ok}=await sb.rpc('is_finance_staff');if(!ok){app.textContent='Finance/Admin access required.';return}const{data:rows,error}=await sb.from('seller_payouts').select('id,payout_number,seller_id,amount,currency,status,payout_method,provider_name,provider_reference,requested_at,failure_reason').order('created_at',{ascending:false});if(error){app.textContent=error.message;return}app.innerHTML=rows?.length?rows.map(r=>`<article style="border-top:1px solid #ddd;padding:16px 0"><strong>${esc(r.payout_number)}</strong><div>R${Number(r.amount).toFixed(2)} · ${esc(r.currency)} · ${esc(r.status)}</div><small>Seller: ${esc(r.seller_id)} · ${new Date(r.requested_at).toLocaleString()}</small><div style="margin-top:10px">${r.status==='PENDING'?'<button data-id="'+r.id+'" data-status="PROCESSING">Start processing</button>':''}${['PENDING','PROCESSING','ON_HOLD'].includes(r.status)?' <button data-id="'+r.id+'" data-status="PAID">Mark paid</button>':''}${['PENDING','ON_HOLD'].includes(r.status)?' <button data-id="'+r.id+'" data-status="CANCELLED">Cancel</button>':''}${['PENDING','PROCESSING','ON_HOLD'].includes(r.status)?' <button data-id="'+r.id+'" data-status="FAILED">Fail</button>':''}</div></article>`).join(''):'<p>No payout requests.</p>'}app.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const provider=b.dataset.status==='PAID'?'Manual/Configured Provider':null;const ref=b.dataset.status==='PAID'?prompt('Enter provider/bank reference:'):null;if(b.dataset.status==='PAID'&&!ref){return}const failure=b.dataset.status==='FAILED'?prompt('Failure reason:'):null;const{error}=await sb.rpc('admin_update_seller_payout',{p_payout_id:b.dataset.id,p_new_status:b.dataset.status,p_provider_name:provider,p_provider_reference:ref,p_failure_reason:failure});if(error)alert(error.message);else load()});load()}</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPAZA — Seller Payouts</title><link rel="stylesheet" href="css/style.css"><style>.wrap{max-width:1200px;margin:auto;padding:32px 18px 70px}.panel{background:#fff;border:1px solid #e2e6e7;border-radius:16px;padding:20px;margin-top:20px}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.toolbar input,.toolbar select,.toolbar button{padding:11px;border:1px solid #ddd;border-radius:8px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat strong{display:block;font-size:1.4rem;margin-top:6px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px 9px;border-bottom:1px solid #edf0f1;white-space:nowrap}.badge{padding:4px 8px;border-radius:999px;background:#eef2f1;font-size:.76rem;font-weight:700}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{padding:7px 9px}.empty{text-align:center;padding:38px;color:#68727a}@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}}@media(max-width:520px){.stats{grid-template-columns:1fr}}</style></head><body><header class="site-header"><a class="logo-wrap" href="index.html"><img class="site-logo" src="images/spaza-logo.png" alt="Spaza"></a><div class="header-actions"><a href="admin-finance.html">Finance</a><a href="admin-operations.html">Operations</a></div></header><main class="wrap"><p class="eyebrow">ADMIN CENTRE · FINANCE</p><h1>Seller Payouts</h1><p class="page-intro">Review, hold, process and complete seller payout requests. Provider/bank references are required before payment is recorded.</p><div id="gate" class="panel">Checking finance access…</div><section id="content" hidden><div class="stats"><div class="panel stat">Pending<strong id="pending">R0.00</strong></div><div class="panel stat">Processing<strong id="processing">R0.00</strong></div><div class="panel stat">Paid<strong id="paid">R0.00</strong></div><div class="panel stat">Requests<strong id="count">0</strong></div></div><div class="panel"><div class="toolbar"><input id="q" placeholder="Search payout or seller ID"><select id="status"><option value="">All statuses</option><option>PENDING</option><option>PROCESSING</option><option>ON_HOLD</option><option>PAID</option><option>FAILED</option><option>CANCELLED</option></select><button id="refresh">Refresh</button></div><div id="list" style="margin-top:15px">Loading…</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const db=SpazaDB,esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let rows=[];async function init(){const{data:{user}}=await db.auth.getUser();if(!user){location.href='login.html';return}const{data:ok,error}=await db.rpc('is_finance_staff');if(error||!ok){gate.innerHTML='<strong>Finance/Admin access required.</strong>';return}gate.hidden=true;content.hidden=false;await load()}async function load(){const{data,error}=await db.from('seller_payouts').select('id,payout_number,seller_id,amount,currency,status,payout_method,provider_name,provider_reference,requested_at,processed_at,paid_at,failure_reason').order('created_at',{ascending:false});if(error){list.innerHTML='<div class="empty">'+esc(error.message)+'</div>';return}rows=data||[];render()}function render(){const q=document.getElementById('q').value.toLowerCase(),s=document.getElementById('status').value;const a=rows.filter(r=>(!s||String(r.status).toUpperCase()===s)&&(!q||JSON.stringify(r).toLowerCase().includes(q)));const sum=(status)=>rows.filter(r=>String(r.status).toUpperCase()===status).reduce((n,r)=>n+Number(r.amount||0),0);pending.textContent=money(sum('PENDING'));processing.textContent=money(sum('PROCESSING'));paid.textContent=money(sum('PAID'));count.textContent=rows.length;if(!a.length){list.innerHTML='<div class="empty"><strong>No payout requests found.</strong><p>Real seller payout requests will appear here when sellers request payment.</p></div>';return}list.innerHTML='<div class="table-wrap"><table class="table"><thead><tr><th>Reference</th><th>Seller</th><th>Amount</th><th>Status</th><th>Requested</th><th>Provider ref</th><th>Actions</th></tr></thead><tbody>'+a.map(r=>`<tr><td>${esc(r.payout_number)}</td><td>${esc(r.seller_id)}</td><td>${money(r.amount)}</td><td><span class="badge">${esc(r.status)}</span></td><td>${r.requested_at?new Date(r.requested_at).toLocaleString('en-ZA'):'—'}</td><td>${esc(r.provider_reference)}</td><td><div class="actions">${r.status==='PENDING'?`<button data-id="${r.id}" data-status="PROCESSING">Process</button><button data-id="${r.id}" data-status="ON_HOLD">Hold</button>`:''}${['PENDING','PROCESSING','ON_HOLD'].includes(r.status)?`<button data-id="${r.id}" data-status="PAID">Mark paid</button>`:''}${['PENDING','PROCESSING','ON_HOLD'].includes(r.status)?`<button data-id="${r.id}" data-status="FAILED">Fail</button>`:''}${['PENDING','ON_HOLD'].includes(r.status)?`<button data-id="${r.id}" data-status="CANCELLED">Cancel</button>`:''}</div></td></tr>`).join('')+'</tbody></table></div>'}function money(v){return 'R'+Number(v||0).toLocaleString('en-ZA',{minimumFractionDigits:2,maximumFractionDigits:2})}list=document.getElementById('list');q.addEventListener('input',render);status.addEventListener('change',render);refresh.addEventListener('click',load);list.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const st=b.dataset.status;let provider=null,ref=null,failure=null;if(st==='PAID'){provider=prompt('Provider / bank name:','Bank transfer');if(provider===null)return;ref=prompt('Enter provider / bank reference:');if(!ref?.trim())return}if(st==='FAILED'){failure=prompt('Enter failure reason:');if(!failure?.trim())return}const{error}=await db.rpc('admin_update_seller_payout',{p_payout_id:b.dataset.id,p_new_status:st,p_provider_name:provider,p_provider_reference:ref,p_failure_reason:failure});if(error)alert(error.message);else await load()});init();</script></body></html>

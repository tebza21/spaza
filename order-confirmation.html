<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Spaza order confirmation and payment status."><title>Order Confirmation | Spaza</title><link rel="stylesheet" href="css/style.css"><style>
.confirm-page{max-width:1050px;margin:0 auto;padding:42px 20px 70px}.hero-card,.status-card,.detail-card{background:#fff;border:1px solid #e1e5e6;border-radius:18px;padding:24px;margin-bottom:18px}.hero-card{text-align:center}.status-icon{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;margin:0 auto 14px;background:#eef4f1;font-size:30px}.status-icon.pending{background:#fff8e8}.status-icon.failed{background:#fff1f1}.ref-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}.ref{padding:14px;border:1px solid #e2e6e7;border-radius:12px;text-align:left}.ref span{display:block;color:#68727a;font-size:.82rem;margin-bottom:5px}.status-track{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px}.status-step{padding:14px 10px;border-top:4px solid #dfe4e5;color:#68727a}.status-step.active{border-top-color:#111;color:#111}.status-step strong{display:block}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.summary-row{display:flex;justify-content:space-between;gap:15px;padding:9px 0;border-bottom:1px solid #edf0f1}.muted{color:#68727a}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}@media(max-width:700px){.ref-grid,.detail-grid,.status-track{grid-template-columns:1fr}.status-step{border-top:0;border-left:4px solid #dfe4e5}.status-step.active{border-left-color:#111}}
</style></head><body>
<header class="site-header compact"><a class="brand" href="index.html"><img src="images/spaza-logo.png" alt="Spaza"></a><div class="header-actions"><a href="account.html">Account</a><a href="orders.html">Orders</a></div></header><nav class="main-nav"><div class="nav-inner"><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="categories.html">Categories</a><a href="partner.html">Become a Partner</a><a href="help.html">Help &amp; Support</a></div></nav>
<main class="confirm-page"><div id="content"><div class="hero-card"><p>Loading order status…</p></div></div></main><footer><strong>SPAZA</strong><p>Payment status is based on verified payment records. A successful redirect alone does not mark an order as paid.</p></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));const money=v=>'R'+Number(v||0).toLocaleString('en-ZA',{minimumFractionDigits:2,maximumFractionDigits:2});
function paymentUi(status){const s=String(status||'PENDING');if(s==='PAID'||s==='AUTHORIZED')return {title:s==='PAID'?'Payment confirmed':'Payment authorized',text:'Your payment record has been verified. Your order can proceed to fulfilment.',cls:''};if(s==='FAILED')return {title:'Payment failed',text:'The payment was not completed. Your order has not been treated as paid.',cls:'failed'};if(s==='CANCELLED')return {title:'Payment cancelled',text:'The payment was cancelled. No paid order will be created from this payment attempt.',cls:'failed'};return {title:'Payment pending',text:'We are waiting for a verified payment result. Do not pay again unless SPAZA tells you to.',cls:'pending'}}
async function init(){const content=document.getElementById('content');const params=new URLSearchParams(location.search);const orderId=params.get('order_id');const orderNumber=params.get('order');const paymentId=params.get('payment_id');const {data:{user}}=await SpazaDB.auth.getUser();if(!user){location.href='login.html?role=customer';return}if(!orderId&&!orderNumber){content.innerHTML='<div class="hero-card"><h1>Order reference missing</h1><p class="muted">Open this page from your order or payment result.</p><a class="button primary" href="orders.html">View my orders</a></div>';return}
let q=SpazaDB.from('orders').select('id,order_number,status,currency,subtotal,delivery_total,discount_total,tax_total,grand_total,placed_at,created_at').eq('profile_id',user.id);if(orderId)q=q.eq('id',orderId);else q=q.eq('order_number',orderNumber);const {data:order,error}=await q.maybeSingle();if(error||!order){content.innerHTML='<div class="hero-card"><h1>Order not found</h1><p class="muted">This order could not be found for your account.</p><a class="button primary" href="orders.html">View my orders</a></div>';return}
let pq=SpazaDB.from('payments').select('id,payment_number,amount,currency,payment_method,status,provider_name,provider_payment_id,provider_transaction_reference,paid_at,failure_reason,created_at').eq('order_id',order.id).eq('profile_id',user.id).order('created_at',{ascending:false});if(paymentId)pq=pq.eq('id',paymentId);const {data:payments}=await pq;const payment=payments?.[0];const ui=paymentUi(payment?.status);const isPaid=['PAID','AUTHORIZED'].includes(String(payment?.status));const orderSteps=['PAYMENT_PENDING','PAID','PROCESSING','SHIPPED','DELIVERED'];const current=String(order.status||'PAYMENT_PENDING');const rank=current==='PAYMENT_PENDING'?0:['PAID'].includes(current)?1:['PROCESSING','PARTIALLY_SHIPPED'].includes(current)?2:['SHIPPED','OUT_FOR_DELIVERY','READY_FOR_PICKUP'].includes(current)?3:['DELIVERED','COMPLETED'].includes(current)?4:0;
content.innerHTML=`<section class="hero-card"><div class="status-icon ${ui.cls}">${isPaid?'✓':payment?.status==='FAILED'||payment?.status==='CANCELLED'?'!':'…'}</div><p class="eyebrow">${isPaid?'ORDER CONFIRMED':'PAYMENT STATUS'}</p><h1>${ui.title}</h1><p class="page-intro">${esc(ui.text)}</p><div class="ref-grid"><div class="ref"><span>Order number</span><strong>${esc(order.order_number)}</strong></div><div class="ref"><span>Payment reference</span><strong>${esc(payment?.payment_number||'Not created yet')}</strong></div><div class="ref"><span>Payment provider</span><strong>${esc(payment?.provider_name||'Awaiting provider')}</strong></div></div><div class="actions"><a class="button primary" href="orders.html">Track my order</a><a class="button" href="shop.html">Continue shopping</a></div></section>
<section class="status-card"><p class="eyebrow">ORDER PROGRESS</p><h2>${esc(current.replaceAll('_',' '))}</h2><div class="status-track">${['Payment pending','Payment confirmed','Preparing order','Shipped / ready','Delivered'].map((x,i)=>`<div class="status-step ${i<=rank?'active':''}"><strong>${x}</strong><span>${i<=rank?'Reached':'Waiting'}</span></div>`).join('')}</div></section>
<section class="detail-card"><div class="detail-grid"><div><p class="eyebrow">PAYMENT</p>${payment?`<div class="summary-row"><span>Status</span><strong>${esc(payment.status)}</strong></div><div class="summary-row"><span>Amount</span><strong>${money(payment.amount)}</strong></div><div class="summary-row"><span>Method</span><strong>${esc(payment.payment_method)}</strong></div><div class="summary-row"><span>Provider reference</span><strong>${esc(payment.provider_transaction_reference||payment.provider_payment_id||'—')}</strong></div>${payment.failure_reason?`<div class="summary-row"><span>Reason</span><strong>${esc(payment.failure_reason)}</strong></div>`:''}`:'<p class="muted">No payment record is available yet.</p>'}</div><div><p class="eyebrow">ORDER TOTAL</p><div class="summary-row"><span>Subtotal</span><strong>${money(order.subtotal)}</strong></div><div class="summary-row"><span>Delivery</span><strong>${money(order.delivery_total)}</strong></div><div class="summary-row"><span>Discount</span><strong>−${money(order.discount_total)}</strong></div><div class="summary-row"><span>Tax</span><strong>${money(order.tax_total)}</strong></div><div class="summary-row"><strong>Total</strong><strong>${money(order.grand_total)}</strong></div></div></div></section>`}
document.addEventListener('DOMContentLoaded',init);
</script></body></html>

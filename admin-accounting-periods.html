<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPAZA — Accounting Periods</title><link rel="stylesheet" href="css/style.css"><style>.wrap{max-width:1100px;margin:auto;padding:32px 18px 70px}.panel{background:#fff;border:1px solid #e2e6e7;border-radius:16px;padding:20px;margin-top:20px}.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}input{padding:11px;border:1px solid #ddd;border-radius:8px;width:100%;box-sizing:border-box}form{display:grid;gap:12px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px 9px;border-bottom:1px solid #edf0f1;white-space:nowrap}.badge{padding:4px 8px;border-radius:999px;background:#eef2f1;font-size:.78rem;font-weight:700}@media(max-width:700px){.row{grid-template-columns:1fr}}</style></head><body><header class="site-header"><a class="logo-wrap" href="index.html"><img class="site-logo" src="images/spaza-logo.png" alt="Spaza"></a><div class="header-actions"><a href="admin-finance.html">Finance</a><a href="admin-reports.html">Reports</a></div></header><main class="wrap"><p class="eyebrow">ADMIN CENTRE</p><h1>Accounting Periods &amp; Controls</h1><p class="page-intro">Open and close financial periods. Closing a period is an accounting control and does not delete or alter posted journals.</p><div id="gate" class="panel">Checking finance access…</div><section id="content" hidden><div class="panel"><h2>Create accounting period</h2><form id="form"><input id="name" required placeholder="Period name e.g. September 2026"><div class="row"><input id="start" type="date" required><input id="end" type="date" required><button class="button" type="submit">Create period</button></div></form></div><div class="panel"><h2>Periods</h2><div id="table">Loading…</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const db=SpazaDB,esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function init(){const{data:{user}}=await db.auth.getUser();if(!user){location.href='login.html';return}const{data:r,error}=await db.from('profile_roles').select('roles(code)').eq('profile_id',user.id);if(error)throw error;const ok=(r||[]).some(x=>['ADMIN','OWNER','FINANCE'].includes(String(x.roles?.code||'').toUpperCase()));if(!ok){gate.innerHTML='<strong>Finance access required.</strong>';return}gate.remove();content.hidden=false;await load()}async function load(){const{data,error}=await db.from('accounting_periods').select('*').order('start_date',{ascending:false});if(error)throw error;if(!data?.length){table.innerHTML='<div style="text-align:center;padding:40px"><strong>No accounting periods configured.</strong><p>Create the first financial period when the business is ready.</p></div>';return}table.innerHTML='<div class="table-wrap"><table class="table"><thead><tr><th>Period</th><th>Start</th><th>End</th><th>Status</th><th>Closed at</th><th></th></tr></thead><tbody>'+data.map(x=>`<tr><td>${esc(x.period_name)}</td><td>${esc(x.start_date)}</td><td>${esc(x.end_date)}</td><td><span class="badge">${x.is_closed?'CLOSED':'OPEN'}</span></td><td>${x.closed_at?new Date(x.closed_at).toLocaleString('en-ZA'):'—'}</td><td>${x.is_closed?'':'<button class="button" onclick="closePeriod(\''+x.id+'\')">Close Period</button>'}</td></tr>`).join('')+'</tbody></table></div>'}async function closePeriod(id){if(!confirm('Close this accounting period? This is a financial control action.'))return;const{error}=await db.rpc('admin_close_accounting_period',{p_period_id:id});if(error){alert(error.message);return}await load()}form.addEventListener('submit',async e=>{e.preventDefault();const{error}=await db.rpc('admin_create_accounting_period',{p_period_name:name.value,p_start_date:start.value,p_end_date:end.value});if(error){alert(error.message);return}form.reset();await load()});window.closePeriod=closePeriod;init().catch(e=>gate.innerHTML='<strong>Accounting controls could not load.</strong><p>'+esc(e.message)+'</p>');</script></body></html>

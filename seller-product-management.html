<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Products | Spaza Seller Centre</title><link rel="stylesheet" href="css/style.css"><style>:root{--g:#b7ff00;--line:#e5e7eb;--muted:#667085}body{background:#f7f8f5}.wrap{max-width:1200px;margin:auto;padding:26px 18px 60px}.top,.actions{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.top a{color:inherit;text-decoration:none;font-weight:700}.btn{border:1px solid #d5dbe0;border-radius:10px;background:#fff;padding:10px 14px;font-weight:700;cursor:pointer;text-decoration:none;color:#111}.green{background:var(--g);border-color:#111}.dark{background:#111;color:#fff;border-color:#111}.bar,.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin:16px 0}.bar{display:flex;gap:10px}.bar input,.bar select{padding:11px;border:1px solid #d5dbe0;border-radius:10px;font:inherit}.bar input{flex:1}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.item{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}.item h3{margin:0 0 4px}.ref,.muted{font-size:12px;color:var(--muted)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.stat{padding:9px;border-radius:10px;background:#f7f8f5}.stat b{display:block;font-size:12px}.item .actions{justify-content:flex-start}.status{display:none;padding:12px;border-radius:10px;margin:12px 0}.status.show{display:block}.error{background:#fff0f0;color:#9f1d1d}.ok{background:#f0f9df;color:#355400}.empty{text-align:center;padding:40px;color:var(--muted)}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:620px){.grid{grid-template-columns:1fr}.bar{flex-direction:column}.bar input{min-width:0}.btn{width:100%;text-align:center;box-sizing:border-box}}</style></head><body><header class="site-header"><a class="logo-wrap" href="index.html"><img class="site-logo" src="images/spaza-logo.png" alt="Spaza"></a><div class="header-actions"><a href="seller-centre.html">Seller Centre</a><a href="shop.html">Shop</a><a href="account.html">Account</a></div></header><main class="wrap"><div class="top"><a href="seller-centre.html">← Seller Centre</a><a class="btn green" href="seller-products-fast.html">+ Add Product</a></div><h1>My Products &amp; Offers</h1><p class="muted">Your seller catalogue is live-data only. Manage your own offers, pricing, stock and status.</p><div id="status" class="status"></div><div class="bar"><input id="q" placeholder="Search product or offer number"><select id="filter"><option value="">All statuses</option><option value="ACTIVE">Active</option><option value="INACTIVE">Inactive</option></select><button id="refresh" class="btn dark">Refresh</button></div><div id="grid" class="grid"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const db=window.SpazaDB,$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let seller=null,items=[];function show(t,e=false){$('status').textContent=t;$('status').className='status show '+(e?'error':'ok')}async function init(){const {data:{user}}=await db.auth.getUser();if(!user){location.href='login.html?role=vendor';return}const {data:roles,error:re}=await db.from('profile_roles').select('roles(name,code)').eq('profile_id',user.id);if(re||!(roles||[]).some(r=>['SELLER','PARTNER'].includes(String(r.roles?.code||r.roles?.name||'').toUpperCase()))){show('Seller access is not active.',true);return}const {data:s,error}=await db.from('sellers').select('id,business_name,status').eq('profile_id',user.id).maybeSingle();if(error||!s||s.status!=='ACTIVE'){show('An active seller account is required.',true);return}seller=s;load()}async function load(){const {data,error}=await db.from('seller_offers').select('id,offer_number,product_id,price,cost_price,condition,delivery_information,return_policy,status,updated_at,products(id,product_number,name,slug),inventory(id,quantity,reserved_quantity,reorder_level)').eq('seller_id',seller.id).order('updated_at',{ascending:false});if(error){show(error.message,true);return}const q=$('q').value.trim().toLowerCase(),f=$('filter').value;items=(data||[]).filter(x=>(!f||x.status===f)&&(!q||((x.products?.name||'')+' '+(x.products?.product_number||'')+' '+x.offer_number).toLowerCase().includes(q)));render()}function render(){if(!items.length){$('grid').innerHTML='<div class="card empty" style="grid-column:1/-1"><h2>No products or offers</h2><p>There is no seller data to display yet.</p><a class="btn green" href="seller-products-fast.html">Add your first product</a></div>';return}$('grid').innerHTML=items.map(x=>{const i=x.inventory||{};const available=Math.max(0,(i.quantity||0)-(i.reserved_quantity||0));const low=(i.quantity||0)<=((i.reorder_level||0));return '<article class="item"><h3>'+esc(x.products?.name||'Product')+'</h3><div class="ref">'+esc(x.products?.product_number||'')+' • '+esc(x.offer_number)+'</div><div class="stats"><div class="stat"><b>Price</b>R '+Number(x.price).toFixed(2)+'</div><div class="stat"><b>Status</b>'+esc(x.status)+'</div><div class="stat"><b>Stock</b>'+Number(i.quantity||0)+'</div><div class="stat"><b>Available</b>'+available+(low?' • Low stock':'')+'</div></div><div class="muted">Condition: '+esc(x.condition||'NEW')+'</div><div class="actions" style="margin-top:12px"><button class="btn" data-stock="'+x.id+'">Adjust Stock</button><button class="btn" data-toggle="'+x.id+'">'+(x.status==='ACTIVE'?'Deactivate':'Activate')+'</button><a class="btn" href="seller-offers.html">Edit Offer</a><a class="btn" href="product.html?id='+encodeURIComponent(x.product_id)+'">View</a></div></article>'}).join('');$('grid').querySelectorAll('[data-stock]').forEach(b=>b.onclick=()=>adjust(items.find(x=>x.id===b.dataset.stock)));$('grid').querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>toggle(items.find(x=>x.id===b.dataset.toggle)))}async function adjust(x){const d=Number(prompt('Stock change (+ to add, - to remove):'));if(!Number.isInteger(d)||d===0){show('Enter a non-zero whole number.',true);return}const reason=prompt('Reason (optional):')||null;const {error}=await db.rpc('adjust_seller_inventory',{p_offer_id:x.id,p_quantity_delta:d,p_reason:reason});if(error){show(error.message,true);return}show('Inventory updated.');load()}async function toggle(x){const next=x.status==='ACTIVE'?'INACTIVE':'ACTIVE';if(!confirm('Set this offer to '+next+'?'))return;const {error}=await db.rpc('set_seller_offer_status',{p_offer_id:x.id,p_status:next});if(error){show(error.message,true);return}show('Offer status updated.');load()}$('refresh').onclick=load;$('filter').onchange=load;$('q').oninput=load;init();</script></body></html>

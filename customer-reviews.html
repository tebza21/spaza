<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reviews & Ratings | Spaza</title><link rel="stylesheet" href="css/style.css"><style>.wrap{max-width:1100px;margin:auto;padding:40px 20px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.tabs button{border:1px solid #dfe3e6;background:#fff;border-radius:999px;padding:9px 15px;cursor:pointer}.tabs .active{background:#111;color:#fff}.list{display:grid;gap:14px}.card{border:1px solid #e3e6e8;border-radius:15px;padding:18px}.stars{letter-spacing:2px}.meta{color:#68727a;font-size:.9rem}.empty{text-align:center;padding:55px 20px;border:1px dashed #ccd2d5;border-radius:15px}.review-form{display:grid;gap:12px;margin-top:16px;padding:16px;background:#f7f8f8;border-radius:12px}.review-form input,.review-form textarea,.review-form select{padding:11px;border:1px solid #d8dde0;border-radius:8px;width:100%;box-sizing:border-box}.hidden{display:none}</style></head><body><header class="site-header"><a class="logo-wrap" href="index.html"><img class="site-logo" src="images/spaza-logo.png" alt="Spaza"></a><div class="header-actions"><a href="shop.html">Shop</a><a href="account.html">Account</a></div></header><main class="wrap"><p class="eyebrow">CUSTOMER CENTRE</p><h1>Reviews & Ratings</h1><p>Review products and sellers from your Spaza purchases. Reviews are moderated before publication.</p><div class="tabs"><button class="active" data-tab="product">Product Reviews</button><button data-tab="seller">Seller Reviews</button></div><div id="content"><div class="empty">Loading reviews…</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>let user,tab='product';const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));const stars=n=>'★'.repeat(Math.max(0,Math.min(5,Number(n||0))))+'☆'.repeat(5-Math.max(0,Math.min(5,Number(n||0))));async function load(){const s=tab==='product'?'product_reviews':'seller_reviews';const sel=tab==='product'?'id,order_id,product_id,seller_id,rating,title,review_text,status,seller_response,seller_responded_at,created_at':'id,order_id,seller_order_id,seller_id,rating,title,review_text,status,response,responded_at,created_at';const r=await SpazaDB.from(s).select(sel).eq('reviewer_id',user.id).order('created_at',{ascending:false});if(r.error){content.innerHTML='<div class="empty">Reviews could not be loaded.</div>';return}const rows=r.data||[];content.innerHTML=rows.length?'<div class="list">'+rows.map(x=>`<article class="card"><div class="stars">${stars(x.rating)}</div><h2>${esc(x.title||'Your review')}</h2><p>${esc(x.review_text||'No written review.')}</p><p class="meta">Status: ${esc(x.status)} · ${new Date(x.created_at).toLocaleDateString('en-ZA')}</p>${tab==='product'&&x.seller_response?`<div><strong>Seller response</strong><p>${esc(x.seller_response)}</p></div>`:''}${tab==='seller'&&x.response?`<div><strong>Seller response</strong><p>${esc(x.response)}</p></div>`:''}</article>`).join('')+'</div>':'<div class="empty"><h2>No reviews yet</h2><p>After eligible purchases, your review opportunities will appear here.</p><a class="button primary" href="orders.html">View My Orders</a></div>'}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');tab=b.dataset.tab;load()});(async()=>{const r=await SpazaDB.auth.getUser();user=r.data.user;if(!user){location.href='login.html?role=customer';return}load()})();</script></body></html>

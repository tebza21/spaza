<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPAZA — Notifications Centre</title><link rel="stylesheet" href="css/style.css"><style>.wrap{max-width:1100px;margin:auto;padding:32px 18px 70px}.panel{background:#fff;border:1px solid #e2e6e7;border-radius:16px;padding:20px;margin-top:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.toolbar input,.toolbar select,form input,form textarea,form select{padding:11px;border:1px solid #ddd;border-radius:8px;width:100%;box-sizing:border-box}form{display:grid;gap:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px 9px;border-bottom:1px solid #edf0f1;white-space:nowrap}.badge{padding:4px 8px;border-radius:999px;background:#eef2f1;font-size:.78rem;font-weight:700}@media(max-width:700px){.grid,.row{grid-template-columns:1fr}}</style></head><body><header class="site-header"><a class="logo-wrap" href="index.html"><img class="site-logo" src="images/spaza-logo.png" alt="Spaza"></a><div class="header-actions"><a href="admin-operations.html">Operations</a><a href="admin-support.html">Support</a></div></header><main class="wrap"><p class="eyebrow">ADMIN CENTRE</p><h1>Notifications &amp; Communications</h1><p class="page-intro">Create and manage customer or seller broadcast messages. No messages are sent until a real delivery channel is connected.</p><div id="gate" class="panel">Checking access…</div><section id="content" hidden><div class="grid"><div class="panel"><strong>Drafts</strong><div id="drafts">—</div></div><div class="panel"><strong>Scheduled</strong><div id="scheduled">—</div></div><div class="panel"><strong>Sent</strong><div id="sent">—</div></div></div><div class="panel"><h2>Create broadcast</h2><form id="form"><input id="title" required placeholder="Notification title"><textarea id="message" required rows="5" placeholder="Message"></textarea><div class="row"><select id="audience"><option>CUSTOMERS</option><option>SELLERS</option><option>ALL</option></select><select id="status"><option>DRAFT</option><option>SCHEDULED</option><option>CANCELLED</option></select></div><input id="scheduled" type="datetime-local"><button class="button" type="submit">Save broadcast</button></form></div><div class="panel"><div class="toolbar"><input id="q" placeholder="Search broadcasts"><select id="filter"><option value="">All statuses</option><option>DRAFT</option><option>SCHEDULED</option><option>SENT</option><option>CANCELLED</option></select></div><div id="table" style="margin-top:15px">Loading…</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const db=SpazaDB,esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let rows=[];async function init(){const{data:{user}}=await db.auth.getUser();if(!user){location.href='login.html';return}const{data:r,error}=await db.from('profile_roles').select('roles(code)').eq('profile_id',user.id);if(error)throw error;const ok=(r||[]).some(x=>['ADMIN','OWNER','MARKETING'].includes(String(x.roles?.code||'').toUpperCase()));if(!ok){document.getElementById('gate').innerHTML='<strong>Admin or Marketing access required.</strong>';return}document.getElementById('gate').remove();document.getElementById('content').hidden=false;await load()}async function load(){const{data,error}=await db.from('admin_broadcasts').select('*').order('created_at',{ascending:false});if(error)throw error;rows=data||[];const c=s=>rows.filter(x=>x.status===s).length;drafts.textContent=c('DRAFT');scheduled.textContent=c('SCHEDULED');sent.textContent=c('SENT');render()}function render(){const q=document.getElementById('q').value.toLowerCase(),f=document.getElementById('filter').value,a=rows.filter(x=>(!f||x.status===f)&&(!q||(x.title+' '+x.message+' '+x.audience).toLowerCase().includes(q)));table.innerHTML=!a.length?'<div style="text-align:center;padding:40px"><strong>No broadcasts found.</strong><p>Saved communications will appear here.</p></div>':'<div class="table-wrap"><table class="table"><thead><tr><th>Title</th><th>Audience</th><th>Status</th><th>Scheduled</th><th>Created</th></tr></thead><tbody>'+a.map(x=>`<tr><td>${esc(x.title)}</td><td>${esc(x.audience)}</td><td><span class="badge">${esc(x.status)}</span></td><td>${x.scheduled_at?new Date(x.scheduled_at).toLocaleString('en-ZA'):'—'}</td><td>${new Date(x.created_at).toLocaleString('en-ZA')}</td></tr>`).join('')+'</tbody></table></div>'}form.addEventListener('submit',async e=>{e.preventDefault();const{error}=await db.rpc('admin_save_broadcast',{p_title:title.value,p_message:message.value,p_audience:audience.value,p_status:status.value,p_scheduled_at:scheduled.value?new Date(scheduled.value).toISOString():null});if(error){alert(error.message);return}form.reset();await load();alert('Broadcast saved. Sending requires a connected delivery channel.');});q.addEventListener('input',render);filter.addEventListener('change',render);init().catch(e=>gate.innerHTML='<strong>Could not load notifications centre.</strong><p>'+esc(e.message)+'</p>');</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPAZA — Marketing & Advertising</title><link rel="stylesheet" href="css/style.css"><style>.wrap{max-width:1200px;margin:auto;padding:32px 18px 70px}.panel{background:#fff;border:1px solid #e2e6e7;border-radius:16px;padding:20px;margin-top:20px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.metric{font-size:1.5rem;font-weight:800;margin-top:8px}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.toolbar input,.toolbar select,form input,form textarea,form select{padding:11px;border:1px solid #ddd;border-radius:8px;width:100%;box-sizing:border-box}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}form{display:grid;gap:12px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px 9px;border-bottom:1px solid #edf0f1;white-space:nowrap}.badge{padding:4px 8px;border-radius:999px;background:#eef2f1;font-size:.78rem;font-weight:700}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid,.row{grid-template-columns:1fr}}</style></head><body><header class="site-header"><a class="logo-wrap" href="index.html"><img class="site-logo" src="images/spaza-logo.png" alt="Spaza"></a><div class="header-actions"><a href="admin-operations.html">Operations</a><a href="admin-notifications.html">Notifications</a></div></header><main class="wrap"><p class="eyebrow">ADMIN CENTRE</p><h1>Marketing &amp; Advertising</h1><p class="page-intro">Manage marketplace advertising campaigns. Financial performance remains empty until real campaigns generate spend and results.</p><div id="gate" class="panel">Checking access…</div><section id="content" hidden><div class="grid"><div class="panel"><span>Campaigns</span><div class="metric" id="all">—</div></div><div class="panel"><span>Active</span><div class="metric" id="active">—</div></div><div class="panel"><span>Budget</span><div class="metric" id="budget">R0.00</div></div><div class="panel"><span>Spent</span><div class="metric" id="spent">R0.00</div></div></div><div class="panel"><h2>Create campaign</h2><form id="form"><input id="name" required placeholder="Campaign name"><textarea id="description" rows="4" placeholder="Description"></textarea><div class="row"><select id="type"><option>PRODUCT</option><option>CATEGORY</option><option>BANNER</option><option>SPONSORED_LISTING</option></select><select id="status"><option>DRAFT</option><option>SCHEDULED</option><option>ACTIVE</option><option>PAUSED</option><option>CANCELLED</option></select></div><div class="row"><input id="budget" type="number" min="0" step="0.01" placeholder="Budget (ZAR)"><input id="seller" placeholder="Seller UUID (optional)"></div><input id="product" placeholder="Product UUID (optional)"><div class="row"><input id="starts" type="datetime-local"><input id="ends" type="datetime-local"></div><button class="button" type="submit">Save campaign</button></form></div><div class="panel"><div class="toolbar"><input id="q" placeholder="Search campaigns"><select id="filter"><option value="">All statuses</option><option>DRAFT</option><option>SCHEDULED</option><option>ACTIVE</option><option>PAUSED</option><option>COMPLETED</option><option>CANCELLED</option></select></div><div id="table" style="margin-top:15px">Loading…</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const db=SpazaDB,esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let rows=[];async function init(){const{data:{user}}=await db.auth.getUser();if(!user){location.href='login.html';return}const{data:r,error}=await db.from('profile_roles').select('roles(code)').eq('profile_id',user.id);if(error)throw error;const ok=(r||[]).some(x=>['ADMIN','OWNER','MARKETING'].includes(String(x.roles?.code||'').toUpperCase()));if(!ok){gate.innerHTML='<strong>Admin or Marketing access required.</strong>';return}gate.remove();content.hidden=false;await load()}async function load(){const{data,error}=await db.from('ad_campaigns').select('*').order('created_at',{ascending:false});if(error)throw error;rows=data||[];all.textContent=rows.length;active.textContent=rows.filter(x=>x.status==='ACTIVE').length;budget.textContent='R'+rows.reduce((a,x)=>a+Number(x.budget||0),0).toFixed(2);spent.textContent='R'+rows.reduce((a,x)=>a+Number(x.spent_amount||0),0).toFixed(2);render()}function render(){const q=document.getElementById('q').value.toLowerCase(),f=document.getElementById('filter').value,a=rows.filter(x=>(!f||x.status===f)&&(!q||(x.name+' '+(x.description||'')+' '+x.campaign_type).toLowerCase().includes(q)));table.innerHTML=!a.length?'<div style="text-align:center;padding:40px"><strong>No campaigns found.</strong><p>Create a campaign when a real advertising opportunity is available.</p></div>':'<div class="table-wrap"><table class="table"><thead><tr><th>Campaign</th><th>Type</th><th>Status</th><th>Budget</th><th>Spent</th><th>Start</th><th>End</th></tr></thead><tbody>'+a.map(x=>`<tr><td>${esc(x.name)}<br><small>${esc(x.campaign_number)}</small></td><td>${esc(x.campaign_type)}</td><td><span class="badge">${esc(x.status)}</span></td><td>R${Number(x.budget||0).toFixed(2)}</td><td>R${Number(x.spent_amount||0).toFixed(2)}</td><td>${x.starts_at?new Date(x.starts_at).toLocaleString('en-ZA'):'—'}</td><td>${x.ends_at?new Date(x.ends_at).toLocaleString('en-ZA'):'—'}</td></tr>`).join('')+'</tbody></table></div>'}form.addEventListener('submit',async e=>{e.preventDefault();const val=id=>document.getElementById(id).value;const iso=id=>val(id)?new Date(val(id)).toISOString():null;const{error}=await db.rpc('admin_save_ad_campaign',{p_name:val('name'),p_description:val('description')||null,p_campaign_type:val('type'),p_status:val('status'),p_seller_id:val('seller')||null,p_product_id:val('product')||null,p_budget:Number(val('budget')||0),p_starts_at:iso('starts'),p_ends_at:iso('ends')});if(error){alert(error.message);return}form.reset();await load();alert('Campaign saved. Ad delivery/reporting requires the connected advertising workflow.');});q.addEventListener('input',render);filter.addEventListener('change',render);init().catch(e=>gate.innerHTML='<strong>Could not load marketing centre.</strong><p>'+esc(e.message)+'</p>');</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPAZA — Seller Applications</title><link rel="stylesheet" href="css/style.css"><style>.wrap{max-width:1180px;margin:auto;padding:32px 18px 70px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.toolbar input,.toolbar select,.modal textarea{padding:11px;border:1px solid #ddd;border-radius:8px}.panel{background:#fff;border:1px solid #e2e6e7;border-radius:16px;padding:20px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:13px 10px;border-bottom:1px solid #edf0f1;white-space:nowrap}.badge{padding:5px 9px;border-radius:999px;background:#eef2f1;font-size:.78rem;font-weight:700}.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.modal-card{background:#fff;border-radius:16px;padding:24px;max-width:680px;width:100%;max-height:90vh;overflow:auto}.field{padding:12px;background:#f7f8f8;border-radius:9px;margin:8px 0}.field small{display:block;color:#68727a}.modal textarea{width:100%;min-height:110px;box-sizing:border-box;margin-top:8px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}@media(max-width:650px){.wrap{padding:22px 14px}.table th,.table td{padding:10px 8px}}</style></head><body><header class="site-header"><a class="logo-wrap" href="index.html"><img class="site-logo" src="images/spaza-logo.png" alt="Spaza"></a><div class="header-actions"><a href="admin-operations.html">Operations</a><a href="admin-payouts.html">Payouts</a></div></header><main class="wrap"><p class="eyebrow">ADMIN CENTRE</p><h1>Seller Applications</h1><p class="page-intro">Review marketplace partner applications and approve only verified applicants.</p><div id="gate" class="panel">Checking administrator access…</div><section id="content" hidden><div class="toolbar"><input id="q" type="search" placeholder="Search business, email or application"><select id="status"><option value="">All statuses</option><option>PENDING</option><option>UNDER_REVIEW</option><option>ACTION_REQUIRED</option><option>APPROVED</option><option>REJECTED</option></select></div><div id="table" class="panel">Loading applications…</div></section></main><div id="modal" class="modal"><div class="modal-card" id="modalBody"></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const db=SpazaDB;let rows=[];const esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const up=v=>String(v||'').toUpperCase();async function init(){const{data:{user}}=await db.auth.getUser();if(!user){location.href='login.html';return}const{data:roles,error}=await db.from('profile_roles').select('roles(name,code)').eq('profile_id',user.id);if(error)throw error;const ok=(roles||[]).some(x=>['ADMIN','OWNER'].includes(up(x.roles?.code||x.roles?.name)));if(!ok){document.getElementById('gate').innerHTML='<strong>Administrator access required.</strong>';return}document.getElementById('gate').remove();document.getElementById('content').hidden=false;await load()}async function load(){const{data,error}=await db.from('seller_applications').select('*').order('created_at',{ascending:false});if(error)throw error;rows=data||[];render()}function render(){const q=document.getElementById('q').value.toLowerCase(),s=up(document.getElementById('status').value);const list=rows.filter(x=>(!s||up(x.verification_status)===s)&&(!q||JSON.stringify(x).toLowerCase().includes(q)));if(!list.length){document.getElementById('table').innerHTML='<div style="text-align:center;padding:45px"><strong>No seller applications found.</strong><p>Applications will appear here after customers submit partner applications.</p></div>';return}document.getElementById('table').innerHTML='<div class="table-wrap"><table class="table"><thead><tr><th>Application</th><th>Business</th><th>Type</th><th>Status</th><th>Submitted</th><th></th></tr></thead><tbody>'+list.map(x=>`<tr><td>${esc(x.application_number||x.id)}</td><td>${esc(x.business_name)}</td><td>${esc(x.business_type)}</td><td><span class="badge">${esc(x.verification_status)}</span></td><td>${x.submitted_at?new Date(x.submitted_at).toLocaleString('en-ZA'):'—'}</td><td><button class="button" onclick="view('${x.id}')">Review</button></td></tr>`).join('')+'</tbody></table></div>`}function view(id){const x=rows.find(r=>r.id===id);if(!x)return;document.getElementById('modalBody').innerHTML=`<h2>${esc(x.business_name)}</h2><p><strong>${esc(x.application_number||x.id)}</strong></p><div class="field"><small>Contact email</small>${esc(x.contact_email)}</div><div class="field"><small>Phone</small>${esc(x.contact_phone)}</div><div class="field"><small>Business type</small>${esc(x.business_type)}</div><div class="field"><small>Description</small>${esc(x.business_description)}</div><div class="field"><small>Requested categories</small>${esc(JSON.stringify(x.requested_categories||[]))}</div><div class="field"><small>Delivery capabilities</small>${esc(JSON.stringify(x.delivery_capabilities||[]))}</div><label>Review notes<textarea id="notes" placeholder="Record the reason for your decision…"></textarea></label><div class="actions"><button class="button" onclick="review('${x.id}','UNDER_REVIEW')">Under review</button><button class="button" onclick="review('${x.id}','ACTION_REQUIRED')">Action required</button><button class="button" onclick="review('${x.id}','APPROVED')">Approve</button><button class="button" onclick="review('${x.id}','REJECTED')">Reject</button><button class="button" onclick="closeModal()">Close</button></div>`;document.getElementById('modal').classList.add('open')}async function review(id,status){const notes=document.getElementById('notes')?.value||null;if(['REJECTED','ACTION_REQUIRED'].includes(status)&&!notes?.trim()){alert('Add review notes before this decision.');return}const{error}=await db.rpc('admin_review_seller_application',{p_application_id:id,p_new_status:status,p_notes:notes});if(error){alert(error.message);return}closeModal();await load();alert('Application updated to '+status+'.')}function closeModal(){document.getElementById('modal').classList.remove('open')}window.view=view;window.review=review;window.closeModal=closeModal;document.getElementById('q').addEventListener('input',render);document.getElementById('status').addEventListener('change',render);init().catch(e=>document.getElementById('gate').innerHTML='<strong>Could not load applications.</strong><p>'+esc(e.message)+'</p>');</script></body></html>

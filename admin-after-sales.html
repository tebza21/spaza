<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPAZA — After-sales Centre</title><link rel="stylesheet" href="css/style.css"><style>.wrap{max-width:1250px;margin:auto;padding:32px 18px 70px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.tabs button,.toolbar input,.toolbar select{padding:10px 12px;border:1px solid #ddd;border-radius:8px;background:#fff}.tabs button.active{font-weight:800}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.panel{background:#fff;border:1px solid #e2e6e7;border-radius:16px;padding:20px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px 9px;border-bottom:1px solid #edf0f1;white-space:nowrap}.badge{padding:4px 8px;border-radius:999px;background:#eef2f1;font-size:.78rem;font-weight:700}.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.card{background:#fff;border-radius:16px;padding:24px;max-width:850px;width:100%;max-height:90vh;overflow:auto}.row{display:flex;justify-content:space-between;gap:20px;padding:11px 0;border-bottom:1px solid #eee}.card select,.card textarea,.card input{width:100%;box-sizing:border-box;padding:10px;margin-top:8px;border:1px solid #ddd;border-radius:8px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}</style></head><body><header class="site-header"><a class="logo-wrap" href="index.html"><img class="site-logo" src="images/spaza-logo.png" alt="Spaza"></a><div class="header-actions"><a href="admin-orders.html">Orders</a><a href="admin-payouts.html">Payouts</a><a href="admin-operations.html">Operations</a></div></header><main class="wrap"><p class="eyebrow">ADMIN CENTRE</p><h1>After-sales Centre</h1><p class="page-intro">Review returns, refunds and disputes with evidence and controlled resolution actions.</p><div id="gate" class="panel">Checking administrator access…</div><section id="content" hidden><div class="tabs"><button id="returnsTab" class="active" onclick="setTab('returns')">Returns</button><button id="refundsTab" onclick="setTab('refunds')">Refunds</button><button id="disputesTab" onclick="setTab('disputes')">Disputes</button></div><div class="toolbar"><input id="q" placeholder="Search reference, order or reason"><select id="status"><option value="">All statuses</option></select></div><div id="table" class="panel">Loading…</div></section></main><div id="modal" class="modal"><div class="card" id="modalBody"></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const db=SpazaDB,esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let tab='returns',data=[];const statuses={returns:['REQUESTED','APPROVED','REJECTED','RECEIVED','INSPECTING','COMPLETED','CANCELLED'],refunds:['REQUESTED','PROCESSING','REFUNDED','FAILED','CANCELLED'],disputes:['OPEN','UNDER_REVIEW','RESOLVED','REJECTED','CLOSED']};async function init(){const{data:{user}}=await db.auth.getUser();if(!user){location.href='login.html';return}const{data:r,error}=await db.from('profile_roles').select('roles(name,code)').eq('profile_id',user.id);if(error)throw error;if(!(r||[]).some(x=>['ADMIN','OWNER'].includes(String(x.roles?.code||x.roles?.name||'').toUpperCase()))){document.getElementById('gate').innerHTML='<strong>Administrator access required.</strong>';return}document.getElementById('gate').remove();document.getElementById('content').hidden=false;await load()}function setTab(t){tab=t;document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));document.getElementById(t+'Tab').classList.add('active');document.getElementById('status').innerHTML='<option value="">All statuses</option>'+statuses[t].map(s=>`<option>${s}</option>`).join('');load()}async function load(){const table=tab==='returns'?'returns':tab==='refunds'?'refunds':'disputes';let q=db.from(table).select('*').order('created_at',{ascending:false});const{data:d,error}=await q;if(error){document.getElementById('table').innerHTML='<strong>Could not load records.</strong><p>'+esc(error.message)+'</p>';return}data=d||[];render()}function render(){const q=document.getElementById('q').value.toLowerCase(),s=document.getElementById('status').value;const a=data.filter(x=>(!s||x.status===s)&&(!q||JSON.stringify(x).toLowerCase().includes(q)));if(!a.length){document.getElementById('table').innerHTML='<div style="text-align:center;padding:45px"><strong>No '+tab+' records found.</strong><p>There are no matching after-sales records.</p></div>';return}const ref=tab==='returns'?'return_number':tab==='refunds'?'refund_number':'dispute_number';document.getElementById('table').innerHTML='<div class="table-wrap"><table class="table"><thead><tr><th>Reference</th><th>Order</th><th>Customer</th><th>Seller</th><th>Amount</th><th>Status</th><th>Created</th><th></th></tr></thead><tbody>'+a.map(x=>`<tr><td>${esc(x[ref]||x.id)}</td><td>${esc(x.order_id)}</td><td>${esc(x.customer_id)}</td><td>${esc(x.seller_id)}</td><td>${tab==='returns'?'—':'R'+Number(x.amount||x.amount_disputed||0).toFixed(2)}</td><td><span class="badge">${esc(x.status)}</span></td><td>${new Date(x.created_at).toLocaleString('en-ZA')}</td><td><button class="button" onclick="view('${x.id}')">Review</button></td></tr>`).join('')+'</tbody></table></div>'}async function view(id){const x=data.find(v=>v.id===id);if(!x)return;const ref=tab==='returns'?'return_number':tab==='refunds'?'refund_number':'dispute_number';let evidence='';if(tab==='returns'){const{data:e}=await db.from('return_evidence').select('file_name,evidence_type,notes,created_at').eq('return_id',id).order('created_at',{ascending:false});evidence=e||[]}else if(tab==='disputes'){const{data:e}=await db.from('dispute_evidence').select('evidence_type,file_path,description,created_at').eq('dispute_id',id).order('created_at',{ascending:false});evidence=e||[]}document.getElementById('modalBody').innerHTML=`<h2>${esc(x[ref]||x.id)}</h2><div class="row"><span>Order</span><strong>${esc(x.order_id)}</strong></div><div class="row"><span>Customer</span><strong>${esc(x.customer_id)}</strong></div><div class="row"><span>Seller</span><strong>${esc(x.seller_id)}</strong></div><div class="row"><span>Reason</span><strong>${esc(x.reason)}</strong></div><div class="row"><span>Status</span><strong>${esc(x.status)}</strong></div><p>${esc(x.description||x.customer_notes||x.reason)}</p><h3>Resolution</h3><select id="newStatus">${statuses[tab].map(s=>`<option>${s}</option>`).join('')}</select><textarea id="notes" placeholder="Decision / resolution notes">${esc(x.decision_notes||x.resolution_notes||'')}</textarea><div class="actions"><button class="button" onclick="save('${id}')">Save resolution</button><button class="button" onclick="closeModal()">Close</button></div><h3>Evidence</h3>${evidence?.length?evidence.map(e=>`<div class="row"><span>${esc(e.file_name||e.evidence_type)}</span><small>${esc(e.notes||e.description||e.file_path)}</small></div>`).join(''):'<p>No evidence records attached.</p>'}`;document.getElementById('newStatus').value=x.status;document.getElementById('modal').classList.add('open')}async function save(id){const status=document.getElementById('newStatus').value,notes=document.getElementById('notes').value||null;let fn,args;if(tab==='returns'){fn='admin_resolve_return';args={p_return_id:id,p_new_status:status,p_notes:notes}}else if(tab==='disputes'){fn='admin_resolve_dispute';args={p_dispute_id:id,p_resolution:status,p_decision_notes:notes}}else{alert('Refund status changes remain in the dedicated Refund Management workflow to keep provider processing controlled.');return}const{error}=await db.rpc(fn,args);if(error){alert(error.message);return}closeModal();await load()}function closeModal(){document.getElementById('modal').classList.remove('open')}window.setTab=setTab;window.view=view;window.save=save;window.closeModal=closeModal;document.getElementById('q').addEventListener('input',render);document.getElementById('status').addEventListener('change',render);init().then(()=>setTab('returns')).catch(e=>document.getElementById('gate').innerHTML='<strong>After-sales centre could not load.</strong><p>'+esc(e.message)+'</p>');</script></body></html>

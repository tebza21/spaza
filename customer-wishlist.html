<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wishlist | Spaza</title><link rel="stylesheet" href="css/style.css"><style>.wrap{max-width:1180px;margin:auto;padding:40px 20px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.item{border:1px solid #e3e6e8;border-radius:14px;padding:16px}.empty{text-align:center;padding:50px;border:1px dashed #ccd2d5;border-radius:14px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><header class="site-header"><a class="logo-wrap" href="index.html"><img class="site-logo" src="images/spaza-logo.png" alt="Spaza"></a><div class="header-actions"><a href="account.html">Account</a><a href="cart.html">Cart</a></div></header><main class="wrap"><p class="eyebrow">CUSTOMER CENTRE</p><h1>Wishlist</h1><p>Products you save for later will appear here.</p><div id="list"><div class="empty">Loading wishlist…</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>async function load(){const {data:{user}}=await SpazaDB.auth.getUser();if(!user){location.href='login.html?role=customer';return}const r=await SpazaDB.from('wishlists').select('id,product_id,created_at,products(id,name,slug,description)').eq('profile_id',user.id).order('created_at',{ascending:false});if(r.error){list.innerHTML='<div class="empty">Wishlist is not available yet.</div>';return}const rows=r.data||[];list.innerHTML=rows.length?'<div class="grid">'+rows.map(x=>`<article class="item"><h2>${esc(x.products?.name||'Product')}</h2><p>${esc(x.products?.description||'')}</p><a class="button primary" href="product.html?id=${encodeURIComponent(x.product_id)}">View product</a><button class="button secondary" onclick="removeItem('${x.id}')">Remove</button></article>`).join('')+'</div>':'<div class="empty"><strong>Your wishlist is empty</strong><p>Save products from the marketplace to find them quickly later.</p><a class="button primary" href="shop.html">Browse Shop</a></div>'}const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));window.removeItem=async id=>{const {error}=await SpazaDB.from('wishlists').delete().eq('id',id);if(error)alert(error.message);else load()};load();</script></body></html>

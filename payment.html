<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secure Payment | Spaza</title><link rel="stylesheet" href="css/style.css"><style>.pay{max-width:760px;margin:40px auto;padding:20px}.card{padding:24px;border:1px solid #e2e6e8;border-radius:16px;background:#fff}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}.muted{color:#667}.error{color:#8d2929;background:#fff1f1;padding:12px;border-radius:10px}</style></head><body><header class="site-header compact"><a class="brand" href="index.html"><img src="images/spaza-logo.png" alt="Spaza"></a><div class="header-actions"><a href="account.html">Account</a><a href="cart.html">Cart</a></div></header><main class="pay"><p class="eyebrow">SECURE PAYMENT</p><h1>Complete your payment</h1><div id="status" class="card"><p>Loading payment session…</p></div><div class="actions"><a class="button" href="checkout.html">Back to checkout</a><a class="button" href="orders.html">My Orders</a></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>(async()=>{const S=window.SpazaDB||window.supabaseClient;const box=document.getElementById('status');if(!S){box.innerHTML='<p class="error">Supabase configuration unavailable.</p>';return}const {data:{user}}=await S.auth.getUser();if(!user){location.href='login.html?role=customer&redirect='+encodeURIComponent(location.href);return}const q=new URLSearchParams(location.search),order=q.get('order'),session=q.get('session');if(!order&&!session){box.innerHTML='<strong>No payment session selected.</strong><p>Return to checkout to continue.</p>';return}let req=S.from('payment_sessions').select('id,order_id,amount,currency,status,provider_name,provider_reference,redirect_url,expires_at').eq('profile_id',user.id);req=session?req.eq('id',session):req.eq('order_id',order);const {data,error}=await req.maybeSingle();if(error||!data){box.innerHTML='<strong>Payment session unavailable.</strong>';return}const money=Number(data.amount||0).toLocaleString('en-ZA',{minimumFractionDigits:2,maximumFractionDigits:2});box.innerHTML='<h2>'+String(data.status||'CREATED').replaceAll('_',' ')+'</h2><p><strong>Order:</strong> '+String(data.order_id||'—')+'</p><p><strong>Amount:</strong> '+String(data.currency||'ZAR')+' '+money+'</p><p><strong>Provider:</strong> '+String(data.provider_name||'Payfast TEST')+'</p>'+(data.expires_at?'<p class="muted">Session expires: '+new Date(data.expires_at).toLocaleString('en-ZA')+'</p>':'')+(data.redirect_url?'<p><a class="button primary" href="'+data.redirect_url.replace(/&/g,'&amp;').replace(/\"/g,'&quot;')+'">Continue to payment</a></p>':'<p class="muted">Payfast TEST checkout is not yet configured with merchant credentials. No payment has been charged.</p>');})();</script></body></html>

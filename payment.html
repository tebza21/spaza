<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secure Payment | Spaza</title><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header compact"><a class="brand" href="index.html"><img src="images/spaza-logo.png" alt="Spaza"></a><div class="header-actions"><a href="account.html">Account</a><a href="cart.html">Cart</a></div></header><main class="container" style="max-width:900px;margin:40px auto;padding:20px"><p class="eyebrow">SECURE PAYMENT</p><h1 id="title">Payment session</h1><div id="status" class="card" style="padding:24px;margin-top:20px"><p>Loading…</p></div><p style="margin-top:24px"><a class="button primary" href="checkout.html">Back to checkout</a> <a class="button" href="orders.html">My Orders</a></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>(async()=>{const S=window.SpazaDB||window.supabaseClient;const box=document.getElementById('status');if(!S){box.textContent='Supabase configuration unavailable.';return}const {data:{user}}=await S.auth.getUser();if(!user){location.href='login.html?role=customer&redirect='+encodeURIComponent(location.href);return}const q=new URLSearchParams(location.search);const order=q.get('order');const session=q.get('session');if(!order&&!session){box.innerHTML='<strong>No payment session selected.</strong><p>Return to checkout to continue.</p>';return}let req=S.from('payment_sessions').select('id,order_id,amount,currency,status,provider_name,provider_reference,expires_at').eq('profile_id',user.id);req=session?req.eq('id',session):req.eq('order_id',order);const {data,error}=await req.maybeSingle();if(error||!data){box.innerHTML='<strong>Payment session unavailable.</strong>';return}document.getElementById('title').textContent='Payment session';box.innerHTML='<h2>'+String(data.status||'CREATED').replaceAll('_',' ')+'</h2><p>Order: '+(data.order_id||'—')+'</p><p>Amount: '+(data.currency||'ZAR')+' '+Number(data.amount||0).toFixed(2)+'</p><p>Provider: '+(data.provider_name||'Not configured')+'</p>'+(data.provider_reference?'<p>Provider reference: '+data.provider_reference+'</p>':'')+'<p><strong>Live provider checkout is not connected yet. No payment has been charged from this screen.</strong></p>';})();</script></body></html>

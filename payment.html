<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secure Payment | Spaza</title><link rel="stylesheet" href="css/style.css"><style>.pay{max-width:760px;margin:40px auto;padding:20px}.card{padding:24px;border:1px solid #e2e6e8;border-radius:16px;background:#fff}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}.muted{color:#667}.error{color:#8d2929;background:#fff1f1;padding:12px;border-radius:10px}.success{color:#245b35;background:#eefaf1;padding:12px;border-radius:10px}</style></head><body><header class="site-header compact"><a class="brand" href="index.html"><img src="images/spaza-logo.png" alt="Spaza"></a><div class="header-actions"><a href="account.html">Account</a><a href="cart.html">Cart</a></div></header><main class="pay"><p class="eyebrow">SECURE PAYMENT</p><h1>Complete your payment</h1><div id="status" class="card"><p>Loading payment session…</p></div><div class="actions"><a class="button" href="checkout.html">Back to checkout</a><a class="button" href="orders.html">My Orders</a></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>(async()=>{const S=window.SpazaDB||window.supabaseClient,box=document.getElementById('status');if(!S){box.innerHTML='<p class="error">Supabase configuration unavailable.</p>';return}const {data:{user}}=await S.auth.getUser();if(!user){location.href='login.html?role=customer&redirect='+encodeURIComponent(location.href);return}const q=new URLSearchParams(location.search),order=q.get('order'),session=q.get('session');if(!order&&!session){box.innerHTML='<strong>No payment session selected.</strong><p>Return to checkout to continue.</p>';return}let req=S.from('payment_sessions').select('id,order_id,profile_id,amount,currency,status,provider_name,provider_reference,redirect_url,expires_at').eq('profile_id',user.id);req=session?req.eq('id',session):req.eq('order_id',order);const {data,error}=await req.maybeSingle();if(error||!data){box.innerHTML='<strong>Payment session unavailable.</strong>';return}const money=Number(data.amount||0).toLocaleString('en-ZA',{minimumFractionDigits:2,maximumFractionDigits:2});const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));box.innerHTML='<h2>'+safe(data.status||'CREATED').replaceAll('_',' ')+'</h2><p><strong>Order:</strong> '+safe(data.order_id||'—')+'</p><p><strong>Amount:</strong> '+safe(data.currency||'ZAR')+' '+money+'</p><p><strong>Provider:</strong> '+safe(data.provider_name||'Payfast TEST')+'</p>'+(data.expires_at?'<p class="muted">Session expires: '+safe(new Date(data.expires_at).toLocaleString('en-ZA'))+'</p>':'')+'<div id="pay-actions"><p class="muted">Preparing secure Payfast checkout…</p></div>';if(data.status==='PAID'){document.getElementById('pay-actions').innerHTML='<p class="success">Payment recorded for this session.</p>';return}if(data.expires_at&&new Date(data.expires_at).getTime()<=Date.now()){document.getElementById('pay-actions').innerHTML='<p class="error">This payment session has expired. Please return to checkout and create a new payment.</p>';return}try{const {data:fn,error:fe}=await S.functions.invoke('create-payment-checkout-v2',{body:{payment_session_id:data.id}});if(fe)throw new Error(fe.message||'Unable to create Payfast checkout');if(!fn||!fn.checkout_url||!fn.fields)throw new Error(fn?.error||'Payfast checkout response was incomplete');const action=document.getElementById('pay-actions');action.innerHTML='<p>Secure checkout is ready.</p><button id="continue-pay" class="button primary" type="button">Continue to Payfast TEST</button><p class="muted">You will be redirected to Payfast to complete the payment.</p>';document.getElementById('continue-pay').addEventListener('click',()=>{const form=document.createElement('form');form.method='POST';form.action=fn.checkout_url;form.style.display='none';Object.entries(fn.fields).forEach(([k,v])=>{const input=document.createElement('input');input.type='hidden';input.name=k;input.value=String(v);form.appendChild(input)});document.body.appendChild(form);form.submit()})}catch(err){document.getElementById('pay-actions').innerHTML='<p class="error">'+safe(err.message||'Unable to start payment.')+'</p>'}})();</script></body></html>

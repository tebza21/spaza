<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPAZA — Order Operations</title><link rel="stylesheet" href="css/style.css"><style>.wrap{max-width:1200px;margin:auto;padding:32px 18px 70px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.toolbar input,.toolbar select{padding:11px;border:1px solid #ddd;border-radius:8px}.panel{background:#fff;border:1px solid #e2e6e7;border-radius:16px;padding:20px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px 10px;border-bottom:1px solid #edf0f1;white-space:nowrap}.badge{padding:4px 8px;border-radius:999px;background:#eef2f1;font-size:.78rem;font-weight:700}.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.modal-card{background:#fff;border-radius:16px;padding:24px;max-width:850px;width:100%;max-height:90vh;overflow:auto}.row{display:flex;justify-content:space-between;gap:15px;padding:12px 0;border-bottom:1px solid #eee}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.modal select,.modal textarea{padding:10px;width:100%;box-sizing:border-box;border:1px solid #ddd;border-radius:8px}.modal textarea{min-height:80px;margin-top:8px}</style></head><body><header class="site-header"><a class="logo-wrap" href="index.html"><img class="site-logo" src="images/spaza-logo.png" alt="Spaza"></a><div class="header-actions"><a href="admin-operations.html">Operations</a><a href="admin-seller-applications.html">Sellers</a><a href="admin-payouts.html">Payouts</a></div></header><main class="wrap"><p class="eyebrow">ADMIN CENTRE</p><h1>Order &amp; Fulfilment Operations</h1><p class="page-intro">Monitor customer orders, seller fulfilments and delivery tracking from one operational view.</p><div id="gate" class="panel">Checking administrator access…</div><section id="content" hidden><div class="toolbar"><input id="q" type="search" placeholder="Search order or seller order"><select id="status"><option value="">All statuses</option><option>NEW</option><option>ACCEPTED</option><option>PROCESSING</option><option>READY</option><option>SHIPPED</option><option>OUT_FOR_DELIVERY</option><option>READY_FOR_PICKUP</option><option>DELIVERED</option><option>COMPLETED</option><option>CANCELLED</option><option>RETURN_REQUESTED</option><option>DISPUTED</option></select></div><div id="table" class="panel">Loading orders…</div></section></main><div id="modal" class="modal"><div class="modal-card" id="body"></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const db=SpazaDB;let rows=[];const esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function init(){const{data:{user}}=await db.auth.getUser();if(!user){location.href='login.html';return}const{data:roles,error}=await db.from('profile_roles').select('roles(name,code)').eq('profile_id',user.id);if(error)throw error;const ok=(roles||[]).some(x=>['ADMIN','OWNER'].includes(String(x.roles?.code||x.roles?.name||'').toUpperCase()));if(!ok){document.getElementById('gate').innerHTML='<strong>Administrator access required.</strong>';return}document.getElementById('gate').remove();document.getElementById('content').hidden=false;await load()}async function load(){const{data,error}=await db.from('seller_orders').select('id,seller_order_number,order_id,seller_id,status,subtotal,delivery_fee,total,accepted_at,shipped_at,delivered_at,completed_at,created_at').order('created_at',{ascending:false});if(error)throw error;rows=data||[];render()}function render(){const q=document.getElementById('q').value.toLowerCase(),s=document.getElementById('status').value;const a=rows.filter(x=>(!s||x.status===s)&&(!q||JSON.stringify(x).toLowerCase().includes(q)));if(!a.length){document.getElementById('table').innerHTML='<div style="text-align:center;padding:45px"><strong>No seller fulfilments found.</strong><p>Operational records will appear after customer orders are created.</p></div>';return}document.getElementById('table').innerHTML='<div class="table-wrap"><table class="table"><thead><tr><th>Seller order</th><th>Order</th><th>Seller</th><th>Total</th><th>Status</th><th>Created</th><th></th></tr></thead><tbody>'+a.map(x=>`<tr><td>${esc(x.seller_order_number||x.id)}</td><td>${esc(x.order_id)}</td><td>${esc(x.seller_id)}</td><td>R${Number(x.total||0).toFixed(2)}</td><td><span class="badge">${esc(x.status)}</span></td><td>${new Date(x.created_at).toLocaleString('en-ZA')}</td><td><button class="button" onclick="view('${x.id}')">Manage</button></td></tr>`).join('')+'</tbody></table></div>'}async function view(id){const x=rows.find(r=>r.id===id);if(!x)return;const{data:dels}=await db.from('deliveries').select('id,delivery_number,status,tracking_number,courier_name,courier_reference,delivery_address,estimated_from,estimated_to,delivered_at').eq('seller_order_id',id).order('created_at',{ascending:false});document.getElementById('body').innerHTML=`<h2>${esc(x.seller_order_number||x.id)}</h2><div class="row"><span>Order</span><strong>${esc(x.order_id)}</strong></div><div class="row"><span>Seller</span><strong>${esc(x.seller_id)}</strong></div><div class="row"><span>Total</span><strong>R${Number(x.total||0).toFixed(2)}</strong></div><h3 style="margin-top:22px">Fulfilment status</h3><select id="newStatus"><option>NEW</option><option>ACCEPTED</option><option>PROCESSING</option><option>READY</option><option>SHIPPED</option><option>OUT_FOR_DELIVERY</option><option>READY_FOR_PICKUP</option><option>DELIVERED</option><option>COMPLETED</option><option>CANCELLED</option><option>RETURN_REQUESTED</option><option>DISPUTED</option></select><textarea id="notes" placeholder="Optional operational note"></textarea><div class="actions"><button class="button" onclick="save('${x.id}')">Update status</button><button class="button" onclick="closeModal()">Close</button></div><h3>Delivery records</h3>${dels?.length?dels.map(d=>`<div class="row"><span><strong>${esc(d.delivery_number||d.id)}</strong><br><small>${esc(d.courier_name||'Courier not assigned')} ${esc(d.tracking_number||'')}</small></span><span class="badge">${esc(d.status)}</span></div>`).join(''):'<p>No delivery record is attached.</p>'}`;document.getElementById('newStatus').value=x.status;document.getElementById('modal').classList.add('open')}async function save(id){const status=document.getElementById('newStatus').value,notes=document.getElementById('notes').value||null;const{error}=await db.rpc('admin_update_seller_order_status',{p_seller_order_id:id,p_new_status:status,p_notes:notes});if(error){alert(error.message);return}closeModal();await load()}function closeModal(){document.getElementById('modal').classList.remove('open')}window.view=view;window.save=save;window.closeModal=closeModal;document.getElementById('q').addEventListener('input',render);document.getElementById('status').addEventListener('change',render);init().catch(e=>document.getElementById('gate').innerHTML='<strong>Orders could not load.</strong><p>'+esc(e.message)+'</p>');</script></body></html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Spaza customer orders and delivery tracking.">
<title>My Orders | Spaza</title>
<link rel="stylesheet" href="css/style.css">
<style>
.orders-page{max-width:1180px;margin:0 auto;padding:42px 20px 70px}.orders-toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:24px 0}.order-tabs{display:flex;gap:8px;flex-wrap:wrap}.order-tabs button{border:1px solid #dfe3e6;background:#fff;border-radius:999px;padding:9px 16px;cursor:pointer}.order-tabs button.active{background:#111;color:#fff}.order-search{padding:11px 14px;border:1px solid #dfe3e6;border-radius:10px;min-width:240px}.orders-list{display:grid;gap:16px}.order-card{background:#fff;border:1px solid #e4e7e9;border-radius:16px;padding:20px;box-shadow:0 8px 24px rgba(0,0,0,.04)}.order-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}.order-number{font-weight:800;font-size:1.05rem}.order-date{color:#69727a;font-size:.9rem;margin-top:4px}.order-status{display:inline-flex;border-radius:999px;padding:7px 11px;background:#eef2f3;font-size:.84rem;font-weight:700}.order-status.paid,.order-status.delivered,.order-status.completed{background:#e9f8ed;color:#18753a}.order-status.cancelled,.order-status.refunded{background:#fff0f0;color:#a52b2b}.order-summary{display:flex;gap:28px;flex-wrap:wrap;margin:18px 0;padding:14px 0;border-top:1px solid #edf0f1;border-bottom:1px solid #edf0f1}.order-summary span{display:block;color:#69727a;font-size:.8rem}.order-summary strong{display:block;margin-top:3px}.seller-block{padding:13px 0;border-bottom:1px solid #edf0f1}.seller-block:last-child{border-bottom:0}.seller-title{font-weight:800}.seller-status{font-size:.84rem;color:#59636b;margin-top:5px}.tracking-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.tracking-chip{font-size:.78rem;padding:6px 9px;border-radius:8px;background:#f5f7f7}.order-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.empty-orders{text-align:center;background:#fff;border:1px dashed #cfd5d8;border-radius:16px;padding:55px 20px}.empty-orders h2{margin:0 0 8px}.loading{padding:30px;text-align:center;color:#69727a}.error-box{padding:18px;border-radius:12px;background:#fff1f1;color:#8c2525}.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.modal-backdrop.open{display:flex}.order-modal{background:#fff;border-radius:18px;max-width:720px;width:100%;max-height:85vh;overflow:auto;padding:24px}.timeline{margin:22px 0}.timeline-item{display:flex;gap:12px;padding:12px 0}.timeline-dot{width:12px;height:12px;border-radius:50%;background:#aab2b6;margin-top:5px;flex:0 0 12px}.timeline-item.current .timeline-dot{background:#20a63a}.timeline-item strong{display:block}.timeline-item small{color:#69727a}.close-modal{float:right;border:0;background:transparent;font-size:25px;cursor:pointer}@media(max-width:640px){.orders-page{padding:28px 14px 50px}.order-search{width:100%;min-width:0}.orders-toolbar{align-items:stretch}.order-summary{gap:16px}.order-card{padding:16px}}
</style>
</head>
<body>
<header class="site-header">
  <button class="menu-button" id="menuButton" aria-label="Open menu">☰</button>
  <a class="logo-wrap" href="index.html"><img class="site-logo" src="images/spaza-logo.png" alt="Spaza"></a>
  <div class="header-actions"><a href="shop.html">Shop</a><a href="cart.html">Cart <span id="cartCount">0</span></a><a href="account.html">Account</a></div>
</header>
<nav class="main-nav"><div class="nav-inner"><a href="index.html">Home</a><a href="shop.html">Shop</a><a class="active" href="orders.html">My Orders</a><a href="account.html">My Account</a><a href="help.html">Help &amp; Support</a></div></nav>
<aside class="drawer" id="drawer" aria-hidden="true"><div class="drawer-head"><strong>SPAZA MENU</strong><button id="closeDrawer" aria-label="Close menu">×</button></div><a href="index.html">Home</a><a href="shop.html">Shop All</a><a href="cart.html">Cart</a><a href="orders.html">My Orders</a><a href="account.html">My Account</a><a href="partner.html">Become a Partner</a><a href="help.html">Help &amp; Support</a></aside><div class="overlay" id="overlay"></div>
<main class="orders-page">
  <p class="eyebrow">CUSTOMER CENTRE</p>
  <h1>My Orders</h1>
  <p>View your orders, seller fulfilments, payments and delivery progress.</p>
  <div class="orders-toolbar">
    <div class="order-tabs" id="orderTabs"><button class="active" data-filter="ALL">All</button><button data-filter="PROCESSING">Processing</button><button data-filter="SHIPPED">Shipped</button><button data-filter="DELIVERED">Delivered</button><button data-filter="CANCELLED">Cancelled</button></div>
    <input class="order-search" id="orderSearch" type="search" placeholder="Search order number...">
  </div>
  <div id="ordersContent" class="orders-list"><div class="loading">Loading your orders…</div></div>
</main>
<div class="modal-backdrop" id="trackingModal" aria-hidden="true"><div class="order-modal"><button class="close-modal" id="closeTracking" aria-label="Close">×</button><p class="eyebrow">DELIVERY TRACKING</p><h2 id="trackingTitle">Order tracking</h2><div id="trackingContent"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
const pretty=v=>String(v||'').replaceAll('_',' ').toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());
const money=(v,c='ZAR')=>new Intl.NumberFormat('en-ZA',{style:'currency',currency:c}).format(Number(v||0));
let allOrders=[];let activeFilter='ALL';
function statusClass(s){return String(s||'').toLowerCase()}
function matchesFilter(o){if(activeFilter==='ALL')return true;return o.status===activeFilter || (activeFilter==='SHIPPED'&&['SHIPPED','OUT_FOR_DELIVERY','READY_FOR_PICKUP','PARTIALLY_SHIPPED'].includes(o.status)) || (activeFilter==='PROCESSING'&&['PENDING','PAYMENT_PENDING','PAID','PROCESSING'].includes(o.status))}
function render(){const q=document.getElementById('orderSearch').value.trim().toLowerCase();const rows=allOrders.filter(o=>matchesFilter(o)&&(!q||String(o.order_number).toLowerCase().includes(q)));const el=document.getElementById('ordersContent');if(!rows.length){el.innerHTML='<div class="empty-orders"><h2>No orders found</h2><p>Your real Spaza orders will appear here after you place an order.</p><a class="button primary" href="shop.html">Start Shopping →</a></div>';return}el.innerHTML=rows.map(o=>{const sellers=(o.seller_orders||[]);const items=(o.order_items||[]);return `<article class="order-card"><div class="order-head"><div><div class="order-number">Order ${esc(o.order_number)}</div><div class="order-date">${o.placed_at?new Date(o.placed_at).toLocaleString('en-ZA'): 'Order created'}</div></div><span class="order-status ${statusClass(o.status)}">${esc(pretty(o.status))}</span></div><div class="order-summary"><div><span>Items</span><strong>${items.reduce((n,i)=>n+Number(i.quantity||0),0)}</strong></div><div><span>Sellers</span><strong>${sellers.length||new Set(items.map(i=>i.seller_id).filter(Boolean)).size}</strong></div><div><span>Total</span><strong>${money(o.grand_total,o.currency||'ZAR')}</strong></div></div>${sellers.length?sellers.map(s=>`<div class="seller-block"><div class="seller-title">Seller fulfilment ${esc(s.seller_order_number)}</div><div class="seller-status">${esc(pretty(s.status))} · ${money(s.total,o.currency||'ZAR')}</div>${(s.deliveries||[]).map(d=>`<div class="tracking-row"><span class="tracking-chip">${esc(pretty(d.status))}</span>${d.tracking_number?`<span class="tracking-chip">Tracking: ${esc(d.tracking_number)}</span>`:''}${d.courier_name?`<span class="tracking-chip">${esc(d.courier_name)}</span>`:''}</div>`).join('')}</div>`).join(''):'<div class="seller-block"><div class="seller-status">Seller fulfilment details will appear here.</div></div>'}<div class="order-actions"><button class="button primary" onclick="showTracking('${o.id}')">Track Order</button><button class="button secondary" onclick="viewOrder('${o.id}')">View Details</button></div></article>`}).join('')}
async function loadOrders(){const {data:{user},error:authError}=await SpazaDB.auth.getUser();if(authError||!user){location.href='login.html?role=customer';return}let result=await SpazaDB.from('orders').select('id,order_number,status,currency,subtotal,delivery_total,discount_total,tax_total,grand_total,placed_at,created_at,order_items(id,product_id,offer_id,seller_id,product_name,seller_name,quantity,unit_price,line_total),seller_orders(id,seller_order_number,seller_id,status,subtotal,delivery_fee,total,accepted_at,shipped_at,delivered_at,completed_at,created_at,deliveries(id,delivery_number,status,tracking_number,courier_name,courier_reference,estimated_from,estimated_to,dispatched_at,delivered_at))').eq('profile_id',user.id).order('created_at',{ascending:false});if(result.error){document.getElementById('ordersContent').innerHTML=`<div class="error-box">We couldn't load your orders right now. Please try again.</div>`;return}allOrders=result.data||[];render()}
async function showTracking(id){const o=allOrders.find(x=>x.id===id);if(!o)return;document.getElementById('trackingTitle').textContent='Order '+o.order_number;const content=document.getElementById('trackingContent');let html=`<p><strong>Order status:</strong> ${esc(pretty(o.status))}</p>`;for(const s of (o.seller_orders||[])){html+=`<section class="seller-block"><h3>${esc(s.seller_order_number)}</h3><p>${esc(pretty(s.status))}</p>`;for(const d of (s.deliveries||[])){html+=`<div class="timeline">${[['PENDING','Order confirmed'],['READY_FOR_DISPATCH','Ready for dispatch'],['PICKED_UP','Picked up'],['IN_TRANSIT','In transit'],['OUT_FOR_DELIVERY','Out for delivery'],['READY_FOR_PICKUP','Ready for pickup'],['DELIVERED','Delivered']].map(([key,label])=>{const event=(window.__trackingEvents||{})[d.id]?.find(e=>e.status===key);return `<div class="timeline-item ${d.status===key?'current':''}"><span class="timeline-dot"></span><div><strong>${label}</strong>${event?`<small>${esc(event.message||'')} ${event.occurred_at?'· '+new Date(event.occurred_at).toLocaleString('en-ZA'):''}</small>`:''}</div></div>`}).join('')}</div>${d.tracking_number?`<p><strong>Tracking number:</strong> ${esc(d.tracking_number)}</p>`:''}`;}html+='</section>'}content.innerHTML=html||'<p>Tracking information is not available yet.</p>';document.getElementById('trackingModal').classList.add('open');document.getElementById('trackingModal').setAttribute('aria-hidden','false')}
async function viewOrder(id){const o=allOrders.find(x=>x.id===id);if(!o)return;document.getElementById('trackingTitle').textContent='Order '+o.order_number+' details';document.getElementById('trackingContent').innerHTML=`<p><strong>Status:</strong> ${esc(pretty(o.status))}</p><p><strong>Subtotal:</strong> ${money(o.subtotal,o.currency||'ZAR')}</p><p><strong>Delivery:</strong> ${money(o.delivery_total,o.currency||'ZAR')}</p><p><strong>Tax:</strong> ${money(o.tax_total,o.currency||'ZAR')}</p><p><strong>Total:</strong> ${money(o.grand_total,o.currency||'ZAR')}</p><h3>Items</h3>${(o.order_items||[]).map(i=>`<div class="seller-block"><strong>${esc(i.product_name||'Product')}</strong><div>${esc(i.seller_name||'Seller')} · ${Number(i.quantity||0)} × ${money(i.unit_price,o.currency||'ZAR')} = ${money(i.line_total,o.currency||'ZAR')}</div></div>`).join('')||'<p>No items recorded.</p>'}`;document.getElementById('trackingModal').classList.add('open');document.getElementById('trackingModal').setAttribute('aria-hidden','false')}
document.getElementById('orderSearch').addEventListener('input',render);document.querySelectorAll('#orderTabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#orderTabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');activeFilter=b.dataset.filter;render()});document.getElementById('closeTracking').onclick=()=>document.getElementById('trackingModal').classList.remove('open');document.getElementById('trackingModal').onclick=e=>{if(e.target.id==='trackingModal')e.currentTarget.classList.remove('open')};loadOrders();
</script>
</body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Spaza customer returns and refunds."><title>Returns & Refunds | Spaza</title><link rel="stylesheet" href="css/style.css"><style>
.wrap{max-width:1120px;margin:auto;padding:40px 20px 70px}.card{background:#fff;border:1px solid #e2e6e8;border-radius:16px;padding:20px;margin:16px 0}.form{display:grid;gap:12px}.form input,.form textarea,.form select{padding:12px;border:1px solid #d7dde0;border-radius:9px;font:inherit;width:100%;box-sizing:border-box}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.return-card{border:1px solid #e2e6e8;border-radius:14px;padding:17px;margin:12px 0}.head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.badge{padding:6px 10px;border-radius:999px;background:#eef2f3;font-size:.8rem;font-weight:700}.empty{text-align:center;padding:45px 20px;border:1px dashed #ccd2d5;border-radius:15px}.message{padding:11px;border-radius:9px}.error{background:#fff1f1;color:#8d2929}.success{background:#eefaf1;color:#245b35}.muted{color:#68727a;font-size:.9rem}@media(max-width:700px){.grid{grid-template-columns:1fr}.wrap{padding:28px 14px 50px}}
</style></head><body><header class="site-header"><a class="logo-wrap" href="index.html"><img class="site-logo" src="images/spaza-logo.png" alt="Spaza"></a><div class="header-actions"><a href="orders.html">Orders</a><a href="account.html">Account</a></div></header><nav class="main-nav"><div class="nav-inner"><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="orders.html">My Orders</a><a class="active" href="customer-returns.html">Returns & Refunds</a><a href="help.html">Help & Support</a></div></nav><main class="wrap"><p class="eyebrow">CUSTOMER CENTRE</p><h1>Returns & Refunds</h1><p>Request a return for an eligible order item and follow the status of your request and refund.</p><section class="card"><h2>Start a return</h2><form id="form" class="form"><label>Order item<select id="item" required><option value="">Loading eligible order items…</option></select></label><div class="grid"><label>Reason<select id="reason" required><option value="">Select a reason</option><option value="DAMAGED">Damaged</option><option value="WRONG_ITEM">Wrong item</option><option value="NOT_AS_DESCRIBED">Not as described</option><option value="MISSING_ITEM">Missing item</option><option value="CHANGE_OF_MIND">Change of mind</option><option value="OTHER">Other</option></select></label><label>Quantity<input id="quantity" type="number" min="1" value="1" required></label></div><label>Notes<textarea id="notes" rows="4" placeholder="Add useful details about the return"></textarea></label><button id="submit" class="button primary">Submit return request</button><div id="message"></div></form></section><section><h2>My return requests</h2><div id="returns"><div class="empty">Loading returns…</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
let user,items=[];const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));const pretty=v=>String(v||'').replaceAll('_',' ').toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());const money=v=>new Intl.NumberFormat('en-ZA',{style:'currency',currency:'ZAR'}).format(Number(v||0));
async function loadItems(){const r=await SpazaDB.from('orders').select('id,order_number,status,placed_at,order_items(id,product_name,seller_name,quantity,unit_price,line_total)').eq('profile_id',user.id).order('created_at',{ascending:false});if(r.error)return;items=(r.data||[]).flatMap(o=>(o.order_items||[]).map(i=>({...i,order_id:o.id,order_number:o.order_number,order_status:o.status})));const sel=document.getElementById('item');sel.innerHTML=items.length?'<option value="">Select an order item</option>'+items.map(i=>'<option value="'+i.id+'">'+esc(i.order_number)+' — '+esc(i.product_name)+' · '+esc(i.seller_name||'Seller')+' · Qty '+Number(i.quantity||0)+'</option>').join(''):'<option value="">No order items available</option>';sel.onchange=()=>{const i=items.find(x=>x.id===sel.value);document.getElementById('quantity').max=Number(i?.quantity||1);document.getElementById('quantity').value=1}}
async function loadReturns(){const r=await SpazaDB.from('returns').select('*').eq('profile_id',user.id).order('created_at',{ascending:false});const el=document.getElementById('returns');if(r.error){el.innerHTML='<div class="empty">Return requests could not be loaded.</div>';return}const rows=r.data||[];el.innerHTML=rows.length?rows.map(x=>'<article class="return-card"><div class="head"><strong>'+esc(x.return_number||x.id)+'</strong><span class="badge">'+esc(pretty(x.status))+'</span></div><p><strong>Reason:</strong> '+esc(pretty(x.reason))+'</p><p><strong>Quantity:</strong> '+Number(x.quantity||0)+'</p><p class="muted">Requested '+new Date(x.created_at).toLocaleString('en-ZA')+'</p>'+(x.refund_status?'<p><strong>Refund:</strong> '+esc(pretty(x.refund_status))+(x.refund_reference?' · '+esc(x.refund_reference):'')+'</p>':'')+(x.notes?'<p>'+esc(x.notes)+'</p>':'')+'</article>').join(''):'<div class="empty"><h3>No return requests</h3><p>Eligible return activity will appear here.</p><a class="button" href="orders.html">View My Orders</a></div>'}
async function init(){const r=await SpazaDB.auth.getUser();user=r.data.user;if(!user){location.href='login.html?role=customer';return}await loadItems();await loadReturns()};document.getElementById('form').onsubmit=async e=>{e.preventDefault();const msg=document.getElementById('message'),btn=document.getElementById('submit'),i=items.find(x=>x.id===document.getElementById('item').value),qty=Number(document.getElementById('quantity').value);if(!i){msg.className='message error';msg.textContent='Select an order item first.';return}if(!Number.isInteger(qty)||qty<1||qty>Number(i.quantity)){msg.className='message error';msg.textContent='Choose a valid quantity for this order item.';return}btn.disabled=true;msg.className='message';msg.textContent='Submitting…';const r=await SpazaDB.rpc('create_customer_return_request',{p_order_id:i.order_id,p_order_item_id:i.id,p_reason:document.getElementById('reason').value,p_notes:document.getElementById('notes').value.trim()||null,p_quantity:qty});if(r.error){msg.className='message error';msg.textContent=r.error.message||'Unable to submit the return request.';btn.disabled=false;return}msg.className='message success';msg.textContent='Return request submitted successfully.';document.getElementById('form').reset();await loadReturns();btn.disabled=false};init();
</script></body></html>

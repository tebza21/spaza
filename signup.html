<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account | Spaza</title><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header"><a class="logo-wrap" href="index.html"><img class="site-logo" src="images/spaza-logo.png" alt="Spaza"></a><div class="header-actions"><a href="shop.html">Shop</a><a href="login.html?role=customer">Sign in</a></div></header><main class="simple-page auth-page"><div class="auth-box"><p class="eyebrow">CUSTOMER ACCOUNT</p><h1>Create your account</h1><p>Start shopping on Spaza and manage your orders from one place.</p><form id="signupForm"><label>Full name<input id="fullName" type="text" required autocomplete="name"></label><label>Email<input id="email" type="email" required autocomplete="email"></label><label>Password<input id="password" type="password" minlength="8" required autocomplete="new-password"></label><label>Confirm password<input id="confirmPassword" type="password" minlength="8" required autocomplete="new-password"></label><label class="check"><input id="terms" type="checkbox" required> I agree to the Spaza terms and customer policies.</label><button class="button primary full" type="submit">Create account</button><p id="message" class="form-message" aria-live="polite"></p></form><p>Already have an account? <a class="text-link" href="login.html?role=customer">Sign in</a></p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="js/supabase-auth.js"></script><script>document.addEventListener('DOMContentLoaded',()=>SpazaAuth.initSignup());</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Help & Support | Spaza</title><link rel="stylesheet" href="css/style.css"><style>.wrap{max-width:1000px;margin:auto;padding:40px 20px}.form,.ticket{border:1px solid #e2e6e8;border-radius:15px;padding:18px;margin:16px 0}.form{display:grid;gap:12px}.form input,.form textarea,.form select{padding:12px;border:1px solid #d7dcdf;border-radius:8px;width:100%;box-sizing:border-box}.tickets{display:grid;gap:12px}.ticket{margin:0}.ticket-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.badge{padding:5px 9px;border-radius:99px;background:#eef2f3;font-size:.8rem}.empty{text-align:center;padding:45px 20px;border:1px dashed #ccd2d5;border-radius:15px}.message{padding:10px 0}</style></head><body><header class="site-header"><a class="logo-wrap" href="index.html"><img class="site-logo" src="images/spaza-logo.png" alt="Spaza"></a><div class="header-actions"><a href="shop.html">Shop</a><a href="account.html">Account</a></div></header><main class="wrap"><p class="eyebrow">CUSTOMER CENTRE</p><h1>Help & Support</h1><p>Create a support ticket and keep the conversation with Spaza in one place.</p><form id="form" class="form"><h2>Contact Support</h2><input name="subject" placeholder="Subject" required><select name="category" required><option value="">Select category</option><option>Order</option><option>Payment</option><option>Delivery</option><option>Return</option><option>Refund</option><option>Account</option><option>Product</option><option>Other</option></select><textarea name="description" rows="6" placeholder="Describe the issue or question" required></textarea><button class="button primary">Submit ticket</button><div id="message" class="message"></div></form><h2>My Support Tickets</h2><div id="tickets" class="tickets"><div class="empty">Loading tickets…</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>let user;const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));const ticketNo=()=>`SPZ-${Date.now().toString().slice(-10)}`;async function load(){const r=await SpazaDB.from('support_tickets').select('id,ticket_number,subject,category,description,status,priority,created_at,updated_at').eq('profile_id',user.id).order('created_at',{ascending:false});if(r.error){tickets.innerHTML='<div class="empty">Support tickets could not be loaded.</div>';return}const rows=r.data||[];tickets.innerHTML=rows.length?rows.map(x=>`<article class="ticket"><div class="ticket-head"><strong>${esc(x.ticket_number)} · ${esc(x.subject)}</strong><span class="badge">${esc(x.status)}</span></div><p>${esc(x.description)}</p><small>${esc(x.category)} · ${new Date(x.created_at).toLocaleString('en-ZA')}</small></article>`).join(''):'<div class="empty">No support tickets yet.</div>'}form.onsubmit=async e=>{e.preventDefault();message.textContent='Submitting…';const o=Object.fromEntries(new FormData(form));const r=await SpazaDB.from('support_tickets').insert({ticket_number:ticketNo(),profile_id:user.id,subject:o.subject,category:o.category,description:o.description,status:'OPEN',priority:'NORMAL'}).select().single();if(r.error){message.textContent=r.error.message;return}message.textContent='Ticket submitted successfully.';form.reset();load()};(async()=>{const r=await SpazaDB.auth.getUser();user=r.data.user;if(!user){location.href='login.html?role=customer';return}load()})();</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seller Documents | Spaza</title><link rel="stylesheet" href="css/style.css"><style>.page{max-width:1180px;margin:auto;padding:40px 20px 70px}.panel{background:#fff;border:1px solid #e1e5e6;border-radius:16px;padding:20px;margin:18px 0}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.toolbar input,.toolbar select{padding:11px;border:1px solid #ddd;border-radius:9px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px 10px;border-bottom:1px solid #edf0f1;white-space:nowrap}.scroll{overflow:auto}.badge{padding:5px 9px;border-radius:999px;background:#eef3f2;font-size:.8rem;font-weight:700}.empty{text-align:center;padding:30px;color:#68727a}.error{background:#fff1f1;color:#8c2525;padding:16px;border-radius:10px}@media(max-width:600px){.page{padding:28px 14px}.toolbar input,.toolbar select{width:100%}}</style></head><body><header class="site-header"><a class="logo-wrap" href="index.html"><img class="site-logo" src="images/spaza-logo.png" alt="Spaza"></a><div class="header-actions"><a href="seller-centre.html">Seller Centre</a><a href="account.html">Account</a></div></header><main class="page"><p class="eyebrow">SELLER CENTRE · FINANCE</p><h1>Invoices &amp; Credit Notes</h1><p>View financial documents belonging to your seller fulfilments.</p><div id="content"><div class="panel empty">Checking seller access…</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=v=>'R'+Number(v||0).toLocaleString('en-ZA',{minimumFractionDigits:2,maximumFractionDigits:2});let docs={invoices:[],credit_notes:[]};function render(){const q=document.getElementById('search').value.trim().toLowerCase(),type=document.getElementById('type').value;const inv=docs.invoices.filter(x=>(!q||[x.invoice_number,x.order_id,x.seller_order_id].join(' ').toLowerCase().includes(q))&&(type==='ALL'||type==='INVOICE'));const cn=docs.credit_notes.filter(x=>(!q||[x.credit_note_number,x.reason,x.reference].join(' ').toLowerCase().includes(q))&&(type==='ALL'||type==='CREDIT_NOTE'));document.getElementById('documents').innerHTML=inv.length||cn.length?`<div class="scroll"><table class="table"><thead><tr><th>Type</th><th>Reference</th><th>Order</th><th>Status</th><th>Total</th><th>Date</th></tr></thead><tbody>${inv.map(x=>`<tr><td>Invoice</td><td><strong>${esc(x.invoice_number)}</strong></td><td>${esc(x.order_id)}</td><td><span class="badge">${esc(x.status)}</span></td><td>${money(x.total)}</td><td>${x.issued_at?new Date(x.issued_at).toLocaleDateString('en-ZA'):'—'}</td></tr>`).join('')}${cn.map(x=>`<tr><td>Credit Note</td><td><strong>${esc(x.credit_note_number)}</strong></td><td>${esc(x.order_id)}</td><td><span class="badge">${esc(x.status)}</span></td><td>${money(x.total)}</td><td>${x.issued_at?new Date(x.issued_at).toLocaleDateString('en-ZA'):'—'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No seller documents yet.</div>'}async function init(){const{data:{user}}=await SpazaDB.auth.getUser();if(!user){location.href='login.html?role=vendor';return}const{data:roles}=await SpazaDB.from('profile_roles').select('roles(code,name)').eq('profile_id',user.id);const ok=(roles||[]).some(x=>['SELLER','PARTNER'].includes(String(x.roles?.code||x.roles?.name||'').toUpperCase()));if(!ok){document.getElementById('content').innerHTML='<div class="panel error">Seller access is not active.</div>';return}const{data,error}=await SpazaDB.rpc('get_my_seller_documents');if(error){document.getElementById('content').innerHTML='<div class="panel error">Unable to load seller documents.</div>';return}docs=data||{};document.getElementById('content').innerHTML='<div class="panel"><div class="toolbar"><input id="search" placeholder="Search document or reference..."><select id="type"><option value="ALL">All documents</option><option value="INVOICE">Invoices</option><option value="CREDIT_NOTE">Credit notes</option></select></div><div id="documents"></div></div><a class="back" href="seller-centre.html">← Back to Seller Centre</a>';document.getElementById('search').oninput=render;document.getElementById('type').onchange=render;render()}init();</script></body></html>

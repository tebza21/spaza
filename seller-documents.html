<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seller Documents | Spaza</title><link rel="stylesheet" href="css/style.css"><style>.page{max-width:1180px;margin:auto;padding:40px 20px 70px}.panel{background:#fff;border:1px solid #e1e5e6;border-radius:16px;padding:20px;margin:18px 0}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.toolbar input,.toolbar select{padding:11px;border:1px solid #ddd;border-radius:9px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px 10px;border-bottom:1px solid #edf0f1;white-space:nowrap}.table tbody tr{cursor:pointer}.table tbody tr:hover{background:#f7f9f9}.scroll{overflow:auto}.badge{padding:5px 9px;border-radius:999px;background:#eef3f2;font-size:.8rem;font-weight:700}.empty{text-align:center;padding:30px;color:#68727a}.error{background:#fff1f1;color:#8c2525;padding:16px;border-radius:10px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.modal.open{display:flex}.dialog{background:#fff;border-radius:16px;max-width:900px;width:100%;max-height:90vh;overflow:auto;padding:24px}.doc-head{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;border-bottom:1px solid #e6e9ea;padding-bottom:16px}.doc-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:20px 0}.doc-box{background:#f7f9f9;border-radius:10px;padding:14px}.doc-items{width:100%;border-collapse:collapse}.doc-items th,.doc-items td{padding:10px;border-bottom:1px solid #e8ebec;text-align:left}.doc-total{text-align:right;font-size:1.1rem;font-weight:800;margin-top:16px}.close{float:right;border:0;background:transparent;font-size:1.4rem;cursor:pointer}@media(max-width:600px){.page{padding:28px 14px}.toolbar input,.toolbar select{width:100%}.doc-grid{grid-template-columns:1fr}}@media print{body>*:not(#modal){display:none!important}.modal{position:static;display:block!important;background:#fff;padding:0}.dialog{max-width:none;max-height:none;box-shadow:none;padding:0}.actions,.close{display:none!important}}
</style></head><body><header class="site-header"><a class="logo-wrap" href="index.html"><img class="site-logo" src="images/spaza-logo.png" alt="Spaza"></a><div class="header-actions"><a href="seller-centre.html">Seller Centre</a><a href="account.html">Account</a></div></header><main class="page"><p class="eyebrow">SELLER CENTRE · FINANCE</p><h1>Invoices &amp; Credit Notes</h1><p>View financial documents belonging to your seller fulfilments. Select a document to open its detail view or print it.</p><div id="content"><div class="panel empty">Checking seller access…</div></div></main><div id="modal" class="modal" role="dialog" aria-modal="true"><div class="dialog"><button class="close" id="closeModal" aria-label="Close">×</button><div id="detail"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=v=>'R'+Number(v||0).toLocaleString('en-ZA',{minimumFractionDigits:2,maximumFractionDigits:2});let docs={invoices:[],credit_notes:[]};const modal=document.getElementById('modal');const detail=document.getElementById('detail');document.getElementById('closeModal').onclick=()=>modal.classList.remove('open');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};document.addEventListener('keydown',e=>{if(e.key==='Escape')modal.classList.remove('open')});function render(){const q=document.getElementById('search').value.trim().toLowerCase(),type=document.getElementById('type').value;const inv=docs.invoices.filter(x=>(!q||[x.invoice_number,x.order_id,x.seller_order_id].join(' ').toLowerCase().includes(q))&&(type==='ALL'||type==='INVOICE'));const cn=docs.credit_notes.filter(x=>(!q||[x.credit_note_number,x.reason,x.reference].join(' ').toLowerCase().includes(q))&&(type==='ALL'||type==='CREDIT_NOTE'));document.getElementById('documents').innerHTML=inv.length||cn.length?`<div class="scroll"><table class="table"><thead><tr><th>Type</th><th>Reference</th><th>Order</th><th>Status</th><th>Total</th><th>Date</th></tr></thead><tbody>${inv.map((x,i)=>`<tr data-type="invoice" data-index="${i}"><td>Invoice</td><td><strong>${esc(x.invoice_number)}</strong></td><td>${esc(x.order_id)}</td><td><span class="badge">${esc(x.status)}</span></td><td>${money(x.total)}</td><td>${x.issued_at?new Date(x.issued_at).toLocaleDateString('en-ZA'):'—'}</td></tr>`).join('')}${cn.map((x,i)=>`<tr data-type="credit" data-index="${i}"><td>Credit Note</td><td><strong>${esc(x.credit_note_number)}</strong></td><td>${esc(x.order_id)}</td><td><span class="badge">${esc(x.status)}</span></td><td>${money(x.total)}</td><td>${x.issued_at?new Date(x.issued_at).toLocaleDateString('en-ZA'):'—'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No seller documents yet.</div>';document.querySelectorAll('#documents tr[data-type]').forEach(r=>r.onclick=()=>openDocument(r.dataset.type,Number(r.dataset.index),r.dataset.type==='invoice'?inv:cn))}async function openDocument(type,index,list){const d=list[index];detail.innerHTML='<p class="empty">Loading document…</p>';modal.classList.add('open');if(type==='invoice'){const{data:items,error}=await SpazaDB.from('invoice_items').select('product_name,quantity,unit_price,line_total,seller_name').eq('invoice_id',d.id).order('created_at',{ascending:true});if(error){detail.innerHTML='<div class="error">Unable to load invoice details.</div>';return}detail.innerHTML=`<div class="doc-head"><div><p class="eyebrow">SPAZA INVOICE</p><h2>${esc(d.invoice_number)}</h2><p>Status: <span class="badge">${esc(d.status)}</span></p></div><div><strong>${money(d.total)}</strong><br><small>${d.issued_at?new Date(d.issued_at).toLocaleString('en-ZA'):'—'}</small></div></div><div class="doc-grid"><div class="doc-box"><strong>Order</strong><br>${esc(d.order_id)}<br><strong>Seller fulfilment</strong><br>${esc(d.seller_order_id)}</div><div class="doc-box"><strong>Tax status</strong><br>${esc(d.tax_status)}<br><strong>Tax rate</strong><br>${esc(d.tax_rate_percent)}%</div></div><table class="doc-items"><thead><tr><th>Item</th><th>Qty</th><th>Unit</th><th>Line total</th></tr></thead><tbody>${(items||[]).map(x=>`<tr><td>${esc(x.product_name)}</td><td>${esc(x.quantity)}</td><td>${money(x.unit_price)}</td><td>${money(x.line_total)}</td></tr>`).join('')||'<tr><td colspan="4">No invoice items.</td></tr>'}</tbody></table><p class="doc-total">Subtotal ${money(d.subtotal)} · Delivery ${money(d.delivery_total)} · Tax ${money(d.tax_total)} · Total ${money(d.total)}</p><div class="actions"><button class="button primary" onclick="window.print()">Print invoice</button><button class="button" onclick="modal.classList.remove('open')">Close</button></div>`}else{const{data:items,error}=await SpazaDB.from('credit_note_items').select('product_name,quantity,unit_price,line_total,tax_rate_percent,tax_amount').eq('credit_note_id',d.id).order('created_at',{ascending:true});if(error){detail.innerHTML='<div class="error">Unable to load credit note details.</div>';return}detail.innerHTML=`<div class="doc-head"><div><p class="eyebrow">SPAZA CREDIT NOTE</p><h2>${esc(d.credit_note_number)}</h2><p>Status: <span class="badge">${esc(d.status)}</span></p></div><div><strong>${money(d.total)}</strong><br><small>${d.issued_at?new Date(d.issued_at).toLocaleString('en-ZA'):'—'}</small></div></div><div class="doc-grid"><div class="doc-box"><strong>Original invoice</strong><br>${esc(d.invoice_id)}<br><strong>Order</strong><br>${esc(d.order_id)}</div><div class="doc-box"><strong>Reason</strong><br>${esc(d.reason)}<br><strong>Reference</strong><br>${esc(d.reference)}</div></div><table class="doc-items"><thead><tr><th>Item</th><th>Qty</th><th>Unit</th><th>Line total</th></tr></thead><tbody>${(items||[]).map(x=>`<tr><td>${esc(x.product_name)}</td><td>${esc(x.quantity)}</td><td>${money(x.unit_price)}</td><td>${money(x.line_total)}</td></tr>`).join('')||'<tr><td colspan="4">No credit note items.</td></tr>'}</tbody></table><p class="doc-total">Subtotal ${money(d.subtotal)} · Tax ${money(d.tax_total)} · Credit note total ${money(d.total)}</p><div class="actions"><button class="button primary" onclick="window.print()">Print credit note</button><button class="button" onclick="modal.classList.remove('open')">Close</button></div>`}}async function init(){const{data:{user}}=await SpazaDB.auth.getUser();if(!user){location.href='login.html?role=vendor';return}const{data:roles}=await SpazaDB.from('profile_roles').select('roles(code,name)').eq('profile_id',user.id);const ok=(roles||[]).some(x=>['SELLER','PARTNER'].includes(String(x.roles?.code||x.roles?.name||'').toUpperCase()));if(!ok){document.getElementById('content').innerHTML='<div class="panel error">Seller access is not active.</div>';return}const{data,error}=await SpazaDB.rpc('get_my_seller_documents');if(error){document.getElementById('content').innerHTML='<div class="panel error">Unable to load seller documents.</div>';return}docs=data||{};document.getElementById('content').innerHTML='<div class="panel"><div class="toolbar"><input id="search" placeholder="Search document or reference..."><select id="type"><option value="ALL">All documents</option><option value="INVOICE">Invoices</option><option value="CREDIT_NOTE">Credit notes</option></select></div><div id="documents"></div></div><a class="back" href="seller-centre.html">← Back to Seller Centre</a>';document.getElementById('search').oninput=render;document.getElementById('type').onchange=render;render()}init();</script></body></html>

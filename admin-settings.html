<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPAZA — System Settings</title><link rel="stylesheet" href="css/style.css"><style>.wrap{max-width:1100px;margin:auto;padding:32px 18px 70px}.panel{background:#fff;border:1px solid #e2e6e7;border-radius:16px;padding:20px;margin-top:20px}.form{display:grid;gap:12px}.form input,.form textarea{padding:11px;border:1px solid #ddd;border-radius:8px;width:100%;box-sizing:border-box}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.toolbar input{padding:11px;border:1px solid #ddd;border-radius:8px;width:min(420px,100%)}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px 9px;border-bottom:1px solid #edf0f1}.badge{padding:4px 8px;border-radius:999px;background:#eef2f1;font-size:.76rem;font-weight:700}@media(max-width:650px){.table th,.table td{white-space:nowrap}}</style></head><body><header class="site-header"><a class="logo-wrap" href="index.html"><img class="site-logo" src="images/spaza-logo.png" alt="Spaza"></a><div class="header-actions"><a href="admin-audit.html">Audit</a><a href="admin-finance.html">Finance</a></div></header><main class="wrap"><p class="eyebrow">ADMIN CENTRE</p><h1>System Settings &amp; Configuration</h1><p class="page-intro">Central configuration for non-secret marketplace settings. Provider secrets remain in secure server-side configuration and are never stored here.</p><div id="gate" class="panel">Checking administrator access…</div><section id="content" hidden><div class="panel"><h2>Save setting</h2><form id="form" class="form"><input id="key" required placeholder="Setting key e.g. marketplace.currency"><textarea id="value" rows="4" required placeholder='JSON value, e.g. {"value":"ZAR"}'></textarea><input id="description" placeholder="Description"><label><input id="sensitive" type="checkbox" style="width:auto"> Mark as sensitive (display only; do not put secrets here)</label><button class="button" type="submit">Save setting</button></form></div><div class="panel"><h2>Configured settings</h2><div class="toolbar"><input id="q" placeholder="Search settings"></div><div id="table" style="margin-top:15px">Loading…</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const db=SpazaDB,esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let rows=[];async function init(){const{data:{user}}=await db.auth.getUser();if(!user){location.href='login.html';return}const{data:r,error}=await db.from('profile_roles').select('roles(code)').eq('profile_id',user.id);if(error)throw error;if(!(r||[]).some(x=>['ADMIN','OWNER'].includes(String(x.roles?.code||'').toUpperCase()))){gate.innerHTML='<strong>Administrator or owner access required.</strong>';return}gate.remove();content.hidden=false;await load()}async function load(){const{data,error}=await db.from('system_settings').select('setting_key,setting_value,description,is_sensitive,updated_at').order('setting_key');if(error)throw error;rows=data||[];render()}function render(){const q=document.getElementById('q').value.toLowerCase(),a=rows.filter(x=>!q||JSON.stringify(x).toLowerCase().includes(q));table.innerHTML=!a.length?'<div style="text-align:center;padding:45px"><strong>No settings configured.</strong><p>The database currently has no marketplace configuration records.</p></div>':'<div class="table-wrap"><table class="table"><thead><tr><th>Key</th><th>Value</th><th>Description</th><th>Updated</th></tr></thead><tbody>'+a.map(x=>`<tr><td>${esc(x.setting_key)}</td><td>${x.is_sensitive?'<span class="badge">SENSITIVE</span>':esc(JSON.stringify(x.setting_value))}</td><td>${esc(x.description)}</td><td>${new Date(x.updated_at).toLocaleString('en-ZA')}</td></tr>`).join('')+'</tbody></table></div>'}form.addEventListener('submit',async e=>{e.preventDefault();let v;try{v=JSON.parse(value.value)}catch{alert('Setting value must be valid JSON.');return}const{error}=await db.rpc('admin_save_system_setting',{p_key:key.value,p_value:v,p_description:description.value||null,p_is_sensitive:sensitive.checked});if(error){alert(error.message);return}form.reset();await load()});q.addEventListener('input',render);init().catch(e=>gate.innerHTML='<strong>Settings could not load.</strong><p>'+esc(e.message)+'</p>');</script></body></html>

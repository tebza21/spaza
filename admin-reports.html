<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPAZA — Accounting Reports</title><link rel="stylesheet" href="css/style.css"><style>.wrap{max-width:1250px;margin:auto;padding:32px 18px 70px}.panel{background:#fff;border:1px solid #e2e6e7;border-radius:16px;padding:20px;margin-top:20px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button{padding:10px 14px;border:1px solid #ddd;border-radius:8px;background:#fff;cursor:pointer}.tabs button.active{font-weight:800}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px 9px;border-bottom:1px solid #edf0f1;white-space:nowrap}.right{text-align:right!important}.summary{display:flex;gap:25px;flex-wrap:wrap;margin-top:15px}.summary strong{font-size:1.2rem}.note{color:#596363;font-size:.9rem}</style></head><body><header class="site-header"><a class="logo-wrap" href="index.html"><img class="site-logo" src="images/spaza-logo.png" alt="Spaza"></a><div class="header-actions"><a href="admin-finance.html">Finance</a><a href="admin-operations.html">Operations</a></div></header><main class="wrap"><p class="eyebrow">ADMIN CENTRE</p><h1>Accounting Reports</h1><p class="page-intro">Financial statements generated from posted journal entries. Empty results are intentional until real accounting events occur.</p><div id="gate" class="panel">Checking finance access…</div><section id="content" hidden><div class="panel"><div class="tabs"><button class="active" data-r="trial">Trial Balance</button><button data-r="income">Income Statement</button><button data-r="balance">Balance Sheet</button></div><p class="note">Reports use the accounting ledger and do not create or modify transactions.</p><div id="report">Loading…</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const db=SpazaDB,esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let mode='trial';async function init(){const{data:{user}}=await db.auth.getUser();if(!user){location.href='login.html';return}const{data:r,error}=await db.from('profile_roles').select('roles(code)').eq('profile_id',user.id);if(error)throw error;const ok=(r||[]).some(x=>['ADMIN','OWNER','FINANCE'].includes(String(x.roles?.code||'').toUpperCase()));if(!ok){gate.innerHTML='<strong>Finance access required.</strong>';return}gate.remove();content.hidden=false;await render()}async function render(){let table,title,heads;if(mode==='trial'){table='v_trial_balance';title='Trial Balance';heads=['Code','Account','Type','Debit','Credit','Net Balance']}else if(mode==='income'){table='v_income_statement';title='Income Statement';heads=['Code','Account','Type','Amount']}else{table='v_balance_sheet';title='Balance Sheet';heads=['Code','Account','Type','Amount']}const{data,error}=await db.from(table).select('*').order('account_code');if(error){report.innerHTML='<strong>Report unavailable.</strong><p>'+esc(error.message)+'</p>';return}const rows=data||[];if(!rows.length){report.innerHTML='<div style="text-align:center;padding:50px"><strong>'+title+' has no posted balances.</strong><p>Once legitimate marketplace transactions are posted, this report will calculate automatically.</p></div>';return}let html='<h2>'+title+'</h2><div class="table-wrap"><table class="table"><thead><tr>'+heads.map((h,i)=>'<th class="'+(i>=3?'right':'')+'">'+h+'</th>').join('')+'</tr></thead><tbody>';rows.forEach(x=>{html+='<tr><td>'+esc(x.account_code)+'</td><td>'+esc(x.account_name)+'</td><td>'+esc(x.account_type)+'</td>';if(mode==='trial')html+='<td class="right">R'+Number(x.total_debit||0).toFixed(2)+'</td><td class="right">R'+Number(x.total_credit||0).toFixed(2)+'</td><td class="right">R'+Number(x.net_balance||0).toFixed(2)+'</td>';else html+='<td class="right">R'+Number(x.amount||0).toFixed(2)+'</td>';html+='</tr>'});html+='</tbody></table></div>';report.innerHTML=html}document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.r;render()}));init().catch(e=>gate.innerHTML='<strong>Reports centre could not load.</strong><p>'+esc(e.message)+'</p>');</script></body></html>

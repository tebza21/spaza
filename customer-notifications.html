<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications | Spaza</title><link rel="stylesheet" href="css/style.css"><style>.wrap{max-width:900px;margin:auto;padding:40px 20px}.toolbar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:20px 0}.notice{border:1px solid #e2e6e8;border-radius:14px;padding:17px;margin-bottom:12px}.notice.unread{border-left:4px solid #111;background:#fafafa}.notice-head{display:flex;justify-content:space-between;gap:12px}.meta{color:#69727a;font-size:.85rem}.empty{text-align:center;padding:55px 20px;border:1px dashed #ccd2d5;border-radius:15px}</style></head><body><header class="site-header"><a class="logo-wrap" href="index.html"><img class="site-logo" src="images/spaza-logo.png" alt="Spaza"></a><div class="header-actions"><a href="shop.html">Shop</a><a href="account.html">Account</a></div></header><main class="wrap"><p class="eyebrow">CUSTOMER CENTRE</p><h1>Notifications</h1><p>Important updates about your Spaza orders, payments, deliveries, reviews and support.</p><div class="toolbar"><strong id="count">Loading…</strong><button class="button secondary" id="readAll">Mark all as read</button></div><div id="list"><div class="empty">Loading notifications…</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>let user,rows=[];const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));async function load(){const r=await SpazaDB.from('notifications').select('*').eq('profile_id',user.id).order('created_at',{ascending:false});if(r.error){list.innerHTML='<div class="empty">Notifications could not be loaded.</div>';return}rows=r.data||[];count.textContent=rows.filter(x=>!x.is_read).length+' unread';list.innerHTML=rows.length?rows.map(x=>`<article class="notice ${x.is_read?'':'unread'}"><div class="notice-head"><strong>${esc(x.title)}</strong>${!x.is_read?`<button class="button secondary" onclick="markRead('${x.id}')">Mark read</button>`:''}</div><p>${esc(x.message)}</p><div class="meta">${esc(x.notification_type)} · ${new Date(x.created_at).toLocaleString('en-ZA')}</div></article>`).join(''):'<div class="empty"><h2>You’re all caught up</h2><p>New order and support updates will appear here.</p></div>'}window.markRead=async id=>{const {error}=await SpazaDB.from('notifications').update({is_read:true,read_at:new Date().toISOString()}).eq('id',id).eq('profile_id',user.id);if(error)alert(error.message);else load()};readAll.onclick=async()=>{const {error}=await SpazaDB.from('notifications').update({is_read:true,read_at:new Date().toISOString()}).eq('profile_id',user.id).eq('is_read',false);if(error)alert(error.message);else load()};(async()=>{const r=await SpazaDB.auth.getUser();user=r.data.user;if(!user){location.href='login.html?role=customer';return}load()})();</script></body></html>
